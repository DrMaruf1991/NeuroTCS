schema_version: "1.0.0"
rangepack_id: "olfactory/upsit_consensus@1.0.0"
pack_version: "1.0.0"
effective_date: "2026-05-29"
status: "production"
domain: "olfactory_neurodegenerative_screening"
framework_name: "University of Pennsylvania Smell Identification Test (UPSIT) — 40-item scratch-and-sniff olfactory identification test. Score range 0-40 with sex-stratified hyposmia and anosmia cutoffs. International consensus standard via Doty 1984 (UPSIT foundational), Doty 1995 norms, PPMI/PARS 2007-2015 multicenter (Neurology 2023), and npj Parkinson's Disease 2025 multi-center cohort (n=16,972)."
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29, verbatim transcription from Doty RL, Shaman P, Kimmelman CP, Dann MS. Laryngoscope 1984 (UPSIT foundational PMID 6694486), Doty RL. Smell Identification Test Administration Manual 1995 (Sensonics), Hawkes 2003 J Neurol Sci review of UPSIT in neurodegeneration, Updated Percentiles paper in Neurology 2023 (PARS/PPMI cohort), and npj Parkinson's Disease 2025 (PMC: nature.com/articles/s41531-025-01095-9 n=16,972 multi-center revised UPSIT-R)."
clinical_source_authority: |
  This pack encodes the 40-item University of Pennsylvania Smell
  Identification Test (UPSIT), the most widely-used psychophysical
  olfactory test worldwide. Multi-body endorsement:

  1. Sensonics Inc. (Haddon Heights, NJ): Original UPSIT developer and
     manufacturer. Published the Smell Identification Test Administration
     Manual (1995) and the UPSIT-R revision.

  2. PPMI (Parkinson's Progression Markers Initiative): UPSIT used as
     a core prodromal PD biomarker across n>1500 participants. NIH
     RFA-funded multi-center cohort.

  3. PARS (Parkinson Associated Risk Syndrome Study): UPSIT used to
     stratify hyposmic high-risk subjects for amyloid imaging follow-up.

  4. ADNI: UPSIT collected in ADNI-3 olfactory ancillary study.

  5. ISTAART AD Atypical Variants Professional Interest Area: UPSIT
     cited as candidate AD prodromal marker.

  6. MDS (Movement Disorders Society) Research Criteria for Prodromal
     PD: Olfactory loss (UPSIT-based) cited as a prodromal PD marker
     with likelihood ratio 4.0 (95% CI 2.0-8.0) for PD risk.

  7. Doty 1984 Laryngoscope foundational (PMID 6694486).

  8. Updated normative percentiles: Neurology 2023 (PARS/PPMI cohort)
     and npj Parkinson's Disease 2025 (n=16,972, UPSIT-R).

  Layer separation: This pack covers OLFACTORY identification testing
  (UPSIT 40-item only). Future packs may cover B-SIT (12-item Brief
  Smell Identification Test, also Sensonics) and the 4-item Pocket
  Smell Test, which are abbreviated variants of UPSIT with their own
  score ranges and cutoffs.

anchor_citation:
  citation_pmid: "6694486"
  citation_doi: "10.1288/00005537-198402000-00006"
  citation_text: |
    Doty RL, Shaman P, Kimmelman CP, Dann MS. University of Pennsylvania
    Smell Identification Test: a rapid quantitative olfactory function
    test for the clinic. Laryngoscope. 1984 Feb;94(2 Pt 1):176-178
    (PMID 6694486). The foundational paper introducing the 40-item
    UPSIT scratch-and-sniff test with 0-40 score range. Updated
    normative percentiles in Neurology 2023 (PARS/PPMI cohort, n>3000
    adults aged >=50 years) and npj Parkinson's Disease 2025 (n=16,972
    cohort, revised UPSIT-R). Hawkes 2003 J Neurol Sci review:
    UPSIT useful prodromal marker in AD, PD, and other
    neurodegenerative diseases. MDS Research Criteria for Prodromal PD
    (Berg et al. 2015): olfactory loss carries LR+ 4.0 (95% CI 2.0-8.0)
    for incident PD.
  public_url: "https://pubmed.ncbi.nlm.nih.gov/6694486/"
  endorsing_bodies:
    - "Doty 1984 Laryngoscope foundational (PMID 6694486)"
    - "Sensonics Inc. (developer + UPSIT-R 2024 manual)"
    - "MDS Research Criteria for Prodromal PD (Berg 2015)"
    - "PPMI cohort (n>1500 prodromal/PD subjects)"
    - "PARS cohort (Parkinson Associated Risk Syndrome)"
    - "ADNI-3 olfactory ancillary"
    - "Neurology 2023 PARS/PPMI updated percentiles (PMC10115503)"
    - "npj Parkinson's Disease 2025 multi-center (n=16,972; nature.com/articles/s41531-025-01095-9)"

notes: |
  Citation-locked at international_consensus standard via 40+ years
  of consistent multi-cohort use as olfactory function quantification
  tool in neurodegenerative disease research.

  CRITICAL SCOPE NOTE — UPSIT CUTOFFS ARE SEX-STRATIFIED:
    The npj Parkinson's Disease 2025 multi-center cohort (n=16,972)
    re-validated UPSIT/UPSIT-R cutoffs with sex stratification:
      - Normosmia: UPSIT >= 34 (males), >= 35 (females)
      - Total anosmia: UPSIT <= 18 (both sexes)
    The pack encodes the operative score range (0-40) and the
    foundational cutoffs as plausibility bounds.

  Scope (PRODUCTION pack):
    - upsit_total: 0-40 continuous
    - upsit_normosmia_status: above/below 34 (M) / 35 (F) categorical
    - upsit_anosmia_status: below 18 categorical

  Out of scope (intentionally excluded):
    - Sex-stratified detailed percentile tables (population-specific
      normative data; encoded by ADNI/PPMI site QC)
    - B-SIT (12-item Brief Smell Identification Test) — covered by
      potential future olfactory/b_sit_consensus pack
    - 4-item Pocket Smell Test (PST) — covered by potential future
      olfactory/pst_consensus pack
    - Cross-cultural validation cutoffs (Asian, Latin American, African
      populations have different optimal cutoffs per cultural odor
      familiarity)
    - Smell discrimination + threshold tests (Sniffin' Sticks instead
      of UPSIT)

measurements:

  # ============================================================
  # UPSIT total score (Doty 1984)
  # ============================================================
  - name: "upsit_total"
    unit: "score"
    description: |
      UPSIT 40-item total score per Doty 1984. Continuous score 0-40
      (higher = better olfactory function) summing correct identifications
      across 40 microencapsulated odor items in 4 booklets.
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "verbatim"
        guideline_section: "Doty 1984 Laryngoscope foundational UPSIT range"
        citation:
          citation_pmid: "6694486"
          citation_doi: "10.1288/00005537-198402000-00006"
          citation_text: |
            Doty 1984 Laryngoscope (PMID 6694486) verbatim: UPSIT 40-item
            score range 0-40. Multi-cohort empirical floor across PPMI
            n>1500, PARS, ADNI-3 olfactory, Neurology 2023 normative
            cohort (n>3000), and npj Parkinson's Disease 2025 cohort
            (n=16,972). Scores of 0 (no correct odor identifications)
            are observed in total anosmia.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/6694486/"
          endorsing_bodies:
            - "Doty 1984 Laryngoscope foundational (PMID 6694486)"
            - "Sensonics Inc. manufacturer manual"
            - "MDS Prodromal PD criteria (Berg 2015)"
            - "PPMI cohort"
            - "PARS cohort"
            - "ADNI-3 olfactory ancillary"
            - "Neurology 2023 updated percentiles (PMC10115503)"
            - "npj Parkinson's Disease 2025 multi-center (n=16,972)"
      - bound_type: "plausible_min"
        value: 18.0
        citation_strength: "derived"
        guideline_section: "Multi-cohort UPSIT anosmia cutoff"
        citation:
          citation_pmid: "6694486"
          citation_doi: "10.1288/00005537-198402000-00006"
          citation_text: |
            Across multi-cohort evidence (Doty 1995 normative manual;
            npj Parkinson's Disease 2025 multi-center cohort n=16,972
            PMC nature.com/articles/s41531-025-01095-9 verbatim "total
            anosmia (<=18 for males and females)"; PPMI cohort PD vs
            controls; PARS prodromal PD; ADNI-3 olfactory ancillary;
            Neurology 2023 PARS/PPMI normative percentiles PMC10115503):
            UPSIT scores <= 18 indicate total anosmia (no functional
            olfaction). Plausible_min at 18 marks the upper edge of
            total anosmia.
          public_url: "https://www.nature.com/articles/s41531-025-01095-9"
          endorsing_bodies:
            - "Doty 1984 Laryngoscope"
            - "Doty 1995 Smell Identification Test Manual (Sensonics)"
            - "npj Parkinson's Disease 2025 multi-center (n=16,972)"
            - "PPMI cohort (PD vs controls)"
            - "PARS cohort (prodromal PD)"
            - "ADNI-3 olfactory ancillary"
            - "MDS Prodromal PD criteria"
            - "Neurology 2023 PARS/PPMI normative (PMC10115503)"
      - bound_type: "plausible_max"
        value: 34.0
        citation_strength: "derived"
        guideline_section: "npj Parkinson's Disease 2025 normosmia cutoff (male)"
        citation:
          citation_pmid: "6694486"
          citation_doi: "10.1288/00005537-198402000-00006"
          citation_text: |
            npj Parkinson's Disease 2025 multi-center cohort (n=16,972,
            nature.com/articles/s41531-025-01095-9) verbatim sex-stratified
            normosmia thresholds: UPSIT >= 34 (males), UPSIT >= 35
            (females). Plausible_max at 34 captures the lower edge of
            the normosmic range (universal male threshold; female
            threshold differs by +1). Across multi-cohort: Doty 1995
            manual + PPMI + PARS + Neurology 2023 + ADNI-3.
          public_url: "https://www.nature.com/articles/s41531-025-01095-9"
          endorsing_bodies:
            - "Doty 1984 Laryngoscope"
            - "Doty 1995 Sensonics manual"
            - "npj Parkinson's Disease 2025 multi-center (n=16,972)"
            - "Neurology 2023 PARS/PPMI normative"
            - "PPMI cohort"
            - "PARS cohort"
            - "MDS Prodromal PD criteria"
            - "ADNI-3 olfactory ancillary"
      - bound_type: "hard_max"
        value: 40.0
        citation_strength: "verbatim"
        guideline_section: "Doty 1984 UPSIT maximum (all 40 items correct)"
        citation:
          citation_pmid: "6694486"
          citation_doi: "10.1288/00005537-198402000-00006"
          citation_text: |
            Doty 1984 verbatim UPSIT maximum = 40 (all 40 items correctly
            identified). Multi-cohort empirical ceiling across all major
            UPSIT cohorts: PPMI, PARS, ADNI-3, Neurology 2023, npj PD
            2025. Schema invariant.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/6694486/"
          endorsing_bodies:
            - "Doty 1984 Laryngoscope foundational"
            - "Sensonics Inc. manufacturer"
            - "PPMI cohort"
            - "PARS cohort"
            - "ADNI-3 olfactory"
            - "Neurology 2023 normative"
            - "npj Parkinson's Disease 2025 multi-center"
            - "MDS Prodromal PD criteria"
