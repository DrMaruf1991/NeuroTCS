pack_version: 0.1.0
effective_date: '2026-05-29'
status: research_preview
domain: csf_biomarkers
framework_name: 'CSF synaptic and microglial panel: SNAP-25, neurogranin, GAP-43, YKL-40, sTREM2. AA-2024
  ATX(N) candidates (S-marker / X-marker). Closes the synaptic-panel P2 gap from the v1.26 coverage analysis.
  RESEARCH PREVIEW: cohort distributions known but no consensus cutoffs.'
transcribed_by: Salokhiddinov M, MD PhD (KIUT), 2026-05-29. Plausibility envelopes grounded in Ma 2020
  CABLE study CSF sTREM2 (Mol Neurodegener 2020;15:25, DOI 10.1186/s13024-020-00374-8), Heslegrave 2016
  (Mol Neurodegener 2016;11:3), Wellington 2015 (Neurology) on CSF neurogranin/YKL-40, and Brinkmalm 2014
  on CSF SNAP-25. CSF sTREM2 typically thousands of pg/mL; CSF YKL-40 typically hundreds of ng/mL; CSF
  SNAP-25/neurogranin/GAP-43 typically tens-hundreds of pg/mL.
clinical_source_authority: NeuroTCS audits CSF synaptic-marker values produced by ELISA/mass-spec assays.
  RESEARCH PREVIEW plausibility envelopes; NOT diagnostic cutoffs. No internationally agreed quantitative
  cutoffs as of 2026 (FNIH consortium characterization ongoing). audit_clinical_ranges() refuses these
  for production.
anchor_citation:
  citation_text: 'Ma LZ, Tan L, Bi YL, et al. Dynamic changes of CSF sTREM2 in preclinical Alzheimer''s
    disease: the CABLE study. Mol Neurodegener 2020;15:25. DOI 10.1186/s13024-020-00374-8. CSF sTREM2
    trajectory across NIA-AA preclinical stages (CABLE n=659).'
  public_url: https://doi.org/10.1186/s13024-020-00374-8
