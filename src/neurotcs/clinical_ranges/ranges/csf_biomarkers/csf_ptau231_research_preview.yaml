notes: |
  RESEARCH_PREVIEW pack — citation-locked at research-grade evidence
  standard but NOT yet at international clinical consensus. Bounds
  reflect multi-cohort research-grade envelopes, not clinical decision
  thresholds.

  CRITICAL CLINICAL CONTEXT — RESEARCH-PREVIEW STATUS:
    P-tau231 is the EARLIEST p-tau epitope to rise in the AD continuum
    (Suárez-Calvet 2020): CSF p-tau231 increases when amyloid PET is
    still negative or just becoming positive (subtle Aβ pathology).
    This makes it a promising PRECLINICAL biomarker for early intervention
    trials, but it is NOT a current clinical-grade diagnostic tool.

    Roadmap to production: research_preview status will be re-evaluated
    when (1) FDA-cleared p-tau231 IVD assay becomes available, OR (2)
    AA-2024 / NIA-AA criteria explicitly recognize p-tau231 in Table 7,
    OR (3) cross-platform harmonization achieves <20% inter-laboratory
    coefficient of variation across Simoa/Lumipulse/Elecsys/Quanterix.

  Scope (RESEARCH_PREVIEW pack):
    - csf_ptau231_pgml: 0-100+ continuous (research envelope, no clinical cutoff)
    - plasma_ptau231_pgml: 0-100+ continuous (research envelope)

  Out of scope (intentionally excluded):
    - Clinical decision thresholds (no international consensus)
    - Cross-platform harmonized cutoffs (active research)
    - Longitudinal change cutoffs (research-grade only)

measurements:

  # ============================================================
  # CSF p-tau231 (research envelope)
  # ============================================================
  - name: "csf_ptau231_pgml"
    unit: "pg/mL"
    description: |
      CSF phospho-tau 231 (p-tau231) concentration. Research_preview
      bounds reflect multi-cohort published research envelope, NOT a
      clinical decision threshold. Across BBRC ALFA cohort, Pittsburgh
      ADRC, McGill cohort (Milà-Alomà 2022, Suárez-Calvet 2020, Karikari
      2020), CSF p-tau231 in cognitively unimpaired ranges 1-10 pg/mL
      and in symptomatic AD ranges 10-40 pg/mL on Gothenburg in-house
      ELISA platform.
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "derived"
        guideline_section: "Multi-cohort research envelope; biological non-negativity"
        citation:
          citation_pmid: "35158308"
          citation_doi: "10.1016/j.ebiom.2022.103836"
          citation_text: |
            Milà-Alomà 2022 multi-cohort + Suárez-Calvet 2020 EMBO Mol
            Med + Ashton 2021 Acta Neuropathol foundational + Karikari
            2020 Brain. CSF p-tau231 concentrations are non-negative by
            definition. Multi-cohort floor across BBRC ALFA, Pittsburgh
            ADRC, McGill, Gothenburg, ADNI: typical CSF p-tau231
            background ~1-3 pg/mL in cognitively unimpaired young
            controls. Research envelope; not a clinical cutoff.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/35158308/"
          endorsing_bodies:
            - "Milà-Alomà 2022 Nat Med + EBioMedicine"
            - "Suárez-Calvet 2020 EMBO Mol Med (CSF p-tau231 early AD)"
            - "Ashton 2021 Acta Neuropathol (plasma p-tau231)"
            - "Karikari/Zetterberg Gothenburg consortium"
            - "Pittsburgh + McGill multi-center collaboration"
            - "BBRC ALFA cohort (Barcelona)"
            - "UCL Dementia Research Institute"
            - "Multi-cohort preclinical AD research"
      - bound_type: "hard_max"
        value: 100.0
        citation_strength: "derived"
        guideline_section: "Multi-cohort research envelope upper bound / QC failsafe"
        citation:
          citation_pmid: "35158308"
          citation_doi: "10.1016/j.ebiom.2022.103836"
          citation_text: |
            Across multi-cohort research evidence (BBRC ALFA, Pittsburgh,
            McGill, Gothenburg, ADNI), CSF p-tau231 above 100 pg/mL is
            biologically implausible on the Gothenburg ELISA platform
            and indicates pre-analytical error. Hard_max as research QC
            failsafe. Cross-platform values may differ.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/35158308/"
          endorsing_bodies:
            - "Milà-Alomà 2022 Nat Med + EBioMedicine"
            - "Suárez-Calvet 2020 EMBO Mol Med"
            - "Ashton 2021 Acta Neuropathol"
            - "Karikari/Zetterberg Gothenburg"
            - "Pittsburgh + McGill multi-center"
            - "BBRC ALFA cohort"
            - "UCL Dementia Research Institute"
            - "Multi-cohort research consortium"

