status: "research_preview"
domain: "csf_plasma_ptau231_preclinical"
framework_name: "Phospho-tau 231 (p-tau231) in CSF and plasma — research-grade preclinical AD biomarker. P-tau231 increases EARLY in the AD continuum, prior to amyloid PET positivity. NOT FDA-cleared as of pack effective date 2026-05-29. Multi-cohort research validation via Ashton 2021 / Suarez-Calvet 2021 / Milà-Alomà 2022."
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29, verbatim transcription from Ashton NJ et al. Acta Neuropathol 2021 (plasma p-tau231 validation), Suárez-Calvet M, Karikari TK, Ashton NJ et al. EMBO Mol Med 2020 (CSF p-tau231 preclinical AD), Milà-Alomà M et al. EBioMedicine 2022 PMID 35158308 (CSF p-tau231 early indicator of emerging pathology), and Vromen 2022 (PMC8919211 review of p-tau231 as preclinical AD biomarker)."
clinical_source_authority: |
  This research_preview pack encodes p-tau231 (in CSF and plasma) as
  an EMERGING preclinical AD biomarker. Status is research_preview
  (NOT production) because:

  1. NO FDA clearance: Unlike CSF p-tau181 + t-tau (Lumipulse platform
     FDA-cleared K191381), there is no FDA-cleared p-tau231 IVD assay
     as of pack effective date.

  2. NO international clinical consensus cutoffs: Cross-platform values
     vary widely (Simoa vs Lumipulse vs Elecsys vs Quanterix; Suárez-
     Calvet 2020, Ashton 2021, Milà-Alomà 2022). The AA-2024 NIA-AA
     Revised Criteria does NOT list p-tau231 in Table 7 Core 1 T1 or
     Core 2 biomarker classification.

  3. STILL RESEARCH-GRADE: Active multi-center harmonization ongoing
     (Karikari/Ashton/Zetterberg Gothenburg + Pittsburgh + McGill +
     Barcelona); no AA-2024 endorsement, no FDA submission.

  This pack mirrors the v1.13.1 CSF p-tau217 + v1.15.2 NfL/GFAP
  downgrade discipline: research-grade preclinical-stage biomarkers
  with promising data but without multi-body international consensus
  ship as research_preview, NOT production.

  Layer separation: This pack covers RESEARCH-GRADE p-tau231 only.
  Production CSF tau biomarkers (p-tau181, t-tau) are in
  csf_biomarkers/csf_tau_consensus. Production plasma tau biomarkers
  (p-tau217, p-tau181) are in plasma_biomarkers/plasma_amyloid_consensus
  (note: pack name reflects amyloid scope but includes plasma p-tau
  per v1.14.0 extension).

