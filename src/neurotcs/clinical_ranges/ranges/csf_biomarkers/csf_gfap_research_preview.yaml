framework_name: CSF glial fibrillary acidic protein (GFAP) - AA-2024 ATX(N) astrocytic marker.
transcribed_by: Salokhiddinov M, MD PhD (KIUT), 2026-05-29. CSF GFAP (Simoa) is substantially higher in
  absolute terms than plasma GFAP (typically low-thousands to tens-of-thousands pg/mL; increases with
  age and across the AD continuum; Benedet 2021). Plausibility envelope (0-100000 pg/mL); no consensus
  diagnostic cutoff as of 2026.
clinical_source_authority: 'NeuroTCS audits a csf_gfap_pgml value an assay produced. RESEARCH PREVIEW
  plausibility pack: hard_min 0, hard_max 100000 pg/mL (generous analytical ceiling above reported distributions).
  NOT a diagnostic cutoff. No >=2-body international consensus cutoff exists, which is why this is research_preview;
  audit_clinical_ranges() refuses it for production audit.'
