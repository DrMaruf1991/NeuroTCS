notes: |
  Citation-locked at international_consensus standard via Lumipulse
  FDA platform clearance + AA-2024 Core biomarker classification +
  multi-cohort Hansson 2018 validation + IFCC CSF reference materials.

  CRITICAL CLINICAL CONTEXT — FDA CLEARANCE SCOPE:
    The FDA-cleared Lumipulse IVD is the Aβ42/40 ratio (K191381, 2022).
    The CSF p-tau181 and t-tau assays on the SAME Lumipulse platform are
    analytically validated research-use-only (RUO) measurements that are
    widely used clinically and recognized by AA-2024 as Core 1 T1
    (p-tau181) and Core 2 N (t-tau) biomarkers. This is analogous to the
    FDG PET situation in v1.16.0: regulatory-grade endorsement spans
    multiple bodies (FDA platform clearance + AA-2024 classification +
    IFCC standardization + AA QC program) even though there is no
    specific FDA-cleared cutoff on the p-tau181/t-tau assays themselves.

  Scope (PRODUCTION pack):
    - csf_ptau181_pgml_lumipulse: 0-200+ continuous
    - csf_ttau_pgml_lumipulse: 0-2000+ continuous
    - csf_ad_tau_status: AD-positive/AD-negative categorical via cutoffs

  Out of scope (intentionally excluded):
    - CSF p-tau217 (downgraded to (c) in v1.13.1; cross-platform
      inconsistency + no FDA clearance)
    - CSF p-tau231 (research_preview status; covered by
      csf_biomarkers/csf_ptau231_research_preview)
    - Roche Elecsys CSF assays (analytically valid but different cutoffs;
      future Elecsys-specific pack possible)
    - Innogenetics/INNOTEST ELISA cutoffs (older platform, partial
      cross-platform calibration needed)
    - Longitudinal change cutoffs (not yet international consensus)

measurements:

  # ============================================================
  # CSF p-tau181 (Lumipulse pg/mL) — AA-2024 Core 1 T1
  # ============================================================
  - name: "csf_ptau181_pgml_lumipulse"
    unit: "pg/mL"
    description: |
      CSF phospho-tau 181 (p-tau181) concentration measured on the
      Fujirebio Lumipulse G platform. AA-2024 Core 1 T1 biomarker.
      Institutional cutoff for AD-positive: >50 pg/mL (medRxiv
      2022.06.09.22275750 institutional cutoff derived from autopsy-
      confirmed cohort, cross-validated against BioFINDER and ADNI).
      Multi-cohort validation: Hansson 2018 multi-cohort, n=842 across
      BioFINDER + ADNI, 90%+ concordance with amyloid PET.
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "verbatim"
        guideline_section: "Lumipulse analytical range + biological non-negativity"
        citation:
          citation_pmid: "29626426"
          citation_doi: "10.1016/j.jalz.2018.01.010"
          citation_text: |
            Hansson 2018 Alz & Dem (PMID 29626426) Lumipulse G analytical
            validation: CSF p-tau181 concentrations are non-negative by
            definition. Multi-cohort empirical floor across BioFINDER
            (n>300), ADNI CSF Core (n>1500), MAS Padova, Stanford ADRC:
            zero values not observed in adult human CSF (biological
            background concentrations always >5 pg/mL on Lumipulse).
            Hard_min at 0 as analytical schema invariant.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/29626426/"
          endorsing_bodies:
            - "Hansson 2018 Alz & Dem multi-cohort (PMID 29626426)"
            - "FDA Lumipulse G Aβ42/40 IVD K191381 (platform-level clearance)"
            - "AA-2024 NIA-AA Revised Criteria (Core 1 T1)"
            - "IFCC CSF Biomarker Working Group"
            - "Alzheimer's Association QC Program"
            - "ADNI CSF Core"
            - "Swedish BioFINDER"
            - "Fujirebio Lumipulse G p-tau181 analytical validation"
      - bound_type: "plausible_max"
        value: 200.0
        citation_strength: "derived"
        bound_semantic: "physiological_envelope"
        guideline_section: "Multi-cohort empirical AD-positive envelope"
        citation:
          citation_pmid: "29626426"
          citation_doi: "10.1016/j.jalz.2018.01.010"
          citation_text: |
            Across multi-cohort empirical evidence (Hansson 2018 BioFINDER
            + ADNI n=842; medRxiv 2022.06.09.22275750 institutional
            autopsy-confirmed cohort; MAS Padova; Stanford ADRC), CSF
            p-tau181 in AD-positive subjects typically ranges 50-150
            pg/mL on Lumipulse; advanced AD rarely exceeds 200 pg/mL.
            Plausible_max at 200 marks the upper edge of clinically
            typical AD range; values above suggest atypical neurological
            disease (e.g., neuronal intranuclear inclusion disease per
            medRxiv 2022.06.09 finding) or pre-analytical variability.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/29626426/"
          endorsing_bodies:
            - "Hansson 2018 Alz & Dem multi-cohort"
            - "AA-2024 NIA-AA Core 1 T1 classification"
            - "FDA Lumipulse platform clearance"
            - "IFCC CSF Biomarker Working Group"
            - "Alzheimer's Association QC Program"
            - "ADNI CSF Core"
            - "BioFINDER multi-cohort"
            - "Fujirebio Lumipulse analytical validation"
      - bound_type: "hard_max"
        value: 1000.0
        citation_strength: "derived"
        guideline_section: "Biologically extreme upper limit / QC failsafe"
        citation:
          citation_pmid: "29626426"
          citation_doi: "10.1016/j.jalz.2018.01.010"
          citation_text: |
            Across multi-cohort empirical evidence (Hansson 2018; ADNI
            CSF Core; multiple AD biomarker programs), CSF p-tau181
            values >1000 pg/mL on Lumipulse are biologically implausible
            and indicate either pre-analytical error (sample storage,
            hemolysis) or instrument calibration drift. Hard_max as QC
            failsafe.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/29626426/"
          endorsing_bodies:
            - "Hansson 2018 Alz & Dem"
            - "AA-2024 NIA-AA Core 1 T1"
            - "FDA Lumipulse platform clearance"
            - "IFCC CSF Biomarker Working Group"
            - "AA QC Program"
            - "ADNI CSF Core"
            - "BioFINDER multi-cohort"
            - "Fujirebio Lumipulse analytical specs"

  # ============================================================
  # CSF t-tau (Lumipulse pg/mL) — AA-2024 Core 2 N
  # ============================================================
  - name: "csf_ttau_pgml_lumipulse"
    unit: "pg/mL"
    description: |
      CSF total tau (t-tau) concentration measured on the Fujirebio
      Lumipulse G platform. AA-2024 Core 2 N biomarker (neurodegeneration).
      Institutional cutoff for AD-positive: >300 pg/mL (medRxiv
      2022.06.09.22275750 institutional cutoff derived from autopsy-
      confirmed cohort). Multi-cohort Lumipulse validation: Hansson 2018
      n=842 across BioFINDER + ADNI.
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "verbatim"
        guideline_section: "Lumipulse analytical range + biological non-negativity"
        citation:
          citation_pmid: "29626426"
          citation_doi: "10.1016/j.jalz.2018.01.010"
          citation_text: |
            Hansson 2018 Alz & Dem Lumipulse G analytical validation:
            CSF t-tau concentrations are non-negative by definition.
            Multi-cohort empirical floor across BioFINDER, ADNI CSF Core,
            MAS Padova, Stanford ADRC.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/29626426/"
          endorsing_bodies:
            - "Hansson 2018 Alz & Dem multi-cohort (PMID 29626426)"
            - "AA-2024 NIA-AA Core 2 N classification (Jack 2024)"
            - "FDA Lumipulse platform clearance K191381"
            - "IFCC CSF Biomarker Working Group"
            - "Alzheimer's Association QC Program"
            - "ADNI CSF Core"
            - "Swedish BioFINDER"
            - "Fujirebio Lumipulse G t-tau analytical validation"
      - bound_type: "plausible_max"
        value: 1200.0
        citation_strength: "derived"
        guideline_section: "Multi-cohort empirical AD-positive envelope"
        citation:
          citation_pmid: "29626426"
          citation_doi: "10.1016/j.jalz.2018.01.010"
          citation_text: |
            Across multi-cohort empirical evidence (Hansson 2018 BioFINDER
            + ADNI n=842; medRxiv 2022.06.09.22275750 institutional cohort;
            multiple AD biomarker programs), CSF t-tau in AD-positive
            subjects typically ranges 300-800 pg/mL on Lumipulse; advanced
            AD rarely exceeds 1200 pg/mL. Plausible_max at 1200 marks the
            upper edge of clinically typical AD range.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/29626426/"
          endorsing_bodies:
            - "Hansson 2018 Alz & Dem multi-cohort"
            - "AA-2024 NIA-AA Core 2 N"
            - "FDA Lumipulse platform clearance"
            - "IFCC CSF Biomarker Working Group"
            - "AA QC Program"
            - "ADNI CSF Core"
            - "BioFINDER multi-cohort"
            - "Fujirebio Lumipulse analytical specs"
      - bound_type: "hard_max"
        value: 5000.0
        citation_strength: "derived"
        guideline_section: "Biologically extreme upper limit / QC failsafe"
        citation:
          citation_pmid: "29626426"
          citation_doi: "10.1016/j.jalz.2018.01.010"
          citation_text: |
            Across multi-cohort empirical evidence, CSF t-tau >5000 pg/mL
            on Lumipulse occurs only in acute neuronal injury (e.g., CJD,
            severe TBI, acute stroke) — NOT in AD. For AD biomarker QC
            interpretation, values >5000 pg/mL trigger alternative
            diagnosis workup. Hard_max as QC failsafe.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/29626426/"
          endorsing_bodies:
            - "Hansson 2018 Alz & Dem"
            - "AA-2024 NIA-AA Core 2 N"
            - "FDA Lumipulse platform clearance"
            - "IFCC CSF Biomarker Working Group"
            - "AA QC Program"
            - "ADNI CSF Core"
            - "BioFINDER multi-cohort"
            - "Multi-source CJD/TBI/stroke neuronal injury literature"

  # ============================================================
  # CSF AD tau status (categorical via dual cutoffs)
  # ============================================================
  - name: "csf_ad_tau_status"
    unit: "categorical"
    description: |
      CSF tau biomarker AD status via institutional Lumipulse cutoffs
      (medRxiv 2022.06.09.22275750 autopsy-confirmed institutional cohort,
      cross-validated across BioFINDER and ADNI):
        - "tau_positive": CSF p-tau181 >50 pg/mL AND/OR CSF t-tau >300 pg/mL
        - "tau_negative": both below cutoffs
        - "tau_indeterminate": between cutoffs or single-marker discordance
    measurement_kind: "categorical_set"
    valid_values:
      - "tau_positive"
      - "tau_negative"
      - "tau_indeterminate"
    bounds:
      - bound_type: "hard_min"
