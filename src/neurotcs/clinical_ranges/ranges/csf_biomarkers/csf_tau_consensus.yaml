framework_name: "Cerebrospinal fluid tau biomarkers for Alzheimer's disease — phospho-tau 181 (p-tau181, Core 1 T1 marker per AA-2024) and total tau (t-tau, Core 2 N marker per AA-2024). FDA-cleared Lumipulse G β-Amyloid Ratio (1-42/1-40) IVD covers Aβ42/40; this pack covers the tau biomarkers on the same Fujirebio Lumipulse platform with international consensus institutional cutoffs (Hansson 2018, IFCC + Alzheimer's Association quality control program)."
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29, verbatim transcription from Hansson O et al. Alz & Dem 2018 (CSF Aβ + p-tau + t-tau Lumipulse multi-cohort validation, PMID 29626426), IFCC Working Group on CSF Biomarkers, Alzheimer's Association Quality Control Program (Mattsson 2011 Alz & Dem, IFCC-recognized CSF reference materials), Fujirebio Lumipulse G β-Amyloid Ratio (1-42/1-40) FDA 510(k) clearance K191381 (2022), AA-2024 NIA-AA Revised Criteria Table 7 (Jack 2024 PMID 38934362), and institutional cutoff publications (medRxiv 2022.06.09.22275750 institutional CSF p-tau181 50 pg/mL + t-tau 300 pg/mL cutoffs derived from autopsy-confirmed cohort)."
clinical_source_authority: |
  This pack encodes CSF tau biomarkers (p-tau181 and t-tau) on the
  Fujirebio Lumipulse platform, the FDA-cleared CSF AD biomarker IVD
  reference standard. Multi-body endorsement:

  1. FDA: Lumipulse G β-Amyloid Ratio (1-42/1-40) FDA 510(k) clearance
     K191381 (May 2022). The Aβ42/40 IVD is the FDA-cleared AD biomarker
     test on the Lumipulse platform. CSF p-tau181 and t-tau assays on the
     same platform are widely used clinically as analytically-validated
     reference research-use-only (RUO) measurements; AA-2024 explicitly
     recognizes CSF p-tau181 as a Core 1 T1 biomarker.

  2. AA-2024 NIA-AA Revised Criteria (Jack et al. 2024, PMID 38934362,
     Table 7): CSF p-tau181 = Core 1 T1 biomarker; CSF t-tau = Core 2
     N biomarker.

  3. IFCC (International Federation of Clinical Chemistry) Working Group
     on CSF Biomarkers: standardization of CSF Aβ/tau measurement; AD
     reference materials.

  4. Alzheimer's Association Quality Control Program: international
     CSF AD biomarker QC program (Mattsson 2011 Alz & Dem); n>100 sites
     across Europe and North America.

  5. Hansson 2018 Alzheimer's & Dementia (PMID 29626426): multi-cohort
     Lumipulse CSF biomarker validation across n>500 across Swedish
     BioFINDER + ADNI cohorts.

  6. ADNI CSF Core: Lumipulse and ELISA platforms validated for CSF
     Aβ, p-tau181, and t-tau across ADNI-1/GO/2/3/4 (n>1500 longitudinal).

  7. Fujirebio: Lumipulse manufacturer; Lumipulse G p-tau 181 + t-tau
     assays analytically validated per AA QC standards.

  8. Multi-cohort: ADNI, BioFINDER, Knight ADRC, MAS Padova, Stanford
     ADRC; institutional cutoffs (p-tau181 >50 pg/mL; t-tau >300 pg/mL)
     derived from autopsy-confirmed cohorts (medRxiv 2022.06.09.22275750).

  Layer separation: This pack covers CSF TAU BIOMARKERS (p-tau181, t-tau)
  on the FDA-cleared Lumipulse platform. Companion pack
  csf_biomarkers/csf_amyloid_consensus covers CSF AMYLOID biomarkers
  (Aβ42, Aβ40, Aβ42/40 ratio). Companion pack
  csf_biomarkers/csf_ptau231_research_preview covers the research-grade
  p-tau231 biomarker (no FDA clearance; preclinical-stage marker).
  Companion pack plasma_biomarkers/plasma_amyloid_consensus covers
  PLASMA biomarkers (p-tau217, p-tau181). Note: per the v1.13.1 and
  v1.15.2 downgrades, CSF p-tau217 is currently in (c) tier (no FDA
  clearance + cross-platform inconsistency) and is NOT in this pack.

