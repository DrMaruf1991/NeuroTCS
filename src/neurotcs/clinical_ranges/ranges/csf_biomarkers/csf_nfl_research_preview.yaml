domain: csf_biomarkers
framework_name: CSF neurofilament light chain (NfL) - non-specific neuroaxonal injury marker (AA-2024
  N).
transcribed_by: Salokhiddinov M, MD PhD (KIUT), 2026-05-29. CSF NfL is ~10-50x higher than blood NfL (typically
  hundreds to a few thousand pg/mL in older adults, higher in neurodegeneration); the plasma nfl_consensus
  pack does NOT cover CSF values. Plausibility envelope (0-50000 pg/mL); no consensus diagnostic cutoff
  as of 2026.
clinical_source_authority: 'NeuroTCS audits a csf_nfl_pgml value an assay produced. RESEARCH PREVIEW plausibility
  pack: hard_min 0, hard_max 50000 pg/mL (generous analytical ceiling above reported distributions). NOT
  a diagnostic cutoff. No >=2-body international consensus cutoff exists, which is why this is research_preview;
  audit_clinical_ranges() refuses it for production audit.'
