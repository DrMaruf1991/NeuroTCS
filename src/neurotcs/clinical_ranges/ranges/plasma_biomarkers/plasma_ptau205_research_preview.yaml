framework_name: 'Plasma phospho-tau 205 - AA-2024 ATX(N) tau marker, AD continuum mid-stage indicator.
  Per Teunissen 2025 review (Alz & Dem 2025): CSF p-tau205 rises AFTER p-tau217/p-tau181 and correlates
  strongly with brain atrophy and tau PET. Plasma p-tau205 assays are emerging (Janssen/Lilly/MSD). RESEARCH
  PREVIEW: no consensus diagnostic cutoff.'
transcribed_by: Salokhiddinov M, MD PhD (KIUT), 2026-05-29. Plausibility envelope grounded in Teunissen
  2025 (Alz & Dem 2025, DOI 10.1002/alz.14397) - review of plasma p-tau immunoassays including p-tau205.
  Plasma p-tau species typically span single-digit to low tens of pg/mL across the AD continuum.
clinical_source_authority: 'NeuroTCS audits plasma p-tau205 values an assay produced. RESEARCH PREVIEW:
  hard_min 0 (non-negativity); hard_max 100 pg/mL (generous analytical ceiling above reported cohort distributions).
  NOT a diagnostic cutoff. audit_clinical_ranges() refuses for production audit.'
anchor_citation:
  citation_text: Teunissen CE, Ashton NJ, Karikari TK, et al. Plasma p-tau immunoassays in clinical research
    for Alzheimer's disease. Alzheimer's & Dementia 2025 (DOI 10.1002/alz.14397). Comprehensive review
    of plasma p-tau species (181/205/212/217/231) immunoassay performance. p-tau205 rises in CSF after
    p-tau217/p-tau181 and tracks brain atrophy/hypometabolism.
  public_url: https://alz-journals.onlinelibrary.wiley.com/doi/10.1002/alz.14397
