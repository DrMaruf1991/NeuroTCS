framework_name: "Plasma blood-based biomarker thresholds for Alzheimer's disease — Alzheimer's Association 2025 Clinical Practice Guideline (Palmqvist et al., first CPG for BBMs in specialized care), FDA-cleared Lumipulse G pTau217/Aβ42 Plasma Ratio (510(k) clearance May 2025), Global CEO Initiative on AD performance criteria (Schindler 2024), and AA AUR for Blood Biomarkers (Hansson 2022)"
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-25, verbatim transcription from Alzheimer's Association 2025 Clinical Practice Guideline (Palmqvist et al. Alzheimer's & Dementia 2025;21:e70535), Global CEO Initiative on AD recommendations (Schindler et al. Nat Rev Neurol 2024), FDA press release on Lumipulse G pTau217/Aβ42 Plasma Ratio 510(k) clearance (May 2025), AA AUR for Blood Biomarkers (Hansson et al. 2022), and Nature Medicine validation (Palmqvist 2025 fully-automated platform)"
clinical_source_authority: |
  This pack encodes the plasma blood-based biomarker thresholds for AD per
  the international consensus established by:
   - Alzheimer's Association 2025 Clinical Practice Guideline (Palmqvist
     et al., the first formal CPG for blood-based biomarkers in AD)
   - FDA 510(k) clearance for Lumipulse G pTau217/Aβ42 Plasma Ratio
     (May 2025) — the first FDA-cleared blood test for AD diagnosis
   - Global CEO Initiative on Alzheimer's Disease (Schindler et al.
     Nat Rev Neurol 2024) — international consortium recommendations
     for acceptable blood biomarker performance
   - Alzheimer's Association Appropriate Use Recommendations for Blood
     Biomarkers (Hansson et al. 2022, foundational AUR for BBMs)
   - NIA-AA 2024 Revised Criteria (Jack et al.)
   - Hansson, Blennow, Zetterberg, Dage (Nat Aging 2023)

  Plasma assay manufacturers whose validated cutoffs inform this pack:
   - Fujirebio Diagnostics (Lumipulse, first FDA-cleared)
   - C2N Diagnostics (PrecivityAD2)
   - Quanterix (Simoa platform)
   - Roche Diagnostics (Elecsys plasma p-tau217)
   - Janssen / Eli Lilly Janelidze (LC-MS p-tau217)

  Layer separation: This pack covers PLASMA AMYLOID/TAU BIOMARKERS.
  Companions: csf_amyloid_consensus (CSF), pet_amyloid/centiloid_consensus
  (PET), ad/aria_safety (ARIA monitoring), genetics/apoe_consensus (APOE).

