  - name: "plasma_ptau217_abeta42_ratio_lumipulse"
    unit: "ratio"
    description: |
      Plasma pTau217 / Aβ42 ratio measured on the Lumipulse G1200 platform.
      The first FDA-cleared blood test for AD diagnosis (510(k) clearance
      May 2025). Used as a proxy for the presence of β-Amyloid plaques.
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "FDA 510(k) clearance for Lumipulse G pTau217/Aβ42 Plasma Ratio (May 2025)"
        citation:
          citation_doi: "10.1002/alz.70535"
          pmid_pending: true
          citation_text: |
            FDA Press Release (16 May 2025) verbatim: "FDA Clears First
            Blood Test Used in Diagnosing Alzheimer's Disease. The
            Lumipulse G pTau217/β-Amyloid 1-42 Plasma Ratio... measures
            two key biomarkers, to aid in diagnosing Alzheimer's
            disease in people exhibiting symptoms of the disease."
            Clinical validation: 91.7% of positive results confirmed
            by PET or CSF; 97.3% of negative results confirmed.
            Indicated for adults aged 55+ presenting with cognitive
            impairment in a specialized care setting.
          public_url: "https://www.fda.gov/news-events/press-announcements/fda-clears-first-blood-test-used-diagnosing-alzheimers-disease"
          endorsing_bodies:
            - "FDA (510(k) clearance, Lumipulse G pTau217/Aβ42 Plasma Ratio, May 2025)"
