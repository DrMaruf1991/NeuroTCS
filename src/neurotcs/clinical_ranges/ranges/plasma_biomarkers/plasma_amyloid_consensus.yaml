  # ============================================================
  # Biomarker performance tier (categorical, AA CPG 2025)
  # ============================================================
  - name: "biomarker_performance_tier"
    unit: "categorical"
    description: |
      AA CPG 2025 (Palmqvist et al.) performance tier classification:
      triaging tools require ≥90% sensitivity AND ≥75% specificity;
      confirmatory tools require ≥90% sensitivity AND ≥90% specificity
      (and can replace amyloid PET or CSF testing).
    measurement_kind: "categorical_set"
    valid_values:
      - "triaging"        # ≥90% sens, ≥75% spec — rule out only
      - "confirmatory"    # ≥90% sens, ≥90% spec — replaces PET/CSF
      - "research_only"   # below either tier
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "AA CPG 2025 §Recommendations 1-3 performance tiers"
        citation:
          citation_doi: "10.1002/alz.70535"
          pmid_pending: true
          citation_text: |
            AA CPG 2025 (Palmqvist et al.) verbatim Recommendations 1-3:
            "Triaging tool: Use a BBM with ≥90% sensitivity and ≥75%
            specificity to rule out Alzheimer's disease pathology in
            patients presenting with objective cognitive impairment.
            Confirmatory tool: Use a BBM with ≥90% sensitivity and
            specificity in place of amyloid PET imaging or CSF
            biomarkers to confirm Alzheimer's pathology." Schindler
            et al. (Nat Rev Neurol 2024) Global CEO Initiative on AD
            verbatim provides the same dual-criterion standard.
          public_url: "https://alz-journals.onlinelibrary.wiley.com/doi/10.1002/alz.70535"
          endorsing_bodies:
            - "Alzheimer's Association 2025 CPG (Palmqvist et al.)"
            - "Global CEO Initiative on AD (Schindler 2024 Nat Rev Neurol)"
            - "Alzheimer's Association AUR (Hansson 2022)"
            - "FDA (510(k) clearance criteria for plasma BBMs)"
            - "Palmqvist 2025 Nat Med validation"
            - "NIA-AA 2024 Revised Criteria"
      - bound_type: "hard_max"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "Categorical placeholder"
        citation:
          citation_doi: "10.1002/alz.70535"
          pmid_pending: true
          citation_text: |
            Biomarker performance tier is constrained to the three-tier
