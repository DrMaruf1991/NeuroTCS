  description: '[18F]MK-6240 SUVR in a meta-temporal ROI (entorhinal + hippocampus + parahipp + amygdala).
    Reference region: inferior cerebellar GM. AD subjects typically 1.5-3.0; controls near 1.0 (Betthauser
    2018).'
  bounds:
