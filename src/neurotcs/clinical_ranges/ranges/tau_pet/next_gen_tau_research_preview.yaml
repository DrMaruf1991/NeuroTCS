status: research_preview
domain: tau_pet
framework_name: 'Next-generation tau PET tracers: [18F]MK-6240, [18F]PI-2620, [18F]florzolotau (APN-1607/PM-PBB3).
  Designed for improved tau binding affinity vs flortaucipir and reduced off-target binding. MK-6240 NDA
  filed at FDA (PDUFA 2026-08-13); the others remain research-grade. RESEARCH PREVIEW: SUVR plausibility
  envelopes only; no consensus diagnostic threshold.'
transcribed_by: Salokhiddinov M, MD PhD (KIUT), 2026-05-29. Plausibility envelopes grounded in Betthauser
  2018 (J Nucl Med 59:93-99, PMID 29777006 - first-in-human MK-6240 quantification), Pascoal 2018 (Alz
  Res Ther 10:74 - MK-6240 NFT quantification), Mueller 2020 (J Nucl Med 61:911-919 - PI-2620 first-in-humans),
  and Tagai 2021 / Cho 2024 on florzolotau. All SUVRs typically range ~1.0 (controls) to ~3.0 (advanced
  AD); a 0-5 envelope is generous.
clinical_source_authority: NeuroTCS audits SUVR values a tau-PET pipeline produced. Tracer-specific reference
  region and ROI conventions vary; values are not directly cross-tracer interchangeable. RESEARCH PREVIEW
  envelopes; NOT diagnostic cutoffs. audit_clinical_ranges() refuses for production audit. Promotion to
  production deferred until (a) MK-6240 FDA approval (PDUFA Aug 13, 2026) and (b) cross-cohort SUVR cutoff
  harmonization.
anchor_citation:
  citation_text: 'Betthauser TJ, Cody KA, Zammit MD, et al. In vivo characterization and quantification
    of neurofibrillary tau PET radioligand [18F]MK-6240 in humans from Alzheimer''s disease dementia to
    young controls. J Nucl Med 2018. PMID 29777006. First-in-human MK-6240 quantification (reference region:
    inferior cerebellar GM; SUVR window 70-90 min).'
  public_url: https://pubmed.ncbi.nlm.nih.gov/29777006/
  endorsing_bodies:
  - Merck
  - ADNI
  - University of Wisconsin Wisconsin Registry for Alzheimer's Prevention
  citation_pmid: '29777006'
  citation_doi: 10.2967/jnumed.118.209650
