notes: RESEARCH PREVIEW. SUVR values are tracer- and reference-region-specific; never assume cross-tracer
  comparability. Promotion deferred. Closes the next-gen tau PET P2 gap (post expected MK-6240 FDA PDUFA
  2026-08-13).
