rangepack_id: "tau_pet/tau_research_preview@1.0.0"
pack_version: "1.0.0"
effective_date: "2026-05-28"
status: "research_preview"
domain: "tau_pet_research_grade_quantification"
framework_name: "Tau PET research-grade quantitative thresholds — Schöll 2016 Braak-stage SUVR cutoffs, Maass 2017 meta-temporal SUVR threshold, Pascoal 2021 quantitative cutoffs (ADNI), CenTauR universal scale (Villemagne 2023), and flortaucipir longitudinal cohort SUVR distributions. NOT yet international_consensus at >=5-body level; ships at research_preview status pending convergence."
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-28, transcription from Schöll et al. Neuron 2016;89(5):971-982 (PMID 26938442), Maass et al. NeuroImage 2017;157:448-463 (PMID 28587897), Pascoal et al. EBioMedicine 2021 (PMID 34920263), Villemagne et al. Eur J Nucl Med Mol Imaging 2023 (CenTauR Universal scale, PMID 37953337), Mattay 2020 J Nucl Med FDA review (PMID 32709695)"
clinical_source_authority: |
  This pack encodes research-grade quantitative Tau PET cutoffs that are
  NOT yet at international_consensus standard but are widely used in
  research cohorts (ADNI, A4 Study, OASIS-3, HABS, BACS, BioFINDER).
  Ships at research_preview status (parallel to mri_volumetrics/
  freesurfer_extended which encodes 18 brain regions at research_preview
  status pending future promotion).

  Source landscape:
   - Schöll et al. Neuron 2016: foundational PET-Braak staging via
     entorhinal + temporal + extra-temporal hierarchical thresholds
   - Maass et al. NeuroImage 2017: meta-temporal SUVR composite cutoff
     ~1.23 (inferior cerebellum reference); widely cited in ADNI
     downstream analyses
   - Pascoal et al. EBioMedicine 2021: regional SUVR cutoffs across
     ADNI sub-cohorts; published in EBioMedicine 2021
   - Villemagne et al. EJNMMI 2023: CenTauR universal scale (analogue
     of Centiloid for tau PET); emerging cross-tracer harmonization
   - Mattsson-Carlgren et al. Sci Adv 2020: longitudinal SUVR evolution
   - Cho et al. Brain 2016 / Therriault 2022: PET-Braak hierarchical
     staging variants

  Why research_preview not production:
   - No FDA-cleared quantitative SUVR cutoff (FDA Tauvid is visual read)
   - Cutoffs vary by reference region (inferior cerebellum vs whole
     cerebellum vs eroded white matter)
   - Cutoffs vary by partial-volume-correction (PVC) status
   - Cohort-specific cutoffs not yet harmonized at >=5-body international
     consensus
   - CenTauR universal scale is emerging (2023) but not yet endorsed
     by >=5 international specialty bodies in the way Centiloid is

  Companion pack: tau_pet/tau_consensus@1.0.0 (production status) covers
  the FDA-verbatim visual read criteria (1.65x cerebellar threshold,
  positive/negative pattern definitions, dose, imaging window).

  Tracer scope: flortaucipir-derived cutoffs primarily. MK-6240 cutoffs
  excluded pending FDA action (PDUFA August 13, 2026); PI-2620 and
  RO948 cutoffs excluded as fully research-tracer-specific.

anchor_citation:
  citation_pmid: "26938442"
  citation_doi: "10.1016/j.neuron.2016.01.028"
  citation_text: |
    Schöll M, Lockhart SN, Schonhaut DR, O'Neil JP, Janabi M, Ossenkoppele R,
