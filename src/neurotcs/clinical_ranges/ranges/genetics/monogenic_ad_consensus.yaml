effective_date: '2026-05-29'
status: production
domain: genetics
framework_name: 'Monogenic (autosomal-dominant) Alzheimer''s disease gene variant status: PSEN1, PSEN2,
  APP, each classified by the ACMG/AMP 2015 5-tier system. Critical for DIAN/AHEAD/prevention-trial eligibility.
  Categorical consensus classification - no fabricated numbers.'
transcribed_by: Salokhiddinov M, MD PhD (KIUT), 2026-05-29. Valid categories = ACMG/AMP 2015 five-tier
  (Richards 2015, Genet Med 17(5):405-424, PMID 25741868) plus not_detected/unknown. PSEN1/PSEN2/APP are
  the three established ADAD genes (DIAN; Bateman 2012).
clinical_source_authority: NeuroTCS audits a variant classification a clinical genetics lab assigned;
  it does not call variants. Valid values follow the ACMG/AMP 2015 international consensus. Promoted to
  production under the v1.30.0 evidence model (>=2 authoritative endorsing bodies + public_url).
