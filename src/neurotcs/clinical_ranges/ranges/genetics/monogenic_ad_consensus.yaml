  - Dominantly Inherited Alzheimer Network (DIAN)
  citation_pmid: '25741868'
  citation_doi: 10.1038/gim.2015.30
measurements:
- name: psen1_mutation_status
  unit: category
  description: psen1 sequence-variant classification (ACMG/AMP 5-tier). PSEN1 is an established autosomal-dominant
    Alzheimer's disease gene; pathogenic/likely-pathogenic variants confer early-onset ADAD and gate DIAN/prevention-trial
    eligibility.
  measurement_kind: categorical_set
  valid_values:
  - pathogenic
  - likely_pathogenic
  - uncertain_significance
  - likely_benign
  - benign
  - not_detected
  - unknown
  bounds:
