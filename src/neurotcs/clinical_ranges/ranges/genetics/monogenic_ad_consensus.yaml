    guideline_section: ACMG/AMP 2015 variant classification (Richards 2015) (categorical set)
    citation:
      citation_text: 'Variant classified per ACMG/AMP 2015 (Richards 2015) into one of: pathogenic, likely_pathogenic,
        uncertain_significance, likely_benign, benign; plus not_detected / unknown. PSEN1 is a canonical
        ADAD gene.'
      public_url: https://doi.org/10.1038/gim.2015.30
