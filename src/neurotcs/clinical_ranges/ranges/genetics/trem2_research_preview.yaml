domain: "trem2_variants_ad_risk"
framework_name: "TREM2 (triggering receptor expressed on myeloid cells 2) rare missense variants R47H (rs75932628) and R62H (rs143332484) as research-grade Alzheimer's disease risk genetic variants. NOT FDA-cleared. NOT a clinical actionable threshold. Multi-cohort genome-wide significant association via Guerreiro 2013 NEJM + Jonsson 2013 NEJM + Sims/Lu 2013 meta-analysis (n=32,598)."
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29, verbatim transcription from Guerreiro R et al. TREM2 Variants in Alzheimer's Disease. NEJM 2013 (PMID 23150908), Jonsson T et al. Variant of TREM2 Associated with the Risk of Alzheimer's Disease. NEJM 2013 (PMID 23150934), Sims R, Lu Y et al. Assessing the role of the TREM2 p.R47H variant as a risk factor for Alzheimer's disease and frontotemporal dementia. PMID 24041969 (meta-analysis n=32,598), Jin SC et al. PMID 24899047 (R62H risk variant)."
clinical_source_authority: |
  This research_preview pack encodes TREM2 rare missense variants R47H
  and R62H as RESEARCH-GRADE AD risk loci. Status is research_preview
  (NOT production) because:

  1. NO FDA-cleared TREM2 genotyping IVD assay for AD risk prediction.

  2. NO clinical-grade actionable threshold: Unlike APOE ε4 (which has
     entrenched clinical risk-stratification use across lecanemab/
     donanemab ARIA risk management plans), TREM2 R47H/R62H risk is
     RESEARCH-GRADE despite genome-wide significance:
       - Allelic frequency ~0.6% (very rare; Guerreiro/Jonsson 2013)
       - Effect size moderate (meta-analysis OR 4.11 95% CI 2.99-5.68
         per Sims 2013 PMID 24041969 n=32,598; Lu 2014 modest OR 1.67
         in PMID 25186855 follow-up meta-analysis)
       - Not a current clinical guideline marker

  3. NOT in AA-2024 NIA-AA Revised Criteria Table 7 (the operative
     core/non-core AD biomarker classification, Jack 2024 PMID 38934362).

  4. RESEARCH-GRADE despite multi-body genetic validation (NEJM 2013 ×2,
     Acta Neuropathol, Neurology meta-analyses, Mol Neurodegener):
     genetic risk markers without clinical-grade actionable thresholds
     ship as research_preview, NOT production.

  This pack mirrors v1.13.1 CSF p-tau217 + v1.15.2 NfL/GFAP downgrade
  + v1.17.0 CSF p-tau231 research_preview discipline.

  Layer separation: This pack covers TREM2 RARE MISSENSE VARIANTS
  (R47H, R62H) only. APOE ε4/ε2 genotyping (clinical-grade actionable
  via ARIA risk management) is covered separately in
  ad/aria_safety_consensus (v1.10.x family). APP/PSEN1/PSEN2 autosomal
  dominant AD variants are out of scope (covered by future
  genetics/eoad_dominant_consensus pack if needed).

