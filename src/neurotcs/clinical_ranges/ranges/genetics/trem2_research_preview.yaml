notes: |
  RESEARCH_PREVIEW pack — citation-locked at research-grade evidence
  standard but NOT yet at clinical-grade actionable threshold standard.
  Bounds encode VARIANT PRESENCE/ABSENCE categorical status, not
  quantitative risk scores.

  CRITICAL CLINICAL CONTEXT — RESEARCH-PREVIEW STATUS:
    TREM2 R47H is the second-strongest known AD genetic risk locus
    after APOE ε4 in terms of effect size, but is much rarer (0.6% vs
    25% allelic frequency). The Guerreiro 2013 + Jonsson 2013 NEJM
    discovery papers + Sims 2013 large meta-analysis = robust genome-
    wide significant association.

    HOWEVER, there is no FDA-cleared TREM2 genotyping IVD assay for AD
    risk prediction, no clinical guideline supporting routine TREM2
    screening, no actionable clinical threshold, and no AA-2024
    recognition in Table 7. This is research-grade genetic information.

    Roadmap to production: research_preview status will be re-evaluated
    when (1) FDA-cleared TREM2 genotyping IVD becomes available with
    clinical indication, OR (2) AA-2024 explicitly recognizes TREM2 as
    a clinical biomarker, OR (3) emerging TREM2-targeted therapies
    (e.g., AL002 anti-TREM2 antibody) reach approval and TREM2 status
    becomes treatment-eligibility-defining.

  Scope (RESEARCH_PREVIEW pack):
    - trem2_r47h_variant_status: present/absent categorical
    - trem2_r62h_variant_status: present/absent categorical

  Out of scope (intentionally excluded):
    - Other TREM2 rare variants (T66M, Y38C, etc.) — extremely rare,
      individual case reports only
    - TREM2 mRNA expression (research-only)
    - sTREM2 (soluble TREM2 in CSF) — separate emerging biomarker
    - Population-stratified risk estimates (effect varies by ancestry;
      East Asian populations show no significant association per
      Huang 2015 meta-analysis PMID 25852195)
    - Clinical risk-stratification thresholds (no consensus)
    - APP/PSEN1/PSEN2 dominant variants (covered by other pack)

measurements:

  # ============================================================
  # TREM2 R47H (rs75932628) variant status
  # ============================================================
  - name: "trem2_r47h_variant_status"
    unit: "categorical"
    description: |
      TREM2 R47H variant (rs75932628 T allele) status. R47H is a rare
      missense substitution (arginine-to-histidine at position 47) in
      exon 2 of TREM2 on chromosome 6p21.1. Allelic frequency ~0.6%
      in European populations. Confers ~3-5-fold AD risk (OR 4.11
      meta-analysis n=32,598; OR 2.92 Jonsson; OR 5.05 Guerreiro).
      Three categorical states:
        - "absent": homozygous reference C/C
        - "heterozygous": C/T (one R47H allele)
        - "homozygous": T/T (extremely rare; both R47H alleles)
    measurement_kind: "categorical_set"
    valid_values:
      - "absent"
      - "heterozygous"
      - "homozygous"
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "derived"
        guideline_section: "Multi-cohort genome-wide significant association"
        citation:
          citation_pmid: "23150908"
          citation_doi: "10.1056/NEJMoa1211851"
          citation_text: |
            Guerreiro 2013 NEJM (PMID 23150908) + Jonsson 2013 NEJM
            (PMID 23150934) foundational discovery; Sims 2013 large
            meta-analysis (PMID 24041969 n=32,598 OR 4.11 95% CI
            2.99-5.68 P=5.27×10^-18); Lu 2014 Neurology follow-up
            (PMID 25186855). Three categorical states encode the
            standard biallelic SNP genotype space. Research-grade
            multi-cohort consensus; no clinical-grade actionable
            threshold.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/23150908/"
