schema_version: "1.0.0"
rangepack_id: "genetics/apoe_valid_genotypes@1.0.0"
pack_version: "1.0.0"
effective_date: "2026-05-25"
status: "deprecated"
deprecated_in_favor_of: "genetics/apoe_consensus@1.0.0"
deprecation_reason: "Superseded across multiple versions. (1) The apoe genotype field is superseded in v1.10.0 by genetics/apoe_consensus@1.0.0 (world-class international_consensus citation-lock with verbatim FDA/AA anchors). (2) The psen1_mutation and psen2_mutation fields are superseded in v1.30.0 by genetics/monogenic_ad_consensus@1.0.0, which encodes ACMG/AMP 5-tier pathogenic variant status (Richards 2015 PMID 25741868). (3) The prs_alzheimer_decile and prs_alzheimer fields are superseded in v1.31.0 by genetics/ad_prs_research_preview@0.1.0, anchored on the Bellenguez 2022 EADB GWAS (DOI 10.1038/s41588-022-01024-z). (4) The wgs_qc_status and wgs_coverage_x fields have no v1.x successor pack (sequencing QC is out of NeuroTCS scope; sequencing pipelines audit their own QC). This pack is retained on disk for historical reference only."
domain: "genetics"
framework_name: "AD genetics validity checks (APOE valid genotype set, PRS decile scale, WGS QC categorical, coverage)"
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-25"
clinical_source_authority: |
  APOE genotype combinatorial space defined by Roses 1996 (Annual Review
  of Medicine) and confirmed by all subsequent AD-genetics literature:
  three alleles (ε2, ε3, ε4) yield exactly six unordered genotypes
  {ε2/ε2, ε2/ε3, ε2/ε4, ε3/ε3, ε3/ε4, ε4/ε4}. No fourth allele exists in
  humans. PRS decile is a 1-10 scale by construction. WGS QC status is
  PASS or FAIL per the GA4GH genotype quality framework.

anchor_citation:
  citation_pmid: "8639020"
  citation_doi: "10.1146/annurev.med.47.1.387"
  citation_text: |
    Roses AD. Apolipoprotein E alleles as risk factors in Alzheimer's
    disease. Annu Rev Med. 1996;47:387-400. Defines the three-allele
    (ε2, ε3, ε4) APOE system; only six unordered genotype combinations
    exist in humans.

notes: |
  The APOE valid_values list accepts both Greek-letter and Latin
  ('e2/e3') representations because both appear in clinical data
  feeds. Adapter is responsible for normalization upstream if a
  single canonical form is required. The pack rejects ε1/ε5/ε6/...
  notations, which do not represent real alleles.

measurements:

  # ---- APOE genotype (categorical) ----
  - name: "apoe"
    unit: "categorical"
    description: "APOE genotype, unordered diploid combination of {ε2, ε3, ε4}."
    measurement_kind: "categorical_set"
    valid_values:
      - "ε2/ε2"
      - "ε2/ε3"
      - "ε2/ε4"
      - "ε3/ε2"   # same as ε2/ε3 in unordered representation; accept both orderings
      - "ε3/ε3"
      - "ε3/ε4"
      - "ε4/ε2"   # same as ε2/ε4
      - "ε4/ε3"   # same as ε3/ε4
      - "ε4/ε4"
      - "e2/e2"
      - "e2/e3"
      - "e2/e4"
      - "e3/e2"
      - "e3/e3"
      - "e3/e4"
      - "e4/e2"
      - "e4/e3"
      - "e4/e4"
      - "E2/E2"
      - "E2/E3"
      - "E2/E4"
      - "E3/E2"
      - "E3/E3"
      - "E3/E4"
      - "E4/E2"
      - "E4/E3"
      - "E4/E4"
      - "22"
      - "23"
      - "24"
      - "32"
      - "33"
      - "34"
      - "42"
      - "43"
      - "44"
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Roses 1996 §APOE alleles — three-allele system"
        citation:
          citation_pmid: "8639020"
          citation_doi: "10.1146/annurev.med.47.1.387"
          citation_text: |
            The human APOE locus has exactly three alleles (ε2, ε3, ε4).
            Any genotype involving ε1, ε5, ε6, etc. does not represent a
            real allele and indicates a transcription error in the genetic
            data feed. Six unordered diploid combinations are possible:
            {ε2/ε2, ε2/ε3, ε2/ε4, ε3/ε3, ε3/ε4, ε4/ε4}.
      - bound_type: "hard_max"
        value: 0.0
        guideline_section: "Categorical placeholder bound"
        citation:
          citation_pmid: "8639020"
          citation_doi: "10.1146/annurev.med.47.1.387"
          citation_text: "Categorical measurement bounds satisfy schema; valid_values is the operative check."

  # ---- PRS Alzheimer's decile ----
  - name: "prs_alzheimer_decile"
    unit: "decile"
    description: "Alzheimer's polygenic risk score, decile rank (1=lowest 10%, 10=highest 10%)."
    bounds:
      - bound_type: "hard_min"
        value: 1.0
        guideline_section: "Decile scale definition"
        citation:
          citation_pmid: "30679814"
          citation_doi: "10.1038/s41588-018-0311-9"
          citation_text: |
            Wray NR et al. Common disease is more complex than implied by the
            core gene omnigenic model (Nat Genet 2019). Decile-rank scales by
            definition partition a distribution into 10 equal-size bins
            numbered 1 (lowest) through 10 (highest); values outside [1, 10]
            do not represent valid deciles.
      - bound_type: "hard_max"
        value: 10.0
        guideline_section: "Decile scale definition"
        citation:
          citation_pmid: "30679814"
          citation_doi: "10.1038/s41588-018-0311-9"
          citation_text: "Decile rank cannot exceed 10."

  # ---- PRS Alzheimer's raw score ----
  - name: "prs_alzheimer"
    unit: "z_score"
    description: "Alzheimer's polygenic risk score (raw z-score)."
    bounds:
      - bound_type: "hard_min"
        value: -6.0
        guideline_section: "Z-score plausible floor (6 standard deviations)"
        citation:
          citation_pmid: "30679814"
          citation_doi: "10.1038/s41588-018-0311-9"
          citation_text: "PRS z-scores < -6 indicate computational artifact (essentially zero density in standard normal)."
      - bound_type: "hard_max"
        value: 6.0
        guideline_section: "Z-score plausible ceiling"
        citation:
          citation_pmid: "30679814"
          citation_doi: "10.1038/s41588-018-0311-9"
          citation_text: "PRS z-scores > 6 indicate computational artifact."

  # ---- WGS QC status (categorical) ----
  - name: "wgs_qc_status"
    unit: "categorical"
    description: "Whole-genome sequencing quality-control status per GA4GH."
    measurement_kind: "categorical_set"
    valid_values: ["PASS", "FAIL", "WARN", "PENDING"]
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "GA4GH variant QC vocabulary"
        citation:
          citation_pmid: "30912008"
          citation_doi: "10.1038/s41576-019-0119-1"
          citation_text: |
            Global Alliance for Genomics and Health (GA4GH) Variant Calling
            standards: variant-level QC status is reported as PASS / FAIL,
            with optional WARN / PENDING during pipeline operation. Other
            values indicate transcription error.
      - bound_type: "hard_max"
        value: 0.0
        guideline_section: "Categorical placeholder bound"
        citation:
          citation_pmid: "30912008"
          citation_doi: "10.1038/s41576-019-0119-1"
          citation_text: "Categorical measurement; valid_values is the operative check."

  # ---- WGS coverage ----
  - name: "wgs_coverage_x"
    unit: "x"
    description: "Whole-genome sequencing mean coverage depth (fold)."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Coverage non-negativity"
        citation:
          citation_pmid: "30912008"
          citation_doi: "10.1038/s41576-019-0119-1"
          citation_text: "Sequencing coverage depth must be non-negative."
      - bound_type: "hard_max"
        value: 1000.0
        guideline_section: "GA4GH coverage upper-tail consensus"
        citation:
          citation_pmid: "30912008"
          citation_doi: "10.1038/s41576-019-0119-1"
          citation_text: "WGS mean coverage > 1000x is uncommon outside targeted re-sequencing and warrants verification."
      - bound_type: "plausible_min"
        value: 20.0
        guideline_section: "Clinical WGS QC threshold"
        citation:
          citation_pmid: "30912008"
          citation_doi: "10.1038/s41576-019-0119-1"
          citation_text: "Clinical WGS typically targets ≥ 30x mean coverage; < 20x warrants pipeline review."

  # ---- PSEN1 mutation (categorical Yes/No) ----
  - name: "psen1_mutation"
    unit: "categorical"
    description: "PSEN1 pathogenic mutation status."
    measurement_kind: "categorical_set"
    valid_values: ["Yes", "No", "Unknown", "Variant of Unknown Significance", "VUS"]
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Variant interpretation vocabulary (ACMG 2015)"
        citation:
          citation_pmid: "25741868"
          citation_doi: "10.1038/gim.2015.30"
          citation_text: |
            Richards S et al. Standards and guidelines for the interpretation
            of sequence variants (Genet Med 2015): ACMG variant classification
            uses Pathogenic / Likely Pathogenic / VUS / Likely Benign / Benign;
            trial-data feeds typically collapse to Yes/No/VUS for PSEN1 risk
            variants.
      - bound_type: "hard_max"
        value: 0.0
        guideline_section: "Categorical placeholder bound"
        citation:
          citation_pmid: "25741868"
          citation_doi: "10.1038/gim.2015.30"
          citation_text: "Categorical; valid_values is the operative check."

  # ---- PSEN2 mutation (categorical Yes/No) ----
  - name: "psen2_mutation"
    unit: "categorical"
    description: "PSEN2 pathogenic mutation status."
    measurement_kind: "categorical_set"
    valid_values: ["Yes", "No", "Unknown", "Variant of Unknown Significance", "VUS"]
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "ACMG variant vocabulary"
        citation:
          citation_pmid: "25741868"
          citation_doi: "10.1038/gim.2015.30"
          citation_text: "ACMG categorical variant classification."
      - bound_type: "hard_max"
        value: 0.0
        guideline_section: "Categorical placeholder bound"
        citation:
          citation_pmid: "25741868"
          citation_doi: "10.1038/gim.2015.30"
          citation_text: "Categorical; valid_values is the operative check."
