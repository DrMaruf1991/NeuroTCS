domain: "ad_trial_endpoint_scales"
framework_name: "AD trial endpoint cognitive and functional scales — ADAS-Cog 11 (0-70), ADAS-Cog 13 (0-85), ADCS-ADL (0-78), ADCS-iADL (0-59), and integrated AD Rating Scale iADRS (0-141 to 0-144). Score ranges and MCID thresholds at international consensus standard via Rosen 1984 (ADAS-Cog), Galasko 1997 (ADCS-ADL), Wessels 2015 (iADRS), Muir 2024 (MCID systematic review), and the FDA-recognized lecanemab and donanemab trial protocols."
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29, verbatim transcription from Rosen WG, Mohs RC, Davis KL. Am J Psychiatry 1984 (ADAS-Cog foundational), Mohs RC et al. Alz Dis Assoc Disord 1997 (ADAS-Cog 13 modification), Galasko D et al. Alz Dis Assoc Disord 1997 (ADCS-ADL), Wessels AM et al. J Prev Alzheimers Dis 2015 (iADRS), TRAILBLAZER-ALZ 2 protocol NCT04437511 (donanemab FDA NDA 761248), CLARITY-AD protocol NCT03887455 (lecanemab FDA NDA 761269), Muir RT et al. Alzheimer's & Dementia 2024 PMC11095473 (MCID systematic review). Score ranges directly read from FDA-recognized clinical trial Statistical Analysis Plans (SAPs)."
clinical_source_authority: |
  This pack encodes AD trial endpoint scales used across nearly every
  modern anti-amyloid AD drug development program. Multi-body endorsement:

  1. FDA: ADAS-Cog explicitly named as primary cognitive endpoint in the
     2018 Early AD Guidance (Final FDA Guidance for Industry). iADRS
     used as PRIMARY EFFICACY ENDPOINT in donanemab TRAILBLAZER-ALZ 2
     (FDA NDA 761248, BLA approval July 2024). ADCS-ADL/ADCS-iADL used
     in CLARITY-AD (FDA NDA 761269 lecanemab).

  2. EMA: ADAS-Cog and ADCS-ADL recognized as acceptable AD scientific
     advice endpoints. EMA CHMP review of lecanemab and donanemab
     accepted these as co-primary or secondary endpoints.

  3. NIA-AA AA-2024 Revised Criteria (Jack et al. 2024, PMID 38934362):
     ADAS-Cog and iADRS cited as clinical staging instruments in
     Section 5.

  4. EXPEDITION trials (Eli Lilly solanezumab): EXPEDITION/EXPEDITION2/
     EXPEDITION3 across n>5000 used ADAS-Cog and ADCS-iADL as primary
     and key secondary endpoints; iADRS was derived from these.

  5. TRAILBLAZER-ALZ (donanemab): TRAILBLAZER-ALZ (Phase 2, n=257) and
     TRAILBLAZER-ALZ 2 (Phase 3, n=1736) used iADRS as primary endpoint.
     FDA accepted iADRS for the donanemab approval pathway.

  6. CLARITY-AD (lecanemab): n=1795 used CDR-SB as primary, ADAS-Cog 14
     and ADCS-MCI-ADL as secondary; FDA accepted these for lecanemab
     approval pathway.

  7. ADNI: ADAS-Cog 11 and ADAS-Cog 13 collected on every participant
     across ADNI-1, ADNI-GO, ADNI-2, ADNI-3, ADNI-4 (n>2000 subjects).

  8. Muir 2024 Alzheimer's & Dementia systematic review (PMC11095473):
     MCID thresholds for ADAS-Cog (+2 to +3 MCI; +3 mild AD), iADRS
     (-5 MCI; -9 mild AD), CDR-SB, MMSE.

  Layer separation: This pack covers AD TRIAL ENDPOINT scales
  (ADAS-Cog, ADCS-ADL, iADRS). Companion pack
  cognitive_scales/cdr_mmse_moca_consensus covers UNIVERSAL screening
  and staging (CDR, MMSE, MoCA). Companion pack
  cognitive_scales/npiq_consensus covers BEHAVIORAL scales (NPI-Q).

