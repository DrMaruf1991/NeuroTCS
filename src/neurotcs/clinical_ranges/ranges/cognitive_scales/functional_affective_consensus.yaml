schema_version: 1.0.0
rangepack_id: cognitive_scales/functional_affective_consensus@1.0.0
pack_version: 1.0.0
effective_date: '2026-05-29'
status: production
domain: cognitive_scales
framework_name: 'Functional and affective scales universal to AD cohorts: Pfeffer Functional Activities
  Questionnaire (FAQ, total 0-30) and the 15-item Geriatric Depression Scale (GDS-15, total 0-15). Defined-range
  instruments collected at essentially every ADNI and NACC visit.'
transcribed_by: Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29. FAQ total 0-30 verbatim from Pfeffer
  RI et al. J Gerontol 1982;37(3):323-329 (DOI 10.1093/geronj/37.3.323), 10 items scored 0-3. GDS-15 total
  0-15 from Yesavage et al. 1982 / Sheikh & Yesavage 1986 short form (15 yes/no items, 1 pt each).
clinical_source_authority: |-
  This pack encodes the defined total-score ranges of two universal AD instruments. NeuroTCS audits submitted scores against the instrument's defined range; it does not administer the instruments.

   - faq_total: 0-30 (Pfeffer RI et al. J Gerontol 1982; 10 informant-rated IADL items x 0-3).
   - gds15_total: 0-15 (Yesavage 1982 / Sheikh & Yesavage 1986; 15 yes/no items, 1 pt each).

  Bounds are the defined instrument total-score ranges; values outside them are coding/data errors.
anchor_citation:
  citation_text: 'Pfeffer RI, Kurosaki TT, Harrah CH Jr, Chance JM, Filos S. Measurement of functional
    activities in older adults in the community. Journal of Gerontology 1982;37(3):323-329 (DOI 10.1093/geronj/37.3.323).
    The FAQ: 10 informant-rated IADL items, total score 0-30.'
  public_url: https://www.alz.org/getmedia/73ea01f0-690b-4ff3-b909-4f0fa9a022ef/functional-activities-questionnaire.pdf
  endorsing_bodies:
  - Alzheimer's Association
