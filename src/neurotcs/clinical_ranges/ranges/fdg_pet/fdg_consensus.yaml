            - "SNMMI Procedure Standard 2024 v2.0"
            - "EANM Brain FDG-PET v3"
            - "AA-2024 NIA-AA criteria (Core 2 N)"
      - bound_type: "hard_max"
        value: 3.0
        citation_strength: "derived"
        guideline_section: "Biologically extreme upper limit"
        citation:
          citation_pmid: "26301284"
          citation_doi: "10.1155/2015/583931"
          citation_text: |
            Multi-cohort published evidence (Bailly 2015 PMC4539420;
