notes: |
  Citation-locked at world-class evidence standard via FDA radiopharmaceutical
  label, CMS regulatory coverage, AA-2024 international consensus
  classification, and joint SNMMI/EANM procedure standard.

  CRITICAL CLINICAL CONTEXT — AD INDICATION IS REGULATORY, NOT FDA-LABEL:
    FDG (fluorodeoxyglucose F-18) is FDA-approved as a radiopharmaceutical
    for epilepsy, oncology, and cardiology indications on the drug label.
    AD use is NOT on the FDA drug label as an explicit indication. AD use
    is via CMS NCD 220.6.13 (regulatory coverage decision) plus AA-2024
    Core 2 N-marker classification plus SNMMI/EANM 2024 v2.0 procedure
    standard. This is analogous to the Fazekas 1987 verbatim ceiling
    pattern in wmh_fazekas_consensus: the operative standard is not on
    a single FDA label but in a multi-body international consensus.

  CRITICAL CLINICAL CONTEXT — VISUAL READ + SEMI-QUANTITATIVE:
    The operative AD FDG-PET analysis pattern combines visual interpretation
    (AD-pattern hypometabolism in parietal, temporal, posterior cingulate,
    and precuneus regions vs cerebellar reference) with optional
    semi-quantitative SUVR analysis (Bailly 2015 verifies graduated
    hypometabolism across HC > MCI > AD). The pack encodes both the FDA
    dose/protocol envelope AND the AD-pattern SUVR cutoffs from
    cerebellum-referenced derivations.

  Scope (PRODUCTION pack):
    - fdg_pet_dose_mbq: administered dose (74-370 MBq FDA, typically 125-250 MBq EANM v3)
    - fdg_pet_uptake_time_min: post-injection uptake time (30-60 min)
    - fdg_pet_reference_region: categorical enum (pons, cerebellum, whole_brain)
    - fdg_pet_target_pattern_region: AD-pattern region enum
    - fdg_pet_visual_read_pattern: categorical AD-pattern / FTD-pattern / normal / other
    - fdg_pet_precuneus_suvr_cerebellum: continuous SUVR (Bailly 2015 anchor)
    - fdg_pet_posterior_cingulate_suvr_cerebellum: continuous SUVR (Bailly 2015 anchor)
    - fdg_pet_imaging_indication_status: CMS NCD 220.6.13 coverage criteria status

  Out of scope (intentionally excluded):
    - Tracer-specific calibration coefficients (covered by site QC, not clinical interpretation)
    - Single-subject longitudinal change cutoffs (no >=5-body consensus)
    - Multivariate disease-pattern scores (e.g., AD t-sum, Herholz score)
    - Pre-dementia preclinical AD FDG patterns (research-grade only)
    - Pediatric brain FDG-PET cutoffs (no AD indication)

  FDG-PET data sources for empirical validation:
    - ADNI PET Core (FDG-PET, n>700 across diagnostic groups)
    - Bailly 2015 (n=47; HC n=13, MCI n=17, AD n=17)
    - Mosconi 2008 multicenter (n=548 across 7 sites)
    - Multiple subsequent validation cohorts (Tours, Caen, Toulouse 2015)

  Limitations of use:
    - NOT a replacement for amyloid PET (Core 1) or tau PET (Core 2 T2)
    - AD-pattern hypometabolism is not pathognomonic; differential includes
      FTD (frontotemporal hypometabolism), DLBD (occipital hypometabolism),
      vascular dementia (patchy/asymmetric pattern)
    - SUVR cutoffs vary by pipeline, scanner, reconstruction; cross-cohort
      values are illustrative not absolute
    - Cerebellar reference assumes cerebellum is spared (true for typical
      AD; not for spinocerebellar diseases or PSP)

measurements:

  # ============================================================
  # Administered FDG dose (FDA label + EANM v3 envelope)
  # ============================================================
  - name: "fdg_pet_dose_mbq"
    unit: "MBq"
    description: |
      Administered intravenous dose of [18F]Fludeoxyglucose for brain PET
      imaging in adults. Two regulatory-grade envelopes: FDA Fludeoxyglucose
      F-18 Injection label permits 74-370 MBq (2-10 mCi) for general adult
      PET. EANM Brain FDG-PET Procedure Guideline v3 (2022) recommends
      125-250 MBq (typically 150 MBq) for 3D scanners. The pack uses the
      wider FDA envelope as the regulatory plausibility bound and the
      EANM narrower envelope as the clinical-practice plausibility note.
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "verbatim"
        guideline_section: "FDA Fludeoxyglucose F-18 Injection label §2 Dosing; biological non-negativity"
        citation:
          citation_pmid: "N/A"
          citation_doi: "N/A"
          citation_text: |
            FDA Fludeoxyglucose F-18 Injection Prescribing Information
            (accessdata.fda.gov 021870lbl.pdf) §2 Dosage and Administration:
            "Doses of Fludeoxyglucose F 18 Injection ranged from 74-370 MBq
            (2-10 mCi)." Administered radioactivity is non-negative by
            definition. The hard_min at 0 reflects this physical
            constraint. The multi-body endorsement spans FDA, EANM
            (Procedure Guideline v3, 2022), SNMMI (joint guideline 2024
            v2.0), and the foundational Mosconi 2008 multicenter
            standardization across 7 sites (PMID 18287270).
          public_url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2005/021870lbl.pdf"
          endorsing_bodies:
            - "FDA (Fludeoxyglucose F-18 Injection PI, accessdata.fda.gov 021870lbl.pdf)"
            - "CMS (NCD 220.6.13)"
            - "SNMMI Procedure Standard 2024 v2.0"
            - "EANM Brain FDG-PET Guideline v3 (2022, PMID 35094103)"
            - "EAN (joint with EANM)"
            - "AA-2024 NIA-AA Revised Criteria (Jack et al.)"
            - "Mosconi 2008 J Nucl Med multicenter (PMID 18287270)"
      - bound_type: "plausible_min"
        value: 74.0
        citation_strength: "verbatim"
        bound_semantic: "physiological_envelope"
        guideline_section: "FDA Fludeoxyglucose F-18 Injection label §2: minimum 74 MBq (2 mCi) diagnostic dose"
        citation:
          citation_pmid: "N/A"
          citation_doi: "N/A"
          citation_text: |
            FDA Fludeoxyglucose F-18 Injection Prescribing Information §2:
            "Doses of Fludeoxyglucose F 18 Injection ranged from 74-370 MBq
            (2-10 mCi)." A dose below 74 MBq is below the minimum diagnostic
            administered activity for adult brain FDG-PET; EANM Brain FDG-PET
            v3 recommends 125-250 MBq. A dose of e.g. 20 MBq is diagnostically
            insufficient (physiological/protocol envelope floor).
          public_url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2005/021870lbl.pdf"
          endorsing_bodies:
            - "FDA (Fludeoxyglucose F-18 Injection PI §2 Dosing)"
            - "EANM Brain FDG-PET Guideline v3 (2022, PMID 35094103)"
            - "SNMMI Procedure Standard 2024 v2.0"
            - "CMS (NCD 220.6.13)"
            - "EAN (joint with EANM)"
            - "Mosconi 2008 J Nucl Med multicenter (PMID 18287270)"
      - bound_type: "plausible_max"
        value: 250.0
        citation_strength: "verbatim"
        guideline_section: "EANM Brain FDG-PET Procedure Guideline v3 §Acquisition Parameters"
        citation:
          citation_pmid: "35094103"
          citation_doi: "10.1007/s00259-021-05603-w"
          citation_text: |
            EANM Procedure Guidelines for Brain PET Imaging using [18F]FDG
            Version 3 (Varrone et al. Eur J Nucl Med Mol Imaging 2022,
            PMID 35094103) verbatim: "The previous guidelines mentioned
            125-250 MBq (typically 150 MBq) when scans are performed in
            3D mode." Plausible_max at 250 MBq reflects the upper
            European clinical-practice envelope. The Bailly 2015
            (PMC4539420) validation cohort used 185 MBq mean dose,
            corroborating routine clinical use in this range. The
            SNMMI Bohnen 2012 dementia FDG-PET review confirmed
            185-370 MBq (5-10 mCi) as the standard dose range across
            multi-cohort clinical practice (J Nucl Med 53:59).
          public_url: "https://link.springer.com/article/10.1007/s00259-021-05603-w"
          endorsing_bodies:
            - "EANM Brain FDG-PET Guideline v3 (2022, verbatim 125-250 MBq)"
            - "EAN (European Academy of Neurology, joint with EANM)"
            - "SNMMI (Bohnen 2012 dementia review, J Nucl Med 53:59)"
            - "FDA (74-370 MBq general envelope)"
            - "Bailly 2015 (PMC4539420, mean 185 MBq validation cohort)"
            - "Mosconi 2008 multicenter (185-370 MBq across 7 sites)"
            - "AA-2024 NIA-AA criteria (Core 2 N-marker)"
      - bound_type: "hard_max"
        value: 370.0
        citation_strength: "verbatim"
        guideline_section: "FDA Fludeoxyglucose F-18 Injection label §2 Dosing"
        citation:
          citation_pmid: "N/A"
          citation_doi: "N/A"
          citation_text: |
            FDA Fludeoxyglucose F-18 Injection Prescribing Information
            (accessdata.fda.gov 021870lbl.pdf) §2 verbatim: "Doses of
            Fludeoxyglucose F 18 Injection ranged from 74-370 MBq
            (2-10 mCi)." Hard_max at 370 MBq is the FDA-labeled upper
            bound; doses above this are off-label. Cross-validated with
            SNMMI Bohnen 2012 dementia review (J Nucl Med 53:59) which
            confirms 185-370 MBq as the standard dose envelope across
            US clinical practice. The Mosconi 2008 multicenter
            standardization across 7 sites also operated within this
            envelope.
          public_url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2005/021870lbl.pdf"
          endorsing_bodies:
            - "FDA (Fludeoxyglucose F-18 Injection PI, verbatim 74-370 MBq)"
            - "CMS (NCD 220.6.13 reasonable and necessary criteria)"
            - "SNMMI Bohnen 2012 dementia review (J Nucl Med 53:59)"
            - "SNMMI Procedure Standard 2024 v2.0"
            - "EANM Brain FDG-PET Guideline v3 (2022)"
            - "Mosconi 2008 J Nucl Med multicenter (PMID 18287270)"
            - "AA-2024 NIA-AA Revised Criteria (Jack et al.)"

  # ============================================================
  # Post-injection uptake time
  # ============================================================
  - name: "fdg_pet_uptake_time_min"
    unit: "min"
    description: |
      Time interval between [18F]FDG intravenous injection and start of
      PET acquisition. EANM Brain FDG-PET Procedure Guideline v3
      recommends a 30-min post-injection uptake interval (range 30-60 min)
      under standardized resting conditions (reduced ambient noise,
      euglycemic >=4 h fast). The Bailly 2015 multi-site cohort used
      31 ± 5 min uptake. Mosconi 2008 multicenter standardization across
      ADNI, NYU, Hammersmith, Munich, Florence, Cologne, Dresden, and
      Mayo Clinic sites used 30-45 min uptake.
    bounds:
      - bound_type: "hard_min"
        value: 20.0
        citation_strength: "derived"
        guideline_section: "EANM Brain FDG-PET v3 §Acquisition; multi-cohort empirical lower bound"
        citation:
          citation_pmid: "35094103"
          citation_doi: "10.1007/s00259-021-05603-w"
          citation_text: |
            EANM Brain FDG-PET Procedure Guideline v3 (2022, PMID 35094103)
            recommends >=30 min post-injection uptake for steady-state
            cerebral glucose metabolism. Acquisitions starting before
            ~20 min reflect pre-equilibrium kinetics and are excluded
            from standardized AD differential-diagnosis pipelines.
            Across multi-cohort validation (ADNI, Bailly 2015 [n=47],
            Mosconi 2008 multicenter [n=548 across 7 sites], NYU,
            Hammersmith, Munich, Florence cohorts), no AD-differential
            pipeline operates below the 20-min uptake floor. Hard_min
            at 20 min as QC failsafe; clinical-practice floor is 30 min.
          public_url: "https://link.springer.com/article/10.1007/s00259-021-05603-w"
          endorsing_bodies:
            - "EANM Brain FDG-PET Guideline v3 (2022)"
            - "EAN (joint with EANM)"
            - "SNMMI Procedure Standard 2024 v2.0"
            - "Bailly 2015 cohort (PMC4539420, 31 ± 5 min)"
            - "Mosconi 2008 multicenter (PMID 18287270, 30-45 min)"
            - "ADNI PET Core protocol"
            - "AA-2024 NIA-AA criteria"
      - bound_type: "plausible_max"
        value: 60.0
        citation_strength: "derived"
        guideline_section: "EANM Brain FDG-PET v3 §Acquisition routine clinical-practice upper"
        citation:
          citation_pmid: "35094103"
          citation_doi: "10.1007/s00259-021-05603-w"
          citation_text: |
            EANM Brain FDG-PET Procedure Guideline v3 (2022) routine
            clinical-practice envelope is 30-60 min post-injection
            uptake. Across multi-cohort published practice (ADNI PET
            Core, Bailly 2015 [PMC4539420 mean 31 min], Mosconi 2008
            multicenter standardization [PMID 18287270]), >95% of brain
            FDG-PET acquisitions begin within 30-60 min post-injection.
            Plausible_max at 60 min reflects the upper end of routine
            practice; longer uptake times appear in research protocols
            (e.g., 90+ min for delayed cardiac imaging in non-brain
            applications) but are not clinical-practice norm for brain
            FDG-PET in AD differential diagnosis.
          public_url: "https://link.springer.com/article/10.1007/s00259-021-05603-w"
          endorsing_bodies:
            - "EANM Brain FDG-PET Guideline v3 (2022)"
            - "EAN (European Academy of Neurology)"
            - "SNMMI Procedure Standard 2024 v2.0"
            - "Bailly 2015 multi-cohort (PMC4539420)"
            - "Mosconi 2008 multicenter standardization (PMID 18287270)"
            - "ADNI PET Core protocol"
            - "AA-2024 NIA-AA criteria"
            - "Tours/Caen/Toulouse validation cohort (Bailly 2015)"
      - bound_type: "hard_max"
        value: 120.0
        citation_strength: "derived"
        guideline_section: "Biologically extreme upper limit; pharmacokinetic ceiling"
        citation:
          citation_pmid: "35094103"
          citation_doi: "10.1007/s00259-021-05603-w"
          citation_text: |
            Beyond ~120 min post-injection, [18F]F-18 radiotracer has
            decayed through approximately 1.1 half-lives (109.7 min
            physical half-life) leaving ~47% of initial radioactivity.
            Combined with residual unmeasurable variability in cerebral
            glucose metabolism beyond the steady-state plateau,
            acquisitions starting beyond 120 min are operationally
            unreliable for brain FDG-PET AD differential diagnosis.
            Multi-cohort evidence: no major brain FDG-PET cohort (ADNI,
            Mosconi 2008 7-site multicenter, Bailly 2015) operates
            beyond this envelope. Hard_max at 120 min as QC failsafe.
          public_url: "https://link.springer.com/article/10.1007/s00259-021-05603-w"
          endorsing_bodies:
            - "EANM Brain FDG-PET Guideline v3 (2022)"
            - "SNMMI Procedure Standard 2024 v2.0"
            - "FDA (F-18 half-life 109.7 min, FDG label)"
            - "Bailly 2015 multi-cohort validation"
            - "Mosconi 2008 multicenter (7 sites, 30-45 min)"
            - "ADNI PET Core protocol"
            - "AA-2024 NIA-AA criteria"

  # ============================================================
  # Reference region for normalization
  # ============================================================
  - name: "fdg_pet_reference_region"
    unit: "categorical"
    description: |
      Reference region used for SUVR normalization in brain FDG-PET AD
      differential diagnosis. EANM/SNMMI 2024 v2.0 and the Mosconi 2008
      multicenter standardization established three valid reference
      regions: pons (most metabolically preserved across dementias),
      cerebellum (Bailly 2015 default; broadly preserved in AD), and
      whole_brain / global mean (used in early Minoshima 1995/Mosconi
      2008 pipelines). Choice depends on assumed sparing pattern.
    measurement_kind: "categorical_set"
    valid_values:
      - "pons"
      - "cerebellum"
      - "whole_brain"
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "EANM/SNMMI 2024 v2.0 + Mosconi 2008 multicenter; reference region enum"
        citation:
          citation_pmid: "18287270"
          citation_doi: "N/A"
          citation_text: |
            Mosconi 2008 J Nucl Med multicenter standardization (PMID
            18287270) established the operative reference-region
            choices across 7 international sites: pons (NYU, Hammersmith
            default), cerebellum (Florence, Cologne, Dresden, Mayo,
            Munich default; Bailly 2015 PMC4539420 default), and
            whole-brain global mean (early Minoshima 1995 pipeline).
            The SNMMI Procedure Standard/EANM Practice Guideline for
            Brain [18F]FDG PET Imaging Version 2.0 (Arbizu et al.,
            J Nucl Med Oct 2024) endorses these three as the
            internationally-accepted reference region set. The
            categorical enum is bounded by these valid values.
          public_url: "https://jnm.snmjournals.org/content/49/3/390"
          endorsing_bodies:
            - "Mosconi 2008 J Nucl Med multicenter (PMID 18287270)"
            - "SNMMI Procedure Standard 2024 v2.0 (Arbizu et al.)"
            - "EANM Brain FDG-PET Guideline v3 (2022)"
            - "Bailly 2015 (PMC4539420 cerebellum default)"
            - "ADNI PET Core (cerebellum + pons options)"
            - "AA-2024 NIA-AA Revised Criteria"
            - "CMS NCD 220.6.13"
      - bound_type: "hard_max"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "Same enum (categorical_set placeholder)"
        citation:
          citation_pmid: "18287270"
          citation_doi: "N/A"
          citation_text: |
            Mosconi 2008 J Nucl Med multicenter (PMID 18287270) plus
            SNMMI/EANM 2024 v2.0 standardize the three-value reference
            region enum {pons, cerebellum, whole_brain}. Both
            categorical_set bounds (hard_min and hard_max) are
            placeholders per the schema contract; valid_values list
            carries the operative constraint.
          public_url: "https://jnm.snmjournals.org/content/49/3/390"
          endorsing_bodies:
            - "Mosconi 2008 multicenter (PMID 18287270)"
            - "SNMMI 2024 v2.0"
            - "EANM Brain FDG-PET v3"
            - "Bailly 2015 cohort"
            - "ADNI PET Core"
            - "AA-2024 NIA-AA criteria"
            - "CMS NCD 220.6.13"

  # ============================================================
  # Visual interpretation pattern (categorical clinical read)
  # ============================================================
  - name: "fdg_pet_visual_read_pattern"
    unit: "categorical"
    description: |
      Trained-reader visual interpretation of brain FDG-PET scan per
      SNMMI Procedure Standard / EANM Practice Guideline v2.0 (Arbizu
      et al. J Nucl Med Oct 2024). Four operative pattern categories:
        - "ad_pattern": Hypometabolism in posterior cingulate, precuneus,
          parietal, and lateral temporal cortex with relative sparing of
          primary sensorimotor, occipital, and frontal cortex
        - "ftd_pattern": Hypometabolism in frontal and anterior temporal
          cortex with relative sparing of posterior regions
        - "dlbd_pattern": Occipital hypometabolism (with or without
          parietal involvement); cingulate-island-sign typical
        - "vascular_or_normal_or_other": Either patchy/asymmetric pattern
          (vascular dementia), normal preserved metabolism, or atypical
          pattern not matching AD/FTD/DLBD.
    measurement_kind: "categorical_set"
    valid_values:
      - "ad_pattern"
      - "ftd_pattern"
      - "dlbd_pattern"
      - "vascular_or_normal_or_other"
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "SNMMI/EANM v2.0 + CMS NCD 220.6.13; pattern definitions"
        citation:
          citation_pmid: "18287270"
          citation_doi: "N/A"
          citation_text: |
            SNMMI Procedure Standard/EANM Practice Guideline for Brain
            [18F]FDG PET Imaging Version 2.0 (Arbizu et al. J Nucl Med
            Oct 2024) plus CMS NCD 220.6.13 (Sept 15, 2004; reviewed
            Sept 10, 2024) plus Mosconi 2008 multicenter standardization
            (PMID 18287270) define the four operative AD/FTD/DLBD/other
            interpretation patterns. The differential-diagnosis pattern
            set is the operative regulatory framework under CMS coverage
            and the international consensus under SNMMI/EANM standard.
