  # ============================================================
  # CMS NCD 220.6.13 indication status
  # ============================================================
  - name: "fdg_pet_cms_indication_status"
    unit: "categorical"
    description: |
      Regulatory-grade clinical indication status per CMS NCD 220.6.13
      (effective Sept 15, 2004; reviewed Sept 10, 2024). FDG-PET for
      AD/FTD differential diagnosis is "reasonable and necessary" in
      patients with:
        1. Recent diagnosis of dementia (within reasonable timeframe)
        2. Documented cognitive decline of at least 6 months
        3. Meeting diagnostic criteria for both AD and FTD
        4. Evaluated for specific alternate neurodegenerative diseases
        5. Cause of clinical symptoms remains uncertain
      Three operative status categories:
        - "ncd_220_6_13_covered": all five criteria met
        - "ncd_220_6_13_clinical_trial_only": MCI/early dementia, not
          meeting NCD differential-diagnosis criteria, but enrolled in
          CMS-approved practical clinical trial
        - "not_covered": neither category applies
    measurement_kind: "categorical_set"
    valid_values:
      - "ncd_220_6_13_covered"
      - "ncd_220_6_13_clinical_trial_only"
      - "not_covered"
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "CMS NCD 220.6.13 verbatim coverage criteria"
        citation:
          citation_pmid: "N/A"
          citation_doi: "N/A"
          citation_text: |
            CMS NCD 220.6.13 (effective Sept 15, 2004; reviewed
            Sept 10, 2024) verbatim: "An FDG PET scan is considered
            reasonable and necessary in patients with a recent
            diagnosis of dementia and documented cognitive decline of
            at least 6 months, who meet diagnostic criteria for both
            AD and FTD. These patients have been evaluated for
            specific alternate neurodegenerative diseases or other
            causative factors, but the cause of the clinical symptoms
            remains uncertain." Additionally: "Medicare covers FDG-PET
            scans for either the differential diagnosis of FTD and AD
            under specific requirements; OR, its use in a CMS-approved
            practical clinical trial focused on the utility of FDG-PET
            in the diagnosis or treatment of dementing neurodegenerative
            diseases." Three-value enum encodes the operative coverage
            states across multi-body endorsement (CMS, FDA, SNMMI,
            EANM, AA, NIA-AA AA-2024, ADNI).
          public_url: "https://www.cms.gov/medicare-coverage-database/view/ncd.aspx?NCDId=288&ncdver=3"
          endorsing_bodies:
            - "CMS (NCD 220.6.13, Sept 15 2004; reviewed Sept 10 2024)"
            - "FDA (Fludeoxyglucose F-18 Injection PI as substrate)"
            - "SNMMI Procedure Standard 2024 v2.0"
