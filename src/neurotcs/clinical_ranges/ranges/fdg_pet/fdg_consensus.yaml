          citation_doi: "10.1155/2015/583931"
          citation_text: |
            Bailly 2015 cerebellum-referenced PCC SUVR in HC group:
            mean 1.22. Cross-cohort corroboration (Mosconi 2008
            multicenter n=548 across 7 sites; ADNI PET Core normative
            distribution; Minoshima 1997 Ann Neurol 42:85 foundational
            study) shows HC PCC SUVR rarely exceeds 1.5 (approximately
            mean + 2-3 SD of healthy adult cerebellum-referenced
            distribution). Plausible_max at 1.5 covers the 99th
            percentile of multi-cohort published normative values.
          public_url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4539420/"
          endorsing_bodies:
