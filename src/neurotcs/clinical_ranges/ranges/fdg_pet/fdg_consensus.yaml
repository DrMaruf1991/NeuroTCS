framework_name: "Brain [18F]FDG PET for differential diagnosis of dementia and cognitive impairment — FDA-labeled radiopharmaceutical dose envelope, EANM/SNMMI procedure guideline dose envelope, AA-2024 Core 2 neurodegeneration biomarker classification, CMS NCD 220.6.13 AD/FTD coverage indication, and Mosconi/Bailly-derived AD-pattern hypometabolism cutoffs (precuneus and posterior cingulate SUVR vs cerebellar reference)"
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-28, verbatim transcription from FDA Fludeoxyglucose F-18 Injection Prescribing Information (accessdata.fda.gov 021870lbl.pdf), CMS NCD 220.6.13 (Sept 15, 2004; last reviewed 09/10/2024), SNMMI Procedure Standard/EANM Practice Guideline for Brain [18F]FDG PET Imaging Version 2.0 (Arbizu et al., J Nucl Med Oct 2024), EANM Procedure Guidelines for Brain PET Imaging using [18F]FDG Version 3 (Eur J Nucl Med Mol Imaging 2022, PMID 35094103), Mosconi et al. J Nucl Med 2008 (PMID 18287270 multicenter standardized FDG-PET diagnosis), Bailly et al. BioMed Res Int 2015 (PMC4539420 precuneus/posterior cingulate SUVR), and AA-2024 NIA-AA Revised Criteria for Diagnosis and Staging of Alzheimer's Disease (Jack et al. Alzheimer's Dement 2024 PMID 38934362, Table 7 Core 2 biomarker N classification)"
clinical_source_authority: |
  This pack encodes brain [18F]FDG PET clinical-grade parameters for use in
  differential diagnosis of Alzheimer's disease and other neurodegenerative
  dementias. The evidence base spans seven layers of regulatory and
  scientific endorsement:

  1. FDA: Fludeoxyglucose F-18 Injection is an FDA-approved radiopharmaceutical
     (accessdata.fda.gov 021870lbl.pdf). FDA-labeled neurology indication is
     epilepsy (identifying regions of abnormal glucose metabolism associated
     with epileptogenic foci). AD use is via the established
     differential-diagnosis pathway under CMS coverage, not as an FDA-labeled
     AD indication. Dose envelope from FDA label: 74-370 MBq (2-10 mCi).

  2. CMS: National Coverage Determination NCD 220.6.13 (effective Sept 15,
     2004; reviewed Sept 10, 2024) provides regulatory-grade coverage for
     FDG-PET in AD/FTD differential diagnosis with specific clinical
     requirements: recent dementia diagnosis, documented cognitive decline
     >=6 months, meeting criteria for both AD and FTD, evaluation for
     alternate neurodegenerative diseases completed, cause of clinical
     symptoms uncertain.

  3. NIA-AA AA-2024 Revised Criteria (Jack et al. 2024): FDG-PET is
     classified as a Core 2 biomarker (N — neurodegeneration), Table 7.
     This is the operative international consensus classification within
     the AT(N)/biological staging framework.

  4. SNMMI: Procedure Standard/EANM Practice Guideline for Brain [18F]FDG
     PET Imaging Version 2.0 (Arbizu et al., J Nucl Med Oct 17, 2024).
     Joint SNMMI/EANM standard explicitly covers cognitive impairment and
     dementia as a common clinical indication.

  5. EANM: Procedure Guidelines for Brain PET Imaging using [18F]FDG
     Version 3 (Eur J Nucl Med Mol Imaging 2022, PMID 35094103). European
     dose envelope: 125-250 MBq (typically 150 MBq) for 3D scanners.

  6. EAN (European Academy of Neurology): Integrated recommendations on
     FDG-PET in cognitive impairment and dementia (cited in EANM v3 and
     SNMMI/EANM v2.0).

  7. Mosconi multicenter standardization (Mosconi et al. J Nucl Med 2008,
     PMID 18287270): Foundational multicenter standardized FDG-PET
     diagnosis of MCI, AD, and other dementias establishing the
     AD-pattern hypometabolism in parietal, temporal, posterior cingulate,
     and precuneus regions.

  Layer separation: This pack covers BRAIN FDG-PET CLINICAL PARAMETERS for
  AD differential diagnosis. Companion pack pet_amyloid/centiloid_consensus
  covers amyloid PET quantification. Companion pack tau_pet/tau_consensus
  covers tau PET visual interpretation. Companion pack ad/aria_safety
  covers monitoring during anti-amyloid therapy. Group 8 anti-amyloid
  safety endpoints span ARIA-E and ARIA-H detection on MRI, not on FDG-PET.

anchor_citation:
  citation_pmid: "18287270"
  citation_doi: "N/A"
  citation_text: |
    Mosconi L, Tsui WH, Herholz K, Pupi A, Drzezga A, Lucignani G, Reiman EM,
    Holthoff V, Kalbe E, Sorbi S, Diehl-Schmid J, Perneczky R, Clerici F,
    Caselli R, Beuthien-Baumann B, Kurz A, Minoshima S, de Leon MJ. Multicenter
    standardized 18F-FDG PET diagnosis of mild cognitive impairment,
    Alzheimer's disease, and other dementias. J Nucl Med. 2008 Mar;49(3):
    390-398 (PMID 18287270). The foundational multicenter standardization
    study (n=548 across 7 sites: NYU, Hammersmith, Munich, Florence, Cologne,
    Dresden, Mayo Clinic) establishing reproducible AD-pattern hypometabolism
    in posterior cingulate, precuneus, parietal, and temporal regions, with
    cerebellar reference normalization. The discriminant analysis classifier
    achieved sensitivity 95% and specificity 92% for AD vs controls, and
    sensitivity 76% and specificity 81% for MCI conversion to AD over
    2-year follow-up. The standardized analysis protocol established here
    underpins all subsequent FDG-PET clinical-trial pipelines including
    ADNI PET Core.
