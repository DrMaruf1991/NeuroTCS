    - "Society of Nuclear Medicine and Molecular Imaging (SNMMI Procedure Standard 2024 v2.0)"
    - "European Association of Nuclear Medicine (EANM Brain FDG-PET Guideline v3, 2022; v2.0 joint with SNMMI, 2024)"
    - "European Academy of Neurology (EAN, joint recommendations with EANM)"
    - "NIA-AA AA-2024 Revised Criteria (Jack et al. PMID 38934362, Core 2 N-marker classification)"
