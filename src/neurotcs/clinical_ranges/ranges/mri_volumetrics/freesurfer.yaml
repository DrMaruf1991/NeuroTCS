schema_version: "1.0.0"
rangepack_id: "mri_volumetrics/freesurfer@1.0.0"
pack_version: "1.0.0"
effective_date: "2026-05-25"
status: "deprecated"
deprecated_in_favor_of: "mri_volumetrics/structural_volumetry_consensus@1.0.0"
deprecation_reason: "Superseded in v1.10.2 by two replacement packs: mri_volumetrics/structural_volumetry_consensus@1.0.0 (production, world-class international_consensus bounds for AD-relevant baseline volumetry anchored on Bethlehem 2022 + Desikan 2006 + Potvin 2017 + ENIGMA QC + FDA 510(k) tools) and mri_volumetrics/freesurfer_extended@1.0.0 (research_preview, extended FreeSurfer regional measurements). This v1.10.0-era pack mixed production-grade and research-grade bounds without proper separation; the v1.10.2 two-pack strategy enforces world-class evidence discipline. Retained on disk for historical reference only."
domain: "mri_volumetrics"
framework_name: "Adult MRI volumetric and microstructural plausibility ranges (FreeSurfer + ENIGMA distributions + physical constants)"
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-25"
clinical_source_authority: |
  FreeSurfer technical paper (Fischl 2012 NeuroImage) for segmentation
  pipeline output ranges; ENIGMA consortium meta-analyses (Hibar 2017
  for hippocampus, Schmaal 2020 for cortical thickness) for population
  distributions in adult cohorts including AD continuum; Cordonnier 2009
  Microbleeds in Cerebral Small Vessel Disease for microbleed scale;
  Fazekas 1987 for WMH grading scale.

  Hard bounds are physical-impossibility floors (e.g. negative volume)
  and biological ceilings (e.g. adult cortical thickness physical max).
  Plausible bounds are 0.5-99.5 percentile envelope across CN + AD
  adult cohorts.

anchor_citation:
  citation_pmid: "22248573"
  citation_doi: "10.1016/j.neuroimage.2012.01.021"
  citation_text: |
    Fischl B. FreeSurfer. NeuroImage. 2012;62(2):774-781.
    The technical reference for the volumetric pipeline whose output
    these bounds describe.

notes: |
  Adult cohort assumed (age ≥ 50). Pediatric cortical thickness can exceed
  adult plausible_max and is out of scope for v1.x (AD-only).

measurements:

  # ---- Hippocampus ----
  - name: "hippocampus_L_mm3"
    unit: "mm3"
    description: "Left hippocampus volume (FreeSurfer aseg) in mm^3."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Volume non-negativity (Fischl 2012 §2 aseg pipeline)"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Anatomical volume measurements must be non-negative; negative values indicate processing or transcription error."
      - bound_type: "hard_max"
        value: 8000.0
        guideline_section: "ENIGMA-1 hippocampus meta-analysis upper tail"
        citation:
          citation_pmid: "25754519"
          citation_doi: "10.1038/nature14101"
          citation_text: |
            Hibar DP et al. Common genetic variants influence human subcortical
            brain structures (Nature 2015): adult hippocampus volume distribution
            essentially never exceeds 6000 mm^3; > 8000 mm^3 indicates segmentation
            failure or transcription error.

  - name: "hippocampus_R_mm3"
    unit: "mm3"
    description: "Right hippocampus volume (FreeSurfer aseg) in mm^3."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Volume non-negativity"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Anatomical volume measurements must be non-negative."
      - bound_type: "hard_max"
        value: 8000.0
        guideline_section: "Hibar 2015 ENIGMA distribution"
        citation:
          citation_pmid: "25754519"
          citation_doi: "10.1038/nature14101"
          citation_text: "Adult right hippocampus volume essentially never exceeds 6000 mm^3."

  # ---- Entorhinal cortex ----
  - name: "entorhinal_L_mm3"
    unit: "mm3"
    description: "Left entorhinal cortex volume (FreeSurfer aparc) in mm^3."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Volume non-negativity"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Anatomical volume measurements must be non-negative."
      - bound_type: "hard_max"
        value: 5000.0
        guideline_section: "ADNI cohort distribution"
        citation:
          citation_pmid: "20451459"
          citation_doi: "10.1016/j.neuroimage.2010.04.255"
          citation_text: |
            Mueller SG et al. Ways toward an early diagnosis in Alzheimer's
            disease: The Alzheimer's Disease Neuroimaging Initiative (ADNI).
            Entorhinal cortex volume in adults essentially never exceeds
            4000 mm^3; > 5000 indicates segmentation failure.

  - name: "entorhinal_R_mm3"
    unit: "mm3"
    description: "Right entorhinal cortex volume (FreeSurfer aparc) in mm^3."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Volume non-negativity"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Anatomical volume measurements must be non-negative."
      - bound_type: "hard_max"
        value: 5000.0
        guideline_section: "Mueller 2010 ADNI distribution"
        citation:
          citation_pmid: "20451459"
          citation_doi: "10.1016/j.neuroimage.2010.04.255"
          citation_text: "Adult right entorhinal cortex volume essentially never exceeds 4000 mm^3."

  # ---- Amygdala ----
  - name: "amygdala_L_mm3"
    unit: "mm3"
    description: "Left amygdala volume (FreeSurfer aseg) in mm^3."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Volume non-negativity (Fischl 2012 §2 aseg pipeline)"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Anatomical volume measurements must be non-negative; negative values indicate transcription error."
      - bound_type: "hard_max"
        value: 4000.0
        guideline_section: "ENIGMA amygdala distribution"
        citation:
          citation_pmid: "25754519"
          citation_doi: "10.1038/nature14101"
          citation_text: "Adult left amygdala volume essentially never exceeds 2500 mm^3."

  - name: "amygdala_R_mm3"
    unit: "mm3"
    description: "Right amygdala volume (FreeSurfer aseg) in mm^3."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Volume non-negativity"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Anatomical volume measurements must be non-negative."
      - bound_type: "hard_max"
        value: 4000.0
        guideline_section: "ENIGMA amygdala distribution"
        citation:
          citation_pmid: "25754519"
          citation_doi: "10.1038/nature14101"
          citation_text: "Adult right amygdala volume essentially never exceeds 2500 mm^3."

  # ---- Lateral ventricles ----
  - name: "lateral_ventricles_mm3"
    unit: "mm3"
    description: "Combined lateral ventricle volume (FreeSurfer aseg) in mm^3."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Volume non-negativity"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Anatomical volume measurements must be non-negative."
      - bound_type: "hard_max"
        value: 250000.0
        guideline_section: "Severe-hydrocephalus literature ceiling"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Adult lateral ventricle volume even in advanced AD with hydrocephalus rarely exceeds 150,000 mm^3; > 250,000 indicates segmentation overflow."

  # ---- Cortical thickness ----
  - name: "cortical_thickness_mm"
    unit: "mm"
    description: "Mean cortical thickness (FreeSurfer aparc) in mm."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Thickness non-negativity"
        citation:
          citation_pmid: "22248573"
          citation_doi: "10.1016/j.neuroimage.2012.01.021"
          citation_text: "Cortical thickness must be non-negative."
      - bound_type: "hard_max"
        value: 5.0
        guideline_section: "Adult cortical-thickness physical ceiling"
        citation:
          citation_pmid: "10805292"
          citation_doi: "10.1073/pnas.200033797"
          citation_text: |
            Fischl B, Dale AM. Measuring the thickness of the human cerebral
            cortex from magnetic resonance images (PNAS 2000): adult cortical
            thickness across the brain ranges roughly 1.5-4.5 mm; > 5.0 mm is
            beyond documented adult range and indicates segmentation error
            or transcription mistake.
      - bound_type: "plausible_min"
        value: 1.5
        guideline_section: "Schmaal 2020 ENIGMA-MDD adult cortical thickness lower tail"
        citation:
          citation_pmid: "30872829"
          citation_doi: "10.1038/s41380-019-0364-x"
          citation_text: "Adult mean cortical thickness < 1.5 mm warrants segmentation review."
      - bound_type: "plausible_max"
        value: 4.5
        guideline_section: "Schmaal 2020 upper tail"
        citation:
          citation_pmid: "30872829"
          citation_doi: "10.1038/s41380-019-0364-x"
          citation_text: "Adult mean cortical thickness > 4.5 mm warrants segmentation review."

  # ---- Fazekas scales (categorical 0-3) ----
  - name: "fazekas_periventricular"
    unit: "score"
    description: "Fazekas periventricular white-matter hyperintensity score (0-3 scale)."
    measurement_kind: "categorical_set"
    valid_values: ["0", "1", "2", "3"]
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Fazekas 1987 §Methods Table 1"
        citation:
          citation_pmid: "3496763"
          citation_doi: "10.2214/ajr.149.2.351"
          citation_text: |
            Fazekas F, Chawluk JB, Alavi A, Hurtig HI, Zimmerman RA. MR signal
            abnormalities at 1.5 T in Alzheimer's dementia and normal aging.
            AJR 1987;149:351-356. The Fazekas scale is defined exactly as
            {0=absent, 1=caps/pencil-thin lining, 2=smooth halo, 3=irregular
            periventricular signal extending into deep white matter}.
            Values outside {0,1,2,3} indicate transcription error.
      - bound_type: "hard_max"
        value: 3.0
        guideline_section: "Fazekas 1987 §Methods Table 1"
        citation:
          citation_pmid: "3496763"
          citation_doi: "10.2214/ajr.149.2.351"
          citation_text: "Fazekas scale is 0-3 only; values > 3 indicate transcription error."

  - name: "fazekas_deep_white"
    unit: "score"
    description: "Fazekas deep-white-matter hyperintensity score (0-3 scale)."
    measurement_kind: "categorical_set"
    valid_values: ["0", "1", "2", "3"]
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Fazekas 1987 §Methods Table 1"
        citation:
          citation_pmid: "3496763"
          citation_doi: "10.2214/ajr.149.2.351"
          citation_text: "Fazekas DWM scale is 0-3."
      - bound_type: "hard_max"
        value: 3.0
        guideline_section: "Fazekas 1987 §Methods Table 1"
        citation:
          citation_pmid: "3496763"
          citation_doi: "10.2214/ajr.149.2.351"
          citation_text: "Fazekas DWM scale is 0-3."

  # ---- Microbleed count ----
  - name: "microbleed_count"
    unit: "count"
    description: "Cerebral microbleed count (T2*/SWI)."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "Count non-negativity"
        citation:
          citation_pmid: "19233729"
          citation_doi: "10.1016/S1474-4422(09)70013-4"
          citation_text: |
            Cordonnier C, Al-Shahi Salman R, Wardlaw J. Spontaneous brain
            microbleeds: systematic review, subgroup analyses and standards
            for study design and reporting (Brain 2007). Count measurements
            must be non-negative integers.
      - bound_type: "hard_max"
        value: 500.0
        guideline_section: "Severe CAA literature upper tail"
        citation:
          citation_pmid: "19233729"
          citation_doi: "10.1016/S1474-4422(09)70013-4"
          citation_text: "Microbleed counts > 500 reported only in severe CAA case series; warrants verification."

  # ---- DTI uncinate FA ----
  - name: "dti_fa_uncinate_L"
    unit: "fa"
    description: "Left uncinate fasciculus fractional anisotropy (dimensionless 0-1)."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "FA scale definition (Basser 1996, Pierpaoli 1996)"
        citation:
          citation_pmid: "8946355"
          citation_doi: "10.1002/mrm.1910360612"
          citation_text: |
            Pierpaoli C, Basser PJ. Toward a quantitative assessment of
            diffusion anisotropy. Magn Reson Med. 1996;36(6):893-906.
            Fractional anisotropy is defined on [0, 1] by construction
            (FA = sqrt(3/2) * sqrt((λ1-λ̄)² + (λ2-λ̄)² + (λ3-λ̄)²) /
            sqrt(λ1² + λ2² + λ3²)). Negative FA is mathematically impossible.
      - bound_type: "hard_max"
        value: 1.0
        guideline_section: "FA scale definition"
        citation:
          citation_pmid: "8946355"
          citation_doi: "10.1002/mrm.1910360612"
          citation_text: "FA is bounded above by 1.0 by definition; values > 1.0 are mathematically impossible."

  - name: "dti_fa_uncinate_R"
    unit: "fa"
    description: "Right uncinate fasciculus fractional anisotropy."
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        guideline_section: "FA scale definition"
        citation:
          citation_pmid: "8946355"
          citation_doi: "10.1002/mrm.1910360612"
          citation_text: "FA is bounded below by 0.0 by definition."
      - bound_type: "hard_max"
        value: 1.0
        guideline_section: "FA scale definition"
        citation:
          citation_pmid: "8946355"
          citation_doi: "10.1002/mrm.1910360612"
          citation_text: "FA is bounded above by 1.0 by definition."
