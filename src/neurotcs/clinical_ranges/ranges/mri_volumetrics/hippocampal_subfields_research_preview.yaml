- name: ca1_volume_left_mm3
  unit: mm^3
  description: Left CA1 volume in mm^3 (FreeSurfer hippocampal-subfield module label CA1, lh.hippoSfVolumes;
    Iglesias 2015 atlas).
  measurement_kind: numeric
  bounds:
  - bound_type: hard_min
    value: 150.0
    citation_strength: derived
    guideline_section: FreeSurfer canonical hippocampal-subfield output floor (segmentation-failure threshold)
    citation:
      citation_pmid: '25936807'
      citation_doi: 10.1016/j.neuroimage.2015.04.042
      citation_text: Left CA1 volume at or below 150 mm^3 is below the FreeSurfer canonical output magnitude
        for this subfield (Iglesias 2015 ex vivo atlas; ENIGMA reference distributions, Saemann 2022)
        and indicates segmentation failure or a pipeline error. Research-grade biological-plausibility
        envelope, NOT a validated normative percentile.
