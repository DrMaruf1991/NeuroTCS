rangepack_id: mri_volumetrics/hippocampal_subfields_research_preview@1.0.0
pack_version: 1.0.0
effective_date: '2026-05-29'
status: research_preview
domain: structural_brain_mri_volumetry
framework_name: 'Hippocampal subfield volumetry (research_preview) - the 12 canonical FreeSurfer hippocampal-subfield-module
  subregions per hemisphere (Iglesias 2015 ex vivo atlas), with research-grade biological-plausibility
  envelopes. NOT at international_consensus normative standard: no consensus subfield normative database
  exists, segmentation changes materially across FreeSurfer versions (FS6 vs FS7), and several small subfields
  have low test-retest reliability (Saemann 2022). Ships research_preview pending cross-version harmonization.'
transcribed_by: 'Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29. Subfield set and atlas: Iglesias
  JE et al. NeuroImage 2015;115:117-137 (PMID 25936807, DOI 10.1016/j.neuroimage.2015.04.042), the FreeSurfer
  hippocampal-subfield module reference. Plausibility/reliability framework: Saemann PG, Iglesias JE et
  al. Human Brain Mapping 2022;43(1):207-233 (DOI 10.1002/hbm.25326), the ENIGMA hippocampal-subfields
  QC protocol. Envelope magnitudes informed by FreeSurfer canonical hippoSfVolumes output ranges.'
clinical_source_authority: |-
  This pack encodes research-grade biological-plausibility envelopes for the 12 canonical FreeSurfer hippocampal-subfield-module subregions per hemisphere. It is a rulebook the auditor checks externally-measured subfield values against; NeuroTCS never measures or segments subfields.

  Subfield set (Iglesias 2015 atlas, FreeSurfer hippoSfVolumes output): CA1, CA3 (includes CA2), CA4, subiculum, presubiculum, parasubiculum, molecular layer (HP), GC-ML-DG, HATA, fimbria, hippocampal fissure, hippocampal tail -- left and right (24 measurements).

  Why research_preview, not production:
   - No consensus subfield normative database exists (Bethlehem 2022 whole-hippocampus normative does not extend to subfields; no FDA-cleared subfield normative).
   - Iglesias 2015 segmentation changed materially between FreeSurfer 6 and 7; cross-version comparability is poor (still documented as of 2025).
   - Several small subfields (parasubiculum, fimbria, hippocampal fissure, HATA) have low test-retest reliability on T1-only data (Saemann 2022).
   - The hippocampal fissure is a CSF cleft, not hippocampal tissue.

  Consequence: audit_clinical_ranges() refuses to run a research_preview pack. These envelopes are loadable for experimentation and validation only, not production audit. Bounds are wide pipeline-error / biological-plausibility envelopes (citation_strength=derived), NOT validated normative percentiles.

  Companion: mri_volumetrics/structural_volumetry_consensus@1.0.0 (production) covers whole-hippocampus volume at international_consensus. The ENIGMA subfield ranking-violation rules (Saemann 2022: CA1 largest; tail not below rank 3; subiculum rank 4) are a cross-subfield ordering check not expressible in the current range-pack or cross_sheet invariant schema; they are tracked for a dedicated subfield-rank invariant type.
anchor_citation:
  citation_pmid: '25936807'
  citation_doi: 10.1016/j.neuroimage.2015.04.042
  citation_text: 'Iglesias JE, Augustinack JC, Nguyen K, Player CM, Player A, Wright M, Roy N, Frosch
    MP, McKee AC, Wald LL, Fischl B, Van Leemput K. A computational atlas of the hippocampal formation
    using ex vivo, ultra-high resolution MRI: Application to adaptive segmentation of in vivo MRI. NeuroImage.
    2015 Jul 15;115:117-137 (PMID 25936807, DOI 10.1016/j.neuroimage.2015.04.042). The reference ex vivo
    atlas (15 autopsy samples, ~0.13 mm isotropic, 13 manually segmented subregions) at the core of the
    FreeSurfer hippocampal-subfield module and the most cited hippocampal-subfield segmentation reference.'
  public_url: https://pubmed.ncbi.nlm.nih.gov/25936807/
  endorsing_bodies:
  - Iglesias 2015 ex vivo hippocampal atlas (FreeSurfer module)
  - ENIGMA Hippocampal Subfields Working Group
  - FreeSurfer canonical hippocampal-subfield pipeline
  - Saemann 2022 ENIGMA subfield QC protocol
notes: 'Bound derivation: hard_min = segmentation-failure floor; hard_max = biologically implausible ceiling.
  Envelopes are deliberately wide to accommodate FreeSurfer-version and age/sex variation; they detect
  gross pipeline errors, not normal-range deviation. Low-reliability subfields (parasubiculum, fimbria,
  hippocampal fissure, HATA) carry wider envelopes and an explicit reliability caveat per Saemann 2022.
  This pack asserts nothing about normative percentiles and must not be promoted to production until a
  consensus, version-harmonized subfield normative is published.'
