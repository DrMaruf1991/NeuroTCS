      - bound_type: "hard_min"
        value: 2.0
        citation_strength: "international_consensus"
        guideline_section: "Potvin 2017 cortical normative + Bethlehem 2022 GMV proxy"
        citation:
          citation_pmid: "28412442"
          citation_doi: "10.1016/j.neuroimage.2017.04.035"
          citation_text: |
            Potvin O et al. (NeuroImage 2017) cortical normative data
            n=2,713 healthy adults 18-94: mean cortical thickness <2.0 mm
            is below the biologic floor and indicates severe atrophy or
            segmentation error. Bethlehem 2022 GMV centile reference
            cross-validates.
          public_url: "https://www.sciencedirect.com/science/article/abs/pii/S1053811917303269"
          endorsing_bodies:
