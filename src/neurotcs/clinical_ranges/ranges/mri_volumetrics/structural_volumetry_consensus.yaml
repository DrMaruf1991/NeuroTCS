  # ====================================================================
  # QUALITY CONTROL (ENIGMA Consortium QC protocol verbatim)
  # ====================================================================

  - name: "euler_number_left_hemisphere"
    unit: "count"
    description: |
      Euler number (Dale 1999) of left hemisphere cortical surface
      reconstruction from FreeSurfer recon-all. Topological complexity
      measure that correlates with movement artifacts. ENIGMA exclusion
      threshold per Rosen 2018 / ENIGMA Cortical QC 2.0: Euler <= -217.
    bounds:
      - bound_type: "hard_min"
        value: -300.0
        citation_strength: "international_consensus"
        guideline_section: "ENIGMA Cortical QC 2.0 + Rosen 2018 Euler exclusion threshold"
        citation:
          citation_pmid: "29278793"
          citation_doi: "10.1016/j.neuroimage.2017.12.059"
          citation_text: |
            ENIGMA Consortium FreeSurfer Cortical QC Protocol 2.0
            (April 2017) + Rosen AFG et al. (NeuroImage 2018) verbatim:
            Euler numbers more negative than -217 indicate severe surface
            reconstruction errors and are excluded from cortical analyses.
            Hard floor of -300 captures the rare but possible extreme
            failure case.
          public_url: "https://enigma.ini.usc.edu/wp-content/uploads/2010/05/ENIGMA_Cortical_QC_2.0.pdf"
          endorsing_bodies:
            - "ENIGMA Consortium FreeSurfer protocol"
            - "Rosen 2018 (Euler number QC, PMID 29278793)"
            - "Dale 1999 (Euler number definition, FreeSurfer canonical)"
            - "FreeSurfer canonical pipeline (Martinos Center)"
            - "ENIGMA Cortical QC 2.0 (April 2017)"
            - "Maastricht Study QC strategy (PMC8013293)"
            - "ADNI"

      - bound_type: "plausible_min"
        value: -217.0
        citation_strength: "international_consensus"
        guideline_section: "Rosen 2018 ENIGMA exclusion cutoff verbatim"
        citation:
          citation_pmid: "29278793"
          citation_doi: "10.1016/j.neuroimage.2017.12.059"
          citation_text: |
            Rosen AFG et al. (NeuroImage 2018) verbatim: Euler number <=
            -217 correlates with movement-artifact-induced surface
            reconstruction errors and is the standard ENIGMA exclusion
            cutoff for FreeSurfer cortical analyses.
          public_url: "https://enigma.ini.usc.edu/wp-content/uploads/2010/05/ENIGMA_Cortical_QC_2.0.pdf"
          endorsing_bodies:
            - "Rosen 2018 (PMID 29278793)"
            - "ENIGMA Consortium FreeSurfer protocol"
            - "ENIGMA Cortical QC 2.0"
            - "FreeSurfer canonical pipeline"
            - "Dale 1999 (Euler number)"
            - "Maastricht Study QC strategy (PMC8013293)"
            - "ADNI"

      - bound_type: "plausible_max"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "FreeSurfer Euler convention: 0 = topologically correct"
        citation:
          citation_pmid: "29278793"
          citation_doi: "10.1016/j.neuroimage.2017.12.059"
          citation_text: |
            FreeSurfer's Euler number convention reports topology errors
            as negative integers; 0 represents a topologically correct
            (defect-free) surface. Values >0 do not occur in standard
            FreeSurfer recon-all output.
          public_url: "https://enigma.ini.usc.edu/wp-content/uploads/2010/05/ENIGMA_Cortical_QC_2.0.pdf"
          endorsing_bodies:
            - "FreeSurfer canonical pipeline (Martinos Center)"
            - "Dale 1999 (Euler number)"
            - "ENIGMA Consortium"
            - "Rosen 2018"
            - "ENIGMA Cortical QC 2.0"
            - "Maastricht Study QC strategy"

      - bound_type: "hard_max"
        value: 0.0
        citation_strength: "international_consensus"
        guideline_section: "FreeSurfer Euler convention: 0 ceiling"
        citation:
          citation_pmid: "29278793"
          citation_doi: "10.1016/j.neuroimage.2017.12.059"
          citation_text: |
            Same as plausible_max. Euler number >0 in FreeSurfer recon-all
            output is anomalous and indicates pipeline error.
          public_url: "https://enigma.ini.usc.edu/wp-content/uploads/2010/05/ENIGMA_Cortical_QC_2.0.pdf"
          endorsing_bodies:
            - "FreeSurfer canonical pipeline"
            - "Dale 1999"
            - "ENIGMA Consortium"
            - "Rosen 2018"
            - "ENIGMA Cortical QC 2.0"
            - "ADNI"

