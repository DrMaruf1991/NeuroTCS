  - name: "thalamus_volume_left_mm3"
    unit: "mm^3"
    description: "Left thalamus proper volume in mm^3 (FreeSurfer aseg.stats Left-Thalamus-Proper)."
    bounds:
      - bound_type: "hard_min"
        value: 4000.0
        citation_strength: "derived"
        guideline_section: "FreeSurfer aseg.stats canonical output range + Potvin 2016 subcortical normative"
        citation:
          citation_pmid: "16530430"
          citation_doi: "10.1016/j.neuroimage.2006.01.021"
          citation_text: |
            FreeSurfer canonical pipeline output range for adult left
            thalamus (~5000-10000 mm^3) per Potvin 2016 subcortical
            normative reference. Below 4000 mm^3 indicates severe atrophy
            or segmentation failure.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/16530430/"
          endorsing_bodies:
            - "Desikan-Killiany Atlas"
            - "FreeSurfer canonical pipeline"
            - "Potvin Normative Working Group"
            - "ADNI"
            - "ENIGMA Consortium"

      - bound_type: "hard_max"
        value: 12000.0
        citation_strength: "derived"
        guideline_section: "FreeSurfer aseg.stats upper biologic bound"
        citation:
          citation_pmid: "16530430"
          citation_doi: "10.1016/j.neuroimage.2006.01.021"
          citation_text: |
            Adult left thalamus volume >12000 mm^3 is biologically
            implausible per Potvin 2016 + FreeSurfer canonical output.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/16530430/"
          endorsing_bodies:
            - "Desikan-Killiany Atlas"
            - "FreeSurfer canonical pipeline"
            - "Potvin Normative Working Group"
            - "ADNI"
            - "ENIGMA Consortium"

