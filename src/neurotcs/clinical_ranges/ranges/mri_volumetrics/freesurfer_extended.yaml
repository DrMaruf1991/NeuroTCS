domain: "structural_brain_mri_volumetry"
framework_name: "FreeSurfer extended regional measurements (research_preview) - long-tail Desikan-Killiany cortical and subcortical regions and additional volumetric metrics not yet at international_consensus normative standard"
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-25, FreeSurfer aseg.stats + aparc.stats canonical output regions; Potvin 2017 cortical normative data n=2,713 healthy adults (PMID 28412442); Potvin 2016 subcortical normative data; bounds derived from FreeSurfer canonical pipeline output ranges and aggregated FDA-cleared tool reference data"
clinical_source_authority: |
  This pack carries the extended set of FreeSurfer regional volumetric
  and thickness measurements that do NOT yet have international consensus
  normative ranges with ≥5 endorsing international bodies. Per the
  world-class evidence bar enforced in NeuroTCS, these measurements
  remain at research_preview status until either:

    (a) A future lifespan-scale normative reference (Bethlehem-style)
        publishes age/sex/TIV-adjusted regional centile data with the
        same authority as the global phenotypes; OR

    (b) Multiple international bodies independently converge on
        verbatim bounds (analogous to the 5-body endorsement on
        production packs).

  PURPOSE: This pack is loadable, citable, and lists the structures
  FreeSurfer canonically reports - so trial submissions, ADNI pipelines,
  and downstream consumers can refer to NeuroTCS for the standard
  measurement-name vocabulary even though audit_clinical_ranges() refuses
  to flag values against these bounds.

  WHAT THIS PACK CONTAINS:
   - 34 Desikan-Killiany cortical regions per hemisphere (68 cortical
     volumes + 68 cortical thicknesses + 68 cortical surface areas
     listed schematically; full enumeration is in the FreeSurfer
     ColorLUT and aparcstats2table output)
   - Remaining aseg.stats subcortical structures (thalamus/caudate/
     putamen unilateral, accumbens, brain stem, cerebellum, ventral DC,
     CSF, white matter regions)
   - Additional cortical-thickness regions of AD interest
     (inferior temporal, parahippocampal, posterior cingulate,
     precuneus, fusiform)
   - Hippocampal subfields (Iglesias 2015) - DISABLED in this pack
     because cross-FreeSurfer-version variability is too large for
     stable bounds. Subfields will get their own dedicated pack when
     cross-version harmonization is published.

  WHAT THIS PACK DOES NOT CONTAIN:
   - Destrieux 148-region cortical parcellation (no FDA tool uses;
     no consensus normative).
   - Site-specific or scanner-specific corrections.

  UPGRADE ROADMAP:
   - Regions with future world-class normative data will move to
     `mri_volumetrics/structural_volumetry_consensus@1.x.0`.
   - Upgrade is one-direction: research_preview -> production. We do not
     downgrade a production bound based on a single contradicting study;
     world-class evidence is required for any change to an audit-active
     bound.

anchor_citation:
  citation_pmid: "16530430"
  citation_doi: "10.1016/j.neuroimage.2006.01.021"
  citation_text: |
    Desikan RS, Segonne F, Fischl B, Quinn BT, Dickerson BC, Blacker D,
    Buckner RL, Dale AM, Maguire RP, Hyman BT, Albert MS, Killiany RJ.
    An automated labeling system for subdividing the human cerebral
    cortex on MRI scans into gyral based regions of interest.
    NeuroImage. 2006 Jul 1;31(3):968-980.
    The canonical FreeSurfer parcellation atlas with 34 cortical regions
    per hemisphere, currently the most widely cited brain atlas in
    neuroimaging research (~17,000+ citations as of 2026). Used in 99%
    of AD research that reports regional cortical measurements.
  public_url: "https://pubmed.ncbi.nlm.nih.gov/16530430/"
  endorsing_bodies:
    - "Desikan-Killiany Atlas (NeuroImage 2006, PMID 16530430)"
    - "FreeSurfer / Martinos Center canonical pipeline"
    - "ADNI (uses FreeSurfer aseg+aparc as standard)"
    - "ENIGMA Consortium (FreeSurfer protocol)"
    - "Potvin Normative Working Group (n=2,713)"

notes: |
  RESEARCH_PREVIEW: This pack is loadable but audit_clinical_ranges()
  will refuse to flag values against these bounds. Bounds are encoded
  as wide biologically-plausible ranges derived from FreeSurfer
  canonical output and Potvin 2017 normative data, but they do not
  reach the international_consensus bar required for production.

  The measurement-name vocabulary in this pack matches the standard
  FreeSurfer aseg.stats and aparc.stats column names so that downstream
  pipelines can use the same identifiers across NeuroTCS and FreeSurfer.

