          citation_text: |
            Bakkour 2009 (Neurology PMID 19261208) showed inferior temporal
            thinning is part of the early AD cortical signature; Potvin
            2017 reference floors thickness below 1.8 mm as severe atrophy.
          public_url: "https://pubmed.ncbi.nlm.nih.gov/19261208/"
          endorsing_bodies:
