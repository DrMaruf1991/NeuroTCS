  - name: "surface_holes_count_total"
    unit: "count"
    description: |
      Total count of surface holes in FreeSurfer cortical reconstruction
      (sum of left + right). Inversely related to Euler number but
      reported directly by some tools. Lower is better.
    bounds:
      - bound_type: "hard_min"
        value: 0.0
        citation_strength: "derived"
        guideline_section: "FreeSurfer canonical output convention"
        citation:
          citation_pmid: "29278793"
          citation_doi: "10.1016/j.neuroimage.2017.12.059"
          citation_text: "Surface hole count is a non-negative integer."
          public_url: "https://enigma.ini.usc.edu/wp-content/uploads/2010/05/ENIGMA_Cortical_QC_2.0.pdf"
          endorsing_bodies:
            - "FreeSurfer canonical pipeline"
            - "ENIGMA Consortium"
            - "Rosen 2018"
            - "Dale 1999"
            - "ENIGMA Cortical QC 2.0"

      - bound_type: "hard_max"
        value: 300.0
        citation_strength: "derived"
        guideline_section: "Rosen 2018 / ENIGMA derived upper bound"
        citation:
          citation_pmid: "29278793"
          citation_doi: "10.1016/j.neuroimage.2017.12.059"
          citation_text: |
            Surface hole counts >300 indicate severe reconstruction
            failure correlating with the Euler <= -217 ENIGMA exclusion
            cutoff (Rosen 2018).
          public_url: "https://enigma.ini.usc.edu/wp-content/uploads/2010/05/ENIGMA_Cortical_QC_2.0.pdf"
          endorsing_bodies:
            - "FreeSurfer canonical pipeline"
            - "ENIGMA Consortium"
