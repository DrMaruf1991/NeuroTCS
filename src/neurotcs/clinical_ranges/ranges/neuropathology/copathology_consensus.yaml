notes: Defined consensus scale ranges/categories; values outside them are coding/data errors. NeuroTCS
  audits neuropathologist-assigned co-pathology values only. Co-pathology (TDP-43/LATE-NC, Lewy) occurs
  in a majority of autopsy-confirmed AD and is a major cognitive-trajectory modifier.
