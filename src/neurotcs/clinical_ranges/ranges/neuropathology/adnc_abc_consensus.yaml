measurements:
- name: thal_amyloid_phase
  unit: stage
  description: Thal amyloid-beta deposition phase (NIA-AA 'A' score), the gold-standard autopsy measure
    of Abeta plaque distribution. Integer 0-5 (Thal DR et al. Neurology 2002).
  measurement_kind: numeric
  bounds:
  - bound_type: hard_min
    value: 0.0
    citation_strength: international_consensus
    guideline_section: NIA-AA 2012 ABC score, 'A' = Thal amyloid phase (Hyman/Montine 2012; Thal 2002)
      (lower bound of the defined ordinal scale)
    citation:
      citation_text: Thal amyloid phase is a 0-5 ordinal scale (Thal DR et al. Neurology 2002), adopted
        as the NIA-AA 'A' score (Hyman/Montine 2012). The scale is defined from 0; values below 0 are
        impossible (data/coding error).
      public_url: https://doi.org/10.1016/j.jalz.2011.10.007
      endorsing_bodies:
      - National Institute on Aging (NIA)
      - Alzheimer's Association
      - NIA-AA Neuropathology Consensus Panel (Hyman/Montine 2012)
      - National Alzheimer's Coordinating Center (NACC) UDS Neuropathology
      - Consortium to Establish a Registry for Alzheimer's Disease (CERAD)
      - BrainNet Europe Consortium
      citation_pmid: '22265587'
      citation_doi: 10.1016/j.jalz.2011.10.007
  - bound_type: hard_max
    value: 5.0
    citation_strength: international_consensus
    guideline_section: NIA-AA 2012 ABC score, 'A' = Thal amyloid phase (Hyman/Montine 2012; Thal 2002)
      (upper bound of the defined ordinal scale)
    citation:
