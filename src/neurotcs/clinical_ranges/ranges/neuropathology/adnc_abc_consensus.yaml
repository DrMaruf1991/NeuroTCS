- name: adnc_level
  unit: category
  description: 'Integrated level of Alzheimer''s disease neuropathologic change (ADNC) from the ABC score:
    none/low/intermediate/high (Hyman/Montine 2012). Intermediate or high ADNC is considered sufficient
    to explain dementia.'
  measurement_kind: categorical_set
  valid_values:
  - none
  - low
  - intermediate
  - high
  bounds:
  - bound_type: hard_min
    value: 0.0
    citation_strength: international_consensus
    guideline_section: NIA-AA 2012 integrated ADNC level (Hyman/Montine 2012, Table mapping A x B x C)
      (categorical set; values outside valid_values are coding errors)
    citation:
      citation_text: 'ADNC level is the integrated ABC determination defined by NIA-AA 2012 (Hyman/Montine
        2012) as one of none, low, intermediate, high. Valid categories: none, low, intermediate, high.
        Any other value is a coding/data error.'
      public_url: https://doi.org/10.1016/j.jalz.2011.10.007
      endorsing_bodies:
