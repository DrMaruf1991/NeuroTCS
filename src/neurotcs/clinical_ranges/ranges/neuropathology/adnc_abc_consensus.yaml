effective_date: '2026-05-29'
status: production
domain: neuropathology
framework_name: 'Alzheimer''s disease neuropathologic change (ADNC) - NIA-AA 2012 ''ABC'' score: Thal
  amyloid phase (A), CERAD neuritic plaque score (C), Braak NFT stage (B), and the integrated ADNC level.
  The autopsy gold standard that biological AD staging (AA-2024) is grounded in. Ordinal/categorical consensus
  scales; bounds are the defined scale ranges, not derived thresholds.'
transcribed_by: Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29. Verbatim scale ranges from Hyman
  BT et al. Alzheimer's & Dementia 2012;8(1):1-13 (PMID 22265587, DOI 10.1016/j.jalz.2011.10.007) and
  Montine TJ et al. Acta Neuropathol 2012;123:1-11, which integrate Thal DR et al. Neurology 2002 (amyloid
  phase 0-5), Braak & Braak Acta Neuropathol 1991 (NFT stage 0-VI), and Mirra SS et al. Neurology 1991
  CERAD (neuritic plaque score 0-3) into the ABC/ADNC framework.
clinical_source_authority: |-
  This pack encodes the NIA-AA 2012 'ABC' neuropathologic scoring and the integrated ADNC level. NeuroTCS does not perform neuropathologic assessment; it audits autopsy-derived staging values that a neuropathologist assigned, against the defined consensus scale ranges.

  Measurements (NIA-AA 2012; Hyman/Montine 2012):
   - thal_amyloid_phase (A): 0-5 (Thal DR et al. Neurology 2002).
   - cerad_neuritic_plaque_score (C): 0-3 = none/sparse/moderate/frequent (Mirra SS et al. CERAD, Neurology 1991).
   - braak_nft_stage (B): 0-VI i.e. 0-6 (Braak & Braak, Acta Neuropathol 1991; Braak 2006).
   - adnc_level: none/low/intermediate/high (the integrated ABC determination, Hyman/Montine 2012).

  Bounds are the DEFINED ordinal/categorical ranges of consensus staging instruments, not derived numeric thresholds; a value outside the defined range is a coding or data-entry error. Domain anchor: Hyman BT et al. 2012 (NIA-AA neuropathologic assessment guidelines).
