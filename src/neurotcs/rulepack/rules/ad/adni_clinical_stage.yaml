notes: >-
  ADNI clinical-stage instantiation. Recognizes the full ADNI IDA Research
  Group vocabulary (CN/SMC/EMCI/LMCI/MCI/AD). EMCI/LMCI are SEVERITY STRATA
  (LM-II memory-score bins), not obligatory sequential stages -- severity skips
  and reversion are admissible; only single-step reversion OUT of AD dementia is
  inadmissible. APOE4 / mutation / Down-syndrome are fixed attributes audited by
  the data_integrity layer, NOT staged here; biomarker A/T(N) states are staged
  by the at_biological / atn_2018 packs. Coexists with ad/niaaa_2018: the
  vocabulary selector routes [CN,MCI,AD] data to niaaa_2018 and
  [CN,SMC,EMCI,LMCI,MCI,AD] data here, by best vocabulary coverage.
