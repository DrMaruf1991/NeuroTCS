transition_priors:

  - from_state: "EMCI"
    to_state: "AD"
    annual_probability: 0.023
    confidence_interval_95: [0.015, 0.04]
    prior_type: "clinical"
    citation:
      citation_pmid: null
      citation_doi: "10.3389/fneur.2022.685636"
      citation_text: >-
        ADNI reported annual conversion rate (ACR) to dementia of ~2.3% for
        EMCI (Clinical Course of EMCI/LMCI 2022, citing ADNI). Lower than LMCI
        because EMCI carries higher etiologic heterogeneity.

  - from_state: "LMCI"
    to_state: "AD"
    annual_probability: 0.175
    confidence_interval_95: [0.12, 0.24]
    prior_type: "clinical"
    citation:
      citation_pmid: null
      citation_doi: "10.3389/fneur.2022.685636"
      citation_text: >-
        ADNI reported annual conversion rate (ACR) to dementia of ~17.5% for
        LMCI (Clinical Course of EMCI/LMCI 2022, citing ADNI).

  - from_state: "EMCI"
    to_state: "CN"
    annual_probability: 0.16
    confidence_interval_95: [0.10, 0.25]
    prior_type: "clinical"
    citation:
      citation_pmid: null
      citation_doi: "10.3389/fneur.2022.685636"
      citation_text: >-
        ~31-33% of EMCI subjects showed normal cognitive status by year 2
        (annualized ~16%); EMCI reversion is substantially higher than LMCI.

  - from_state: "LMCI"
