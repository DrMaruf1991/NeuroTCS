# NeuroTCS Rule Pack: Alzheimer's Disease -- NIA-AA 2024 numeric CLINICAL staging
# (clinical/cognitive severity stages 0-6, Jack et al. 2024 Table 6)
# Schema: 1.4.0 | Status: PRODUCTION | NeuroTCS v1 instantiation
#
# WHY THIS PACK EXISTS
# --------------------
# The NIA-AA 2024 revised criteria (Jack et al. 2024) introduce a numeric
# clinical staging scheme (stages 0-6) for individuals on the AD continuum.
# Real datasets encoded against this standard carry clinical_stage as the
# integers 0..6, which no prior NeuroTCS clinical pack recognized (they key off
# the labeled CN/MCI/AD or CN/SMC/EMCI/LMCI/MCI/AD vocabularies). Such a cohort
# therefore failed the clinical axis with vocabulary_mismatch. This pack
# recognizes the NIA-AA 2024 numeric clinical scheme natively.
#
# STATE SPACE (verbatim-anchored to Jack 2024 Table 6, "Clinical staging for
# individuals on the Alzheimer's disease continuum"; PMID 38934362, DOI 10.1002/alz.13859):
#   0  Asymptomatic, deterministic gene (ADAD/DSAD), biomarker-negative.
#   1  Asymptomatic, biomarker evidence only (preclinical).
#   2  Transitional decline (subtle, still normal-range, independent).
#   3  Cognitive impairment with early functional impact (~MCI).
#   4  Dementia, mild functional impairment.
#   5  Dementia, moderate functional impairment.
#   6  Dementia, severe functional impairment.
# Jack 2024 notes the numeric stages 1-6 closely resemble the Global
# Deterioration Scale and the FDA early-AD trial staging; stage 2 is an explicit
# transitional stage. (Down syndrome caveat: individuals with DS may not be fully
# independent even at stage 0 due to baseline intellectual disability -- decline
# from the individual's own baseline is then the more appropriate indicator.)
#
# CRITICAL DESIGN DECISIONS (the part that prevents false flags)
# --------------------------------------------------------------
# 1. TRANSITION ADMISSIBILITY, NOT A STRICT MONOTONIC RULE. Jack 2024 specifies
#    the state space and the expected forward direction (1->2->3->4-6 along the
#    integrated diagonal) but does NOT declare every backward step an error.
#    Pre-dementia reversion is real (e.g. documented MCI->normal reversion), so
#    reversion WITHIN the pre-dementia range (stages 0-3) is ADMISSIBLE and is
#    never flagged. Encoding a strict monotonic 0->6 rule would manufacture false
#    flags on valid reversions.
# 2. INADMISSIBLE = REGRESSION OUT OF DEMENTIA. A transition FROM a dementia
#    stage (4, 5, or 6) to any strictly lower stage is inadmissible: established
#    AD dementia is not expected to revert to a milder stage or to normal under
#    standard natural history. This mirrors the AD->MCI / AD->CN inadmissibility
#    in ad/niaaa_2018 and ad/adni_clinical_stage, expressed on the numeric axis.
# 3. NO RATE LOGIC. This pack carries NO fast-progression / stages-per-interval
#    rule. Jack 2024 gives no numeric floor on time-to-advance, so any such
#    cutpoint would be an invented threshold. Biological-axis rate/ordering
#    concerns belong to the biological staging path, not this clinical pack.
# 4. CLINICAL AXIS ONLY. Biological A/T/N staging (and any TRAC treatment-
#    clearance carve-out) is a SEPARATE axis (at_biological / atn_2018 / TRAC),
#    with different rules; it is deliberately not conflated here.

