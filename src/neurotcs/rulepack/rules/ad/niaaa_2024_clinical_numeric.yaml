inadmissible_transitions:
  - from_state: "4"
    to_state: "0"
    reason: >-
      Regression OUT of dementia: a transition from clinical stage 4 (dementia) to a strictly milder stage 0 is not an expected course of established AD dementia under standard natural history, and indicates misclassification or model instability.
    citation:
      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: >-
        Jack 2024 Table 6: stages 4-6 denote dementia of increasing functional severity; established dementia is not expected to revert to a milder clinical stage.
    guideline_section: "Jack 2024 Table 6 (dementia stages 4-6)"
