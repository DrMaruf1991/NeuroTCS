state_space:
  - name: "0"
    description: >-
      Asymptomatic, deterministic gene. Genetically determined AD (ADAD/DSAD) in a biomarker-negative, clinically asymptomatic individual.
    ordinal_rank: 0
  - name: "1"
    description: >-
      Asymptomatic, biomarker evidence only (preclinical AD). Cognition within expected range, no decline from baseline.
    ordinal_rank: 1
  - name: "2"
    description: >-
      Transitional decline. Subtle objective and/or subjective cognitive decline or neurobehavioral change from baseline, still within normal range and fully functionally independent.
    ordinal_rank: 2
  - name: "3"
    description: >-
      Cognitive impairment with early functional impact. Performance in the impaired range; independent but complex (instrumental) activities take measurably more effort. Resembles MCI.
    ordinal_rank: 3
  - name: "4"
    description: >-
      Dementia, mild functional impairment. Instrumental activities of daily living affected; still independent in basic ADLs.
    ordinal_rank: 4
  - name: "5"
    description: >-
      Dementia, moderate functional impairment. Basic activities of daily living require assistance.
    ordinal_rank: 5
  - name: "6"
    description: >-
      Dementia, severe functional impairment. Complete dependence for basic activities of daily living.
    ordinal_rank: 6

