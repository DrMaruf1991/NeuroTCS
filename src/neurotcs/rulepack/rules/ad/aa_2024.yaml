- from_state: Stage_1A
  to_state: Stage_0
  reason: 'Jack 2024 §5.2 (verbatim): "Stage 0 represents part of the AD continuum
    and is defined as genetically determined AD (which includes ADAD or DSAD) in an
    individual who is biomarker negative and clinically asymptomatic." Once a Core
    1 biomarker is positive, the subject cannot return to biomarker-negative Stage
    0. NOTE: Anti-amyloid treatment can render amyloid PET subdetection (§9 TRAC),
    but Jack 2024 §9: "The underlying AD pathophysiologic process is therefore still
    active in an individual who has had fibrillar amyloid removed to below PET detection
    levels." TRAC subjects do NOT return to Stage 0.'
