  - from_state: "Stage_0"
    to_state: "Stage_1"
    citation:
      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: "Jack 2024 AA: biological onset (A+) from biomarker-negative."
    guideline_section: "Jack 2024 §3 'Integrated biological-clinical staging', Table 6"
    override_allowed: false

