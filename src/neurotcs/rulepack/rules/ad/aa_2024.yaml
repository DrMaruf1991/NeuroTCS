      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: "Jack 2024 §3: biological staging is monotone."
    guideline_section: "Jack 2024 §3"

  - from_state: "Stage_3"
    to_state: "Stage_2"
    reason: "Monotone biological staging."
    citation:
