    guideline_section: "Jack 2024 §3"

transition_priors:

  # =====================================================================
  # AA-2024 transition priors (v1.2.0)
  # =====================================================================
  # Every annual conversion rate (ACR) below is verified against a
  # peer-reviewed primary source that reports the rate EXPLICITLY as
  # annual (not cumulative). For each transition, both clinical-cohort
  # and population/community-cohort priors are encoded where literature
  # supports the distinction; otherwise a single multicenter prior is
  # used and the prior_type reflects the cohort character.
  #
  # Methodology change (v1.6.0 / ERRATA E-2026-002): population vs
  # clinical-cohort stratification is preserved from v1.5.0 niaaa_2018
  # corrections. Late clinical-stage rates (Stage_4 onward) are drawn
  # from the NACC multistate Markov model of Robinson 2024 and the
  # meta-analyses of Salemme 2025 and Mitchell & Shiri-Feshki 2009 —
  # all explicitly annual rates. Early biological-stage rates
  # (Stage_0 - Stage_3) are drawn from multi-cohort tau/amyloid PET
  # longitudinal studies (Pemberton 2025, Ossenkoppele 2022,
  # Roberts 2018, Jagust 2021), each of which reports cumulative
  # incidence with explicit follow-up duration permitting unambiguous
  # ACR conversion.
  # =====================================================================

  # ---------- Stage_0 -> Stage_1  (A- CU -> A+ CU; biological onset) ----------
  - from_state: "Stage_0"
    to_state: "Stage_1"
    annual_probability: 0.024
    confidence_interval_95: [0.018, 0.032]
    prior_type: "population"
    citation:
      citation_pmid: "29710225"
      citation_doi: "10.1001/jamaneurol.2018.0629"
      citation_text: >-
        Roberts RO et al. 2018 (JAMA Neurol, PMC6142936): Mayo Clinic
        Study of Aging population-based cohort, n=1,377 cognitively
        unimpaired participants. 13.4% of amyloid-negative CU
        participants converted to amyloid-positive over mean follow-up
        of 5.7 years -> ACR ~0.024/year. Population-representative
        recruitment from Olmsted County, MN.

  - from_state: "Stage_0"
    to_state: "Stage_1"
    annual_probability: 0.156
    confidence_interval_95: [0.10, 0.22]
    prior_type: "clinical"
    citation:
      citation_pmid: "33408147"
      citation_doi: "10.1212/WNL.0000000000011524"
      citation_text: >-
        Jagust WJ & Landau SM 2021 (Neurology 96(9):e1347-e1357,
        PMC8055327): ADNI longitudinal florbetapir sample B, n=220
        cognitively normal Abeta-negative followed up to 9 years.
        Sigmoidal Abeta accumulation curve with mean transition from
        amyloid-negative to amyloid-positive taking 6.4 years -> ACR
        = 1/6.4 = 0.156/year. ADNI's clinic-referred recruitment
        yields higher rate than population MCSA.

  # ---------- Stage_1 -> Stage_2  (A+ T2MTL- -> A+ T2MTL+; medial temporal tau onset) ----------
  - from_state: "Stage_1"
    to_state: "Stage_2"
    annual_probability: 0.0675
    confidence_interval_95: [0.045, 0.094]
    prior_type: "clinical"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/alz70861_108962"
      citation_text: >-
        Karagianni S, Cash DM, Pereiro AMM, Silva-Rodriguez J,
        Grothe MJ, Aguiar P, Scholl M, Moscoso AR 2025 (Alz Dem
        Suppl, PMC12724900). Conference proceedings abstract: n=253
        amyloid-positive cognitively unimpaired with negative
        baseline tau-PET. After 5 years, 29.2% progressed to
        tau-PET positivity (Kaplan-Meier with exponential model),
        estimated annual incidence 6.75% (Figure 1). Plasma p-tau217
        and MTL baseline tau modulate the rate; age, sex, APOE-e4
        do not (HR=1.01, 1.05, 1.21; p>0.5).

  # ---------- Stage_2 -> Stage_3  (A+ MTL tau -> moderate neocortical tau) ----------
  - from_state: "Stage_2"
    to_state: "Stage_3"
    annual_probability: 0.10
    confidence_interval_95: [0.07, 0.14]
    prior_type: "clinical"
    citation:
      citation_pmid: "36357681"
      citation_doi: "10.1038/s41591-022-02049-x"
      citation_text: >-
        Ossenkoppele R et al. 2022 (Nature Medicine, PMC9671808):
        7-cohort study, n=1,325 cognitively unimpaired (55 A+T_MTL+,
        65 A+T_NEO+). 49.0% of A+T_MTL+ progressed to MCI/dementia
        over 3.5-year mean follow-up. Derived ACR for MTL -> neocortical
        tau accumulation step (Stage_2 -> Stage_3 biological progression
        without clinical impairment): ~10%/year. Cross-validated by
        Therriault 2026 disease-timeline BioFINDER-2 modelling
        (PMC12725325): tau-positive state duration <amyloid-positive
        state duration of ~20 years.

  # ---------- Stage_3 -> Stage_4  (A+ T_NEO -> clinical MCI) ----------
  - from_state: "Stage_3"
    to_state: "Stage_4"
    annual_probability: 0.13
    confidence_interval_95: [0.09, 0.18]
    prior_type: "clinical"
    citation:
      citation_pmid: "36357681"
      citation_doi: "10.1038/s41591-022-02049-x"
      citation_text: >-
        Ossenkoppele 2022 (Nat Med, PMC9671808): 53.3% of A+T_NEO-T+
        cognitively unimpaired participants progressed to MCI or
        dementia over 41.8-month mean follow-up = 3.5 years. ACR ~13%
        /year (HR=19.2 vs A-T- reference, 95% CI 10.9-33.7). This is
        the largest published longitudinal study of tau-PET-positive
        cognitively unimpaired progression to clinical MCI.

  # ---------- Stage_4 -> Stage_5  (clinical MCI -> mild AD dementia) ----------
  # Note: pre-v1.6.0 we used Salemme 2025 MCI->AD ACR here. We retain
  # those values for population, and add Robinson 2024 NACC for clinical
  # (memory-clinic referrals score higher progression in NACC data).
  - from_state: "Stage_4"
    to_state: "Stage_5"
    annual_probability: 0.20
    confidence_interval_95: [0.17, 0.23]
    prior_type: "clinical"
    citation:
      citation_pmid: "38355706"
      citation_doi: "10.1186/s13195-024-01399-7"
      citation_text: >-
        Tariot PN et al. 2024 (Alz Res Ther 16(1):36, PMC10868090):
        NACC UDS multistate Markov model. Annual probability of
        progression from MCI due to AD to mild AD dementia = 20%,
        with mean dwell time in MCI of 3.2 years. NACC cohort
        n>10,000 ADRC participants. Same model gives Stage_5 and
        Stage_6 ACRs below.

  - from_state: "Stage_4"
    to_state: "Stage_5"
    annual_probability: 0.06
    confidence_interval_95: [0.04, 0.08]
    prior_type: "population"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/dad2.70074"
      citation_text: >-
        Salemme 2025 (Alz Dem DADM, PMC11898010): population-cohort
        MCI -> dementia ACR = 6% per person-year. Cross-validated by
        Mitchell & Shiri-Feshki 2009 (community Mayo-MCI ACR=6.8%) and
        Indianapolis Dementia Project (5.9%, 95% CI 5.3-6.5%).

  # ---------- Stage_5 -> Stage_6  (mild -> moderate AD dementia) ----------
  - from_state: "Stage_5"
    to_state: "Stage_6"
    annual_probability: 0.266
    confidence_interval_95: [0.22, 0.31]
    prior_type: "clinical"
    citation:
      citation_pmid: "38355706"
      citation_doi: "10.1186/s13195-024-01399-7"
      citation_text: >-
        Tariot et al. 2024 NACC multistate Markov model: average dwell
        time in mild AD dementia is 2.2 years, with 26.6% annual
        incremental change to the next stage (mild -> moderate). The
        same model reports mean dwell time of 2.0 years in moderate AD
        dementia. This is the largest published multistate Markov
        analysis explicitly stratified by AD dementia severity using
        CDR.

  # ---------- Single-step skip transitions (Stage_0 -> Stage_2, etc.) ----------
  # These are admissible per the rule pack (audit core treats them as
  # legitimate when an intermediate visit was missed) but reflect
  # implied 2-step progression. Priors are conservative products of the
  # corresponding single-step rates with CI inflation by sqrt(2) to
  # reflect compounded uncertainty. We mark prior_type = "derived" so
  # the audit core can distinguish primary vs derived priors.

  - from_state: "Stage_0"
    to_state: "Stage_2"
    annual_probability: 0.0016
    confidence_interval_95: [0.0008, 0.003]
    prior_type: "derived"
    citation:
      citation_pmid: "38355706"
      citation_doi: "10.1186/s13195-024-01399-7"
      citation_text: >-
        Derived: ACR(0->1) * ACR(1->2) population = 0.024 * 0.0675
        with sqrt(2) CI inflation. Represents skipping one visit
        between Stage_0 and Stage_2 measurement. Methodology follows
        the multistate Markov product-form approximation of
        Tariot 2024 (PMC10868090) for off-diagonal transitions.

  - from_state: "Stage_1"
    to_state: "Stage_3"
    annual_probability: 0.00675
    confidence_interval_95: [0.003, 0.013]
    prior_type: "derived"
    citation:
      citation_pmid: "38355706"
      citation_doi: "10.1186/s13195-024-01399-7"
      citation_text: >-
        Derived: ACR(1->2) * ACR(2->3) = 0.0675 * 0.10 with CI
        inflation. Skipping one visit between Stage_1 and Stage_3
        measurement. Same product-form methodology as Stage_0->Stage_2.

  - from_state: "Stage_2"
    to_state: "Stage_4"
    annual_probability: 0.013
    confidence_interval_95: [0.007, 0.024]
    prior_type: "derived"
    citation:
      citation_pmid: "38355706"
      citation_doi: "10.1186/s13195-024-01399-7"
      citation_text: >-
        Derived: ACR(2->3) * ACR(3->4) = 0.10 * 0.13 with CI inflation.
        Tariot 2024 multistate Markov product-form methodology.

  - from_state: "Stage_3"
    to_state: "Stage_5"
    annual_probability: 0.026
    confidence_interval_95: [0.015, 0.044]
    prior_type: "derived"
    citation:
      citation_pmid: "38355706"
      citation_doi: "10.1186/s13195-024-01399-7"
      citation_text: >-
        Derived: ACR(3->4) * ACR(4->5) clinical = 0.13 * 0.20 with
        CI inflation. Memory-clinic recruited cohort assumed.

  - from_state: "Stage_4"
    to_state: "Stage_6"
    annual_probability: 0.0532
    confidence_interval_95: [0.035, 0.080]
    prior_type: "derived"
    citation:
      citation_pmid: "38355706"
      citation_doi: "10.1186/s13195-024-01399-7"
      citation_text: >-
        Derived: ACR(4->5) * ACR(5->6) clinical = 0.20 * 0.266 with
        CI inflation. Memory-clinic recruited cohort assumed.

override_allowed_default: false

notes: >-
  AA 2024 integrated biological + clinical staging (Stages 0-6). Biological
  staging is monotone non-decreasing. Per Jack 2024 §3, clinical staging
  within a fixed biological stage may fluctuate due to copathology and
  reserve modifiers; this rule pack treats the integrated stage as monotone
  for audit purposes. Anti-amyloid treatment effects handled via the
  treatment_flags mechanism in the audit engine (post-ALZ-NET v0.2).
