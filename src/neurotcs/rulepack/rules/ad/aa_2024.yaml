clinical_source_authority: Revised criteria for diagnosis and staging of Alzheimer's
  disease (Jack CR Jr et al., Alzheimer's & Dementia 2024;20(8):5143-5169, DOI 10.1002/alz.13859,
  PMID 38934362) - Alzheimer's Association Workgroup. Section §4 Biological staging
  defines Tables 3, 4, 5 (PET-based and conceptual fluid). Section §5 Clinical staging
