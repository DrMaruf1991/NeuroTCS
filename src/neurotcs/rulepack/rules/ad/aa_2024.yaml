# NeuroTCS Rule Pack: Alzheimer's Disease — AA 2024 Revised Criteria
# (See accompanying docs for full source-tracking commentary.)
# Schema 1.3.0. Source: Jack 2024 PMID 38934362 DOI 10.1002/alz.13859.
# External parameters (tau_pet_mod_vs_high_cutpoint,
# neocortical_meta_roi_definition, amyloid_pet_positivity_threshold)
# are documented in docs/validation/aa_2024_audit_protocol.md.
# They are caller-supplied at audit time; the rule pack encodes
# structure only, not threshold values. This is faithful to
# Jack 2024 §4.6 which explicitly declines to commit to a single
# cutpoint methodology.

