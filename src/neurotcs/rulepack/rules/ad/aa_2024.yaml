state_space:
- name: Stage_0
  description: Asymptomatic, deterministic gene carrier (ADAD mutation or trisomy
    21 / DSAD). Biomarkers in normal range. Per Jack 2024 Table 6 row 1 and §5.2.
  ordinal_rank: 0
- name: Stage_1A
  description: Asymptomatic; A+T2- on PET (Table 7 cell 1A, Table 4 stage A).
  ordinal_rank: 1
- name: Stage_1B
  description: Asymptomatic; A+T2MTL+ on PET (Table 7 cell 1B, Table 4 stage B).
  ordinal_rank: 2
- name: Stage_1C
  description: Asymptomatic; A+T2MOD+ on PET (Table 7 cell 1C). Off-diagonal.
  ordinal_rank: 3
- name: Stage_1D
  description: Asymptomatic; A+T2HIGH+ on PET (Table 7 cell 1D). Rare.
  ordinal_rank: 4
- name: Stage_2A
  description: 'Transitional decline (Table 6 stage 2: persistent >=6 months); A+T2-.'
  ordinal_rank: 5
- name: Stage_2B
  description: Transitional decline; A+T2MTL+. Diagonal of Table 7.
  ordinal_rank: 6
- name: Stage_2C
  description: Transitional decline; A+T2MOD+. Off-diagonal.
  ordinal_rank: 7
- name: Stage_2D
  description: Transitional decline; A+T2HIGH+. Off-diagonal.
  ordinal_rank: 8
- name: Stage_3A
  description: MCI-equivalent (Table 6 stage 3); A+T2-. Off-diagonal; copathology
    likely.
  ordinal_rank: 9
- name: Stage_3B
  description: MCI-equivalent; A+T2MTL+. Off-diagonal.
  ordinal_rank: 10
- name: Stage_3C
  description: MCI-equivalent; A+T2MOD+. Diagonal of Table 7.
  ordinal_rank: 11
- name: Stage_3D
  description: MCI-equivalent; A+T2HIGH+. Off-diagonal.
  ordinal_rank: 12
- name: Stage_4-6A
  description: Dementia (Table 6 stages 4/5/6); A+T2-. Copathology-dominant (Figure
    2 LATE example).
  ordinal_rank: 13
- name: Stage_4-6B
  description: Dementia; A+T2MTL+. Off-diagonal.
  ordinal_rank: 14
- name: Stage_4-6C
  description: Dementia; A+T2MOD+. Off-diagonal but common.
  ordinal_rank: 15
- name: Stage_4-6D
  description: Dementia; A+T2HIGH+. Diagonal endpoint (Table 7 'from 1A to 4-6D').
  ordinal_rank: 16
admissible_transitions:
- from_state: Stage_0
  to_state: Stage_1A
  min_delta_t_days: null
  max_delta_t_days: null
  attribution_type: clinical_inference
  inference_rationale: 'Jack 2024 §5.2 (verbatim): "A person with DSAD or ADAD would
    move from stage 0 into stage 1 when a diagnostic Core 1 biomarker(s) became positive."
    The paper specifies the destination clinical stage (1) and the trigger (Core 1
    biomarker positivity) but does not enumerate which biological sub-stage (1A, 1B,
    1C, or 1D) is the entry point. Clinical inference: by definition of biological
    stage A (Table 4: A+T2-), the FIRST positive Core 1 biomarker (amyloid PET or
    biofluid) WITH a still-negative tau PET places the individual in Stage_1A. Entry
    directly into 1B/1C/1D would require simultaneous Core 1 AND Core 2 abnormality,
    which contradicts §4.3 stereotypical sequence "A to T2 to N to C."'
  citation:
    citation_pmid: '38934362'
    citation_doi: 10.1002/alz.13859
    citation_text: 'Jack 2024 §5.2 (Stage 0): "A person with DSAD or ADAD would move
      from stage 0 into stage 1 when a diagnostic Core 1 biomarker(s) became positive."'
  guideline_section: Jack 2024 §5.2 + Table 6 row 1 footnote a + Table 7 col 'Clinical
    Stage 1' row 'Initial biological stage (A)'
  override_allowed: false
  notes: Stage 0 is ONLY reachable by genetic determinism (Down syndrome, ADAD mutation).
    The audit kernel should never observe a non-genetic subject in Stage 0.
- from_state: Stage_1A
  to_state: Stage_1B
  min_delta_t_days: null
  max_delta_t_days: null
  attribution_type: guideline_quote
  citation:
    citation_pmid: '38934362'
    citation_doi: 10.1002/alz.13859
    citation_text: 'Jack 2024 §4.3 (verbatim): "abnormal amyloid PET (A) precedes
      tau PET (T2)... Amyloidosis appears to facilitate topographic spread of tauopathy,
      with the latter most commonly, but not always, beginning in medial temporal
      areas."'
  guideline_section: Jack 2024 §4.3 + Table 4 (Stage A -> Stage B)
  override_allowed: false
- from_state: Stage_1B
  to_state: Stage_1C
  min_delta_t_days: null
  max_delta_t_days: null
  attribution_type: clinical_inference
  inference_rationale: 'Biological B -> C requires neocortical tau uptake to cross
    the moderate cutpoint. Jack 2024 §4.6: cutpoint operationalization is "an area
    of active research." The audit caller must supply tau_pet_mod_vs_high_cutpoint
    and neocortical_meta_roi_definition.'
  citation:
    citation_pmid: '38934362'
    citation_doi: 10.1002/alz.13859
    citation_text: Jack 2024 §4.3 + Table 4 + §4.6 cutpoint caveat.
  guideline_section: Jack 2024 §4.3, §4.6 + Table 4 (Stage B -> Stage C)
  override_allowed: false
- from_state: Stage_1C
  to_state: Stage_1D
  min_delta_t_days: null
  max_delta_t_days: null
  attribution_type: clinical_inference
  inference_rationale: 'Jack 2024 §4.6 (verbatim): "the distinction between moderate
    (stage C) and high (stage D) neocortical tau uptake could be operationalized in
    different ways. Methods for quantification of tau PET is an area of active research,
    and selecting the best cutpoint to distinguish moderate versus high uptake will
    be informed by upcoming research findings." Canonical clinical_inference case
    in the paper.'
  citation:
    citation_pmid: '38934362'
    citation_doi: 10.1002/alz.13859
    citation_text: Jack 2024 §4.6 (moderate-vs-high cutpoint).
  guideline_section: Jack 2024 §4.6 + Table 4 (Stage C -> Stage D)
  override_allowed: false
