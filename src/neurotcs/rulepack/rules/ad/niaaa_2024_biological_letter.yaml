# NeuroTCS Rule Pack: Alzheimer's Disease -- NIA-AA 2024 BIOLOGICAL letter staging
# (A/B/C/D PET-based biological stages, Jack et al. 2024)
# Schema: 1.4.0 | Status: PRODUCTION | NeuroTCS v1 instantiation
#
# WHY THIS PACK EXISTS
# --------------------
# The NIA-AA 2024 revised criteria (Jack et al. 2024) define four PET-based
# BIOLOGICAL stages among amyloid-positive (A+) individuals, by the magnitude
# and topography of tau-PET uptake:
#   A  A+ (amyloid positivity; no significant tau aggregation)
#   B  A+/T2MTL+  (medial-temporal tau)
#   C  A+/T2MOD+  (moderate neocortical tau)
#   D  A+/T2HIGH+ (high neocortical tau)
# Datasets that encode biological_stage as the letters A/B/C/D had no matching
# production pack: the existing ad/at_biological pack uses the A-T-/A+T-/A+T+
# notation, NOT these letters. Such a cohort therefore could not have its
# biological axis audited. This pack recognizes the A/B/C/D letter scale
# natively. It is a SEPARATE axis from the numeric clinical staging
# (ad/niaaa_2024_clinical_numeric); the two share no transition logic.
#
# STATE SPACE (anchored to Jack 2024; PMID 38934362, DOI 10.1002/alz.13859):
#   ordinal A < B < C < D by increasing tau-PET spread in A+ individuals.
# Verified against Jack 2024 and the AA-2024 validation literature
# (Neurology 2025, DOI 10.1212/WNL.0000000000213675: "stage A (A+), stage B
# (A+/T2MTL+), stage C (A+/T2MOD+), stage D (A+/T2HIGH+)").
#
# CRITICAL DESIGN DECISIONS
# -------------------------
# 1. MONOTONIC FORWARD PROGRESSION. Forward steps (A->B->C->D, including skips)
#    and same-stage persistence are admissible. The biological stage reflects
#    accumulating tau burden, expected to be non-decreasing under natural
#    history.
# 2. BACKWARD STEP = INADMISSIBLE BY DEFAULT. Any later visit whose letter is
#    strictly below the prior visit's letter (B->A, C->B, C->A, D->C, D->B,
#    D->A; single- or multi-step) is inadmissible -- UNLESS the TRAC carve-out
#    (below) applies. Flag is on the LATER (regressing) visit.
# 3. TRAC CARVE-OUT (the single most load-bearing rule). Treatment-Related
#    Amyloid Clearance (La Joie 2025, DOI 10.1002/alz.70997): under anti-amyloid
#    therapy, biomarker REVERSAL is a VALID treatment effect, not an error.
#    Each backward transition therefore carries
#      required_conditions: {treatment_status: ["TRAC"]}
#      conditions_evaluated_at: "to_visit"
#    so a backward step is admissible ONLY when the regressing (later) visit
#    itself carries treatment_status == "TRAC". This is ROW-LOCAL to the
#    regressing visit (not subject-global). INPUT-CONTRACT NOTE: the engine's
#    per-visit context channel is the field `treatment_status`; to exercise this
#    carve-out, the dataset's TRAC column (e.g. `trac_status`) must be wired as
#    the trajectory's treatment_status_col with the literal value "TRAC".
# 4. BLANK / A- ROWS DO NOT PARTICIPATE. Rows whose biological_stage is blank
#    (not on the A+ staging pathway) are skipped by the trajectory builder and
#    are neither staged nor flagged here.
# 5. NO RATE LOGIC. No fast-progression / time-floor rule (Jack 2024 gives no
#    numeric time floor to advance a biological stage; such a cutpoint would be
#    invented). Ordering/monotonicity is the only longitudinal constraint.

