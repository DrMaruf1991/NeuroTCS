anchor_citation:
  citation_pmid: "38934362"
  citation_doi: "10.1002/alz.13859"
  citation_text: >-
    Jack CR Jr, Andrews JS, Beach TG, et al. Revised criteria for diagnosis and
    staging of Alzheimer's disease: Alzheimer's Association Workgroup. Alzheimer's
    & Dementia 2024;20(8):5143-5169. PMID 38934362; DOI 10.1002/alz.13859. Defines the PET-based
    biological stages A (A+), B (A+/T2MTL+), C (A+/T2MOD+), D (A+/T2HIGH+).

state_space:
  - name: "A"
    description: >-
      Amyloid positivity (A+). Initial biological stage: abnormal amyloid PET / Core-1 biomarker without significant tau-PET aggregation.
    ordinal_rank: 0
  - name: "B"
    description: >-
      A+ with medial-temporal tau (A+/T2MTL+). Tau-PET positivity confined to the medial temporal region.
    ordinal_rank: 1
  - name: "C"
    description: >-
      A+ with moderate neocortical tau (A+/T2MOD+). Tau-PET shows moderate neocortical uptake.
    ordinal_rank: 2
  - name: "D"
    description: >-
      A+ with high neocortical tau (A+/T2HIGH+). Tau-PET shows high neocortical uptake (most advanced biological stage).
    ordinal_rank: 3

