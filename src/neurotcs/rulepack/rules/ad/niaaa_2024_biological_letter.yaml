notes: >-
  Biological-axis letter staging (A/B/C/D) for the NIA-AA 2024 PET-based scheme.
  Forward progression and same-stage persistence are admissible. Each BACKWARD
  letter step is encoded as a TRAC-gated admissible transition
  (required_conditions: treatment_status == "TRAC", conditions_evaluated_at:
  to_visit): admitted ONLY when the regressing (later) visit carries TRAC
  (treatment-related amyloid clearance, La Joie 2025); otherwise the engine
  fails closed and flags it. This row-local carve-out matches "any backward step
  is an error unless that row is TRAC." Blank / A- (off-pathway) rows do not
  participate. No rate/fast-progression logic. SEPARATE axis from
  ad/niaaa_2024_clinical_numeric; shares no transition logic. INPUT CONTRACT:
  wire the dataset's TRAC column as the trajectory treatment_status_col with
  literal value "TRAC" to exercise the carve-out.
