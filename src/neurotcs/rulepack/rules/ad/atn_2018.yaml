# NeuroTCS Rule Pack: Alzheimer's Disease — Jack 2018 AT(N) 8-state biomarker
# profile (per the originating AT(N) framework: Jack 2018 PMID 29653606 and
# Jack 2016 PMID 27371494) with Jack 2024 §3 inadmissibility of A-T+ profiles.
#
# Background — why this pack exists alongside the AA-2024 integrated pack:
#   The Jack 2024 revised criteria (PMID 38934362) §7.1 explicitly retired the
#   "(N) in parentheses" notation from CORE biomarker classification because
#   N biomarkers are non-specific. However, the Jack 2018 A/T/N taxonomy
#   (A+T-N-, A+T-N+, ..., A-T-N-) remains widely used in published cohort
#   data exports — particularly ADNI-era and NACC-era staging fields. This
#   pack encodes that vocabulary so audits of pre-2024 data formats are
#   reachable, with Jack 2024 §3 guidance preserved for the A-T+ exclusion.
#
# Scope honesty per the four-layer audit model (SCOPE.md):
#   - IN SCOPE: state-trajectory admissibility per the AD continuum.
#   - OUT OF SCOPE in THIS BATCH: the T2N-mismatch advisory (Jack 2024 §8,
#     A+T-N+ flags possible non-AD copathology). T2N mismatch is a
#     cross-modal advisory, not a transition rule; it belongs in a
#     cross-sheet invariant pack and is deferred to a future batch with
#     its proper architectural home rather than bolted onto this staging
#     pack. The state description on A+T-N+ documents the §8 guidance for
#     reviewers reading the audit trail.

