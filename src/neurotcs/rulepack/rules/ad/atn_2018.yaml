clinical_source_authority: |
  Jack 2018 AT(N) 8-state biomarker-profile taxonomy as used in published
  AD research datasets exported prior to the Jack 2024 revision. The Jack
  2024 revision (PMID 38934362) §3 declares A-T2+ "not consistent with a
  diagnosis of AD" (PART or near-cutpoint measurement variation); §7.1
  retires the (N) parentheses notation but acknowledges the legacy
  taxonomy remains in cohort use; §8 defines the T2N-mismatch advisory.
  Originating sources: Jack 2016 PMID 27371494 (AT(N) scheme); Jack 2018
  PMID 29653606 (NIA-AA Research Framework); Jack 2013 PMID 23332364
  (amyloid cascade: A precedes T; established positivity does not
  spontaneously revert in untreated natural history). Treatment-induced
  clearance (Jack 2024 §9 TRAC) belongs in ad/aa_2024_trac; this
  natural-history pack does NOT encode treatment conditions.

