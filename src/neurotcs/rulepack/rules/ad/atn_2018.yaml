# ============================================================
# STATE SPACE — all 8 Jack 2018 AT(N) biomarker profiles
# ============================================================
# Vocabulary: the data column must use the literal strings below.
# Ordinal rank: increasing severity within the AD continuum.
#
# 5 states ARE in the AD continuum and admissible:
#   A-T-N-, A+T-N-, A+T-N+, A+T+N-, A+T+N+
# 3 states are recognized vocabulary but NOT in the AD continuum:
#   A-T-N+  -- non-AD pathology (no Core 1 abnormality; Jack 2024 §7.1)
#   A-T+N-  -- INADMISSIBLE per Jack 2024 §3 verbatim p.5147:
#              "The A-T2+ biomarker profile is not consistent with a
#              diagnosis of AD."
#   A-T+N+  -- same inadmissibility as A-T+N-, with non-specific N.
#
# Why include the inadmissible states in state_space:
#   1. The pack RECOGNIZES the full Jack 2018 vocabulary (data containing
#      these states is routed here rather than refused upstream).
#   2. NO admissible_transitions reference the inadmissible states, so
#      any trajectory entering or leaving A-T+N- / A-T+N+ flags as
#      inadmissible_state with the §3 citation in the audit trail.
#   3. The A-T-N+ state allows the audit to follow a non-AD subject
#      across visits without refusing every row; transitions involving
#      A-T-N+ are absent from admissible_transitions, so any movement to
#      or from this state flags (it's not in the AD continuum).
#   4. Pure single-state trajectories at A-T+ or A-T-N+ produce no
#      transitions and therefore no transition-level flag. The cross-
#      sheet invariant for ACTIVE per-row flagging is a separate
#      architectural concern (cross-sheet engine extension needed; see
#      CHANGELOG deferral note).

state_space:

  - name: "A-T-N-"
    description: "Baseline / biomarker-negative for AD. Per Jack 2024 §3 not in the AD continuum (no Core 1 abnormality). The pack recognizes it because subjects may be observed at A-T-N- before progressing to A+T-N- (AD continuum entry)."
    ordinal_rank: 0

  - name: "A-T-N+"
    description: "No AD core biomarker abnormality, but neurodegeneration present. Per Jack 2024 §7.1 N is non-specific; this profile suggests non-AD pathology (e.g., LATE, vascular, FTLD). Not in the AD continuum. No admissible transitions reference this state, so any trajectory crossing into or out of it flags as inadmissible_state."
    ordinal_rank: 1

  - name: "A+T-N-"
    description: "Core 1 abnormal (amyloid positive), no tau, no neurodegeneration. Per Jack 2024 §3 this is sufficient for AD diagnosis. Maps to Jack 2024 biological stage A (Table 4, A+T2-). Initial AD continuum entry."
    ordinal_rank: 2

  - name: "A+T-N+"
    description: "Core 1 abnormal (amyloid positive), no tau, neurodegeneration present. Per Jack 2024 §8 this is the canonical T2N-mismatch pattern, indicating likely AD + non-AD copathology (e.g., LATE). Biologically still in the AD continuum (A+ qualifies for AD diagnosis per §3). Advisory flagging is implemented (v1.53.0) in the cross-sheet pack cross_sheet/copathology_advisory (rowwise_conjunction_advisory, severity info)."
    ordinal_rank: 3

  - name: "A+T+N-"
    description: "Core 1 abnormal + tau positive, no neurodegeneration yet. Maps to Jack 2024 biological stages B/C/D (Table 4, A+T2MTL+ through A+T2HIGH+). Intermediate AD continuum."
    ordinal_rank: 4

  - name: "A+T+N+"
    description: "Core 1 abnormal + tau positive + neurodegeneration. Maps to advanced Jack 2024 biological stage with neurodegeneration commonly accompanying tau (§4.2 figure 1 archetypical sequence). Advanced AD continuum."
    ordinal_rank: 5

  - name: "A-T+N-"
    description: "INADMISSIBLE IN THE AD CONTINUUM per Jack 2024 §3 (verbatim p.5147): 'The A-T2+ biomarker profile is not consistent with a diagnosis of AD.' Per the paper, this corresponds to primary age-related tauopathy (PART, Crary 2014 PMID 25348065) or measurement variation near cutpoints. Pack recognizes the state for vocabulary routing; no admissible_transitions reference it, so any trajectory crossing into or out of it flags as inadmissible_state."
    ordinal_rank: 6

  - name: "A-T+N+"
    description: "INADMISSIBLE IN THE AD CONTINUUM per Jack 2024 §3: same exclusion as A-T+N- with additional non-specific N abnormality. Pack recognizes the state for vocabulary routing; no admissible_transitions reference it, so any trajectory crossing into or out of it flags as inadmissible_state."
    ordinal_rank: 7

# ============================================================
# ADMISSIBLE TRANSITIONS — only AD-continuum-compatible progressions
# ============================================================
# Per Jack 2024 §4.2 (verbatim p.5152, Figure 1A archetypical sequence):
# "abnormal amyloid PET (A) precedes tau PET (T2), which, in turn, leads
# to neurodegeneration (N) and clinical symptoms (C), A to T2 to N to C."
# Per Jack 2013 amyloid-cascade (PMID 23332364): established positivity
# does not spontaneously revert in untreated natural history. Reversals
# (A+ -> A-, T+ -> T-, N+ -> N-) are therefore not admissible here.
# Treatment-induced clearance (TRAC, Jack 2024 §9) belongs in the
# separate ad/aa_2024_trac pack.
#
# Transitions involving A-T+N- or A-T+N+ are deliberately ABSENT per
# Jack 2024 §3 inadmissibility -- any trajectory touching those states
# will flag as inadmissible_state.

admissible_transitions:

  # ----- Entry into AD continuum (amyloid becomes positive) -----

  - from_state: "A-T-N-"
    to_state: "A+T-N-"
    min_delta_t_days: null
    max_delta_t_days: null
    citation:
      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: >-
        Jack 2024 §4.2 (p.5152): "abnormal amyloid PET (A) precedes tau PET
        (T2)." A-T-N- to A+T-N- is the first step into the AD continuum
        (amyloid becomes positive in the absence of tau and neurodegeneration).
    guideline_section: "Jack 2024 §4.2 biological staging; Jack 2013 amyloid cascade (PMID 23332364)"
    override_allowed: false
    notes: "Amyloid becomes positive first; first AD continuum entry."

  - from_state: "A+T-N-"
    to_state: "A+T-N+"
    min_delta_t_days: null
    max_delta_t_days: null
    citation:
      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: >-
        Jack 2024 §8 (p.5160): in older adults AD commonly occurs with
        copathologies; acquiring neurodegeneration prior to tau positivity
        produces the T2N-mismatch state A+T-N+ "indicating the presence of
        neurodegeneration or neuronal injury due to a disease(s) other than AD."
    guideline_section: "Jack 2024 §8 T2N mismatch"
    override_allowed: false
    notes: "Copathology emerges (T2N mismatch) before tau positivity."

  - from_state: "A+T-N-"
    to_state: "A+T+N-"
    min_delta_t_days: null
    max_delta_t_days: null
    citation:
      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: >-
        Jack 2024 §4.2 (p.5152): "amyloid PET (A) precedes tau PET (T2),
        which, in turn, leads to neurodegeneration (N)." A+T-N- to A+T+N- is
        tau positivity acquired after established amyloid, before
        neurodegeneration -- biological stage B/C onset.
    guideline_section: "Jack 2024 §4.2, §4.3"
    override_allowed: false
    notes: "Tau positivity follows established amyloid positivity (cascade)."

  - from_state: "A+T-N+"
    to_state: "A+T+N+"
    min_delta_t_days: null
    max_delta_t_days: null
    citation:
      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: >-
        Jack 2024 §4.2, §8: in a subject already in the T2N-mismatch state
        (A+T-N+), tau positivity acquired produces A+T+N+ (advanced AD
        continuum with persistent copathology).
    guideline_section: "Jack 2024 §4.2 + §8"
    override_allowed: false
    notes: "Tau positivity in T2N-mismatch case."

  - from_state: "A+T+N-"
    to_state: "A+T+N+"
    min_delta_t_days: null
    max_delta_t_days: null
    citation:
      citation_pmid: "38934362"
      citation_doi: "10.1002/alz.13859"
      citation_text: >-
        Jack 2024 §4.2 (p.5152): "tau PET (T2) ... leads to neurodegeneration
        (N) and clinical symptoms (C)." A+T+N- to A+T+N+ is acquiring
        neurodegeneration after tau positivity -- advanced AD continuum
        biological stage with clinical decline expected (§4.7 PET stages
        C/D, HR 39.9 vs A-T2- reference per Ossenkoppele 2022 PMID 36302769).
    guideline_section: "Jack 2024 §4.2, §4.6 PET staging stages C/D"
    override_allowed: false
    notes: "Neurodegeneration emerges after tau positivity; advanced AD."
