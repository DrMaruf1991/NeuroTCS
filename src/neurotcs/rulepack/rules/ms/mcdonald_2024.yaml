# NeuroTCS Rule Pack: Multiple Sclerosis - McDonald 2024 + EDSS (Kurtzke 1983)
# Schema: 1.1.0 | Status: PRODUCTION
#
# MS is UNIQUE among NeuroTCS rule packs: relapsing-remitting biology means
# reversion is admissible. Modeled per Lublin 2014 phenotype definitions.

schema_version: "1.1.0"
rulepack_id: "ms/mcdonald_2024@1.0.0"
ruleset_version: "1.0.0"
effective_date: "2026-05-17"
status: "production"
disease_domain: "multiple_sclerosis"
framework_name: "EDSS (Kurtzke 1983) banded with relapsing-remitting biology per McDonald 2024 / Lublin 2014"

transcribed_by: "Salokhiddinov M, MD PhD, ESOR-BRACCO-ESNR Neuroimaging Fellow, KIUT, Uzbekistan"
clinical_source_authority: >-
  EDSS (Kurtzke JF, Neurology 1983;33:1444-1452) is the international
  standard for MS disability quantification. McDonald 2024 (Montalban X et al.,
  Lancet Neurology 2025;24(10):850-865, DOI 10.1016/S1474-4422(25)00270-4) is
  the current diagnostic standard endorsed by ECTRIMS, ACTRIMS, and major
  MS clinical research networks (MAGNIMS, CMSC, NAIMS). Phenotype-level
  reversion (relapse-remission) follows Lublin 2014 (Neurology 83:278-286,
  DOI 10.1212/WNL.0000000000000560) the international consensus on MS
  disease phenotypes.
reviewers: []

anchor_citation:
  citation_pmid: null
  citation_doi: "10.1016/S1474-4422(25)00270-4"
  citation_text: >-
    Montalban X, Lebrun-Frenay C, Oh J, Arrambide G, Moccia M, Pia Amato M,
    et al. Diagnosis of multiple sclerosis: 2024 revisions of the McDonald
    criteria. Lancet Neurology 2025;24(10):850-865.

state_space:
  - name: "EDSS_0"
    description: "EDSS 0: Normal neurological examination"
    ordinal_rank: 0
  - name: "EDSS_1_0_2_5"
    description: "EDSS 1.0-2.5: Minimal to mild disability; no impairment of ambulation"
    ordinal_rank: 1
  - name: "EDSS_3_0_4_5"
    description: "EDSS 3.0-4.5: Moderate disability; fully ambulatory without aid"
    ordinal_rank: 2
  - name: "EDSS_5_0_6_5"
    description: "EDSS 5.0-6.5: Walking assistance required (cane, crutch, brace)"
    ordinal_rank: 3
  - name: "EDSS_7_0_8_5"
    description: "EDSS 7.0-8.5: Essentially restricted to wheelchair / bed"
    ordinal_rank: 4
  - name: "EDSS_9_0_9_5"
    description: "EDSS 9.0-9.5: Helpless bed patient"
    ordinal_rank: 5
  - name: "EDSS_10"
    description: "EDSS 10: Death due to MS (absorbing)"
    ordinal_rank: 6

admissible_transitions:

  # ===== Adjacent forward (worsening): any interval (relapse possible) =====

  - from_state: "EDSS_0"
    to_state: "EDSS_1_0_2_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: relapse activity may produce abrupt EDSS worsening at any interval."
    guideline_section: "Lublin 2014 §'Defining MS disease activity', Figure 1"
    override_allowed: false

  - from_state: "EDSS_1_0_2_5"
    to_state: "EDSS_3_0_4_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: progression or relapse activity."
    guideline_section: "Lublin 2014 Figure 1"
    override_allowed: false

  - from_state: "EDSS_3_0_4_5"
    to_state: "EDSS_5_0_6_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014."
    guideline_section: "Lublin 2014 Figure 1"
    override_allowed: false

  - from_state: "EDSS_5_0_6_5"
    to_state: "EDSS_7_0_8_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014."
    guideline_section: "Lublin 2014 Figure 1"
    override_allowed: false

  - from_state: "EDSS_7_0_8_5"
    to_state: "EDSS_9_0_9_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014."
    guideline_section: "Lublin 2014 Figure 1"
    override_allowed: false

  - from_state: "EDSS_9_0_9_5"
    to_state: "EDSS_10"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: death due to MS is the absorbing terminal state."
    guideline_section: "Lublin 2014"
    override_allowed: false

  # ===== Adjacent backward (improvement): admissible — RRMS biology =====
  # Per Lublin 2014: relapses can resolve completely or partially. Remission
  # to a lower EDSS band within months is expected biology in RRMS.

  - from_state: "EDSS_1_0_2_5"
    to_state: "EDSS_0"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: complete relapse remission is part of relapsing-remitting MS phenotype."
    guideline_section: "Lublin 2014 §'Disease course', Figure 1 (RRMS arrows)"
    override_allowed: false

  - from_state: "EDSS_3_0_4_5"
    to_state: "EDSS_1_0_2_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: partial relapse remission to lower disability band."
    guideline_section: "Lublin 2014 Figure 1"
    override_allowed: false

  - from_state: "EDSS_5_0_6_5"
    to_state: "EDSS_3_0_4_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: relapse remission. Less common at higher disability but biologically possible, especially with high-efficacy DMT response."
    guideline_section: "Lublin 2014 Figure 1"
    override_allowed: false

  - from_state: "EDSS_7_0_8_5"
    to_state: "EDSS_5_0_6_5"
    min_delta_t_days: 90.0
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: improvement from wheelchair-restricted to ambulatory-with-aid is uncommon but possible with aggressive remission of acute relapse."
    guideline_section: "Lublin 2014 Figure 1"
    override_allowed: true

  # ===== Non-adjacent forward jumps: >= 180 days =====
  # Per Lublin 2014: sustained progression requires confirmation. Two-band
  # worsening within 6 months is unusually rapid for natural progression
  # alone (suggests aggressive relapse activity or model instability).

  - from_state: "EDSS_0"
    to_state: "EDSS_3_0_4_5"
    min_delta_t_days: 180.0
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: sustained progression definition (>=6 months confirmation)."
    guideline_section: "Lublin 2014 §'Confirmed disability progression'"
    override_allowed: true

  - from_state: "EDSS_1_0_2_5"
    to_state: "EDSS_5_0_6_5"
    min_delta_t_days: 180.0
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: sustained two-band progression."
    guideline_section: "Lublin 2014 §'Confirmed disability progression'"
    override_allowed: true

  - from_state: "EDSS_3_0_4_5"
    to_state: "EDSS_7_0_8_5"
    min_delta_t_days: 180.0
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014."
    guideline_section: "Lublin 2014"
    override_allowed: true

inadmissible_transitions:

  - from_state: "EDSS_10"
    to_state: "EDSS_9_0_9_5"
    reason: "EDSS_10 (death) is an absorbing state."
    citation:
      citation_pmid: null
      citation_doi: "10.1212/WNL.0000000000000560"
      citation_text: "Lublin 2014: terminal state."
    guideline_section: "Lublin 2014"

transition_priors: []
override_allowed_default: false

notes: >-
  MS is unique in NeuroTCS: relapsing-remitting biology means same-direction
  monotonicity is NOT required. Adjacent-band backward transitions
  (remission) are admissible at any interval. Sustained two-band progression
  requires 180-day confirmation per Lublin 2014. High-efficacy DMT
  responders may achieve unusual improvement — handled via override.
  Validation cohort target: MSBase registry (90,000+ MS patients) — pending
  partnership for v0.2.
