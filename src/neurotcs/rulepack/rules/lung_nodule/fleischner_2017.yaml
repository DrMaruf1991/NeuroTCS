# NeuroTCS Rule Pack: Lung Nodule Surveillance - Fleischner Society 2017
# Schema: 1.1.0 | Status: PRODUCTION

schema_version: "1.1.0"
rulepack_id: "lung_nodule/fleischner_2017@1.0.0"
ruleset_version: "1.0.0"
effective_date: "2026-05-17"
status: "production"
disease_domain: "pulmonology"
framework_name: "Fleischner Society 2017 Guidelines for Management of Incidental Pulmonary Nodules"

transcribed_by: "Salokhiddinov M, MD PhD, ESOR-BRACCO-ESNR Neuroimaging Fellow, KIUT, Uzbekistan"
clinical_source_authority: >-
  Fleischner Society 2017 Guidelines (MacMahon H et al., Radiology
  2017;284(1):228-243, DOI 10.1148/radiol.2017161659) - developed by the
  Fleischner Society (international thoracic imaging society) and endorsed
  by the American College of Radiology, the Society of Thoracic Radiology,
  and the American Thoracic Society. International standard for management
  of incidental pulmonary nodules on CT, used in essentially all radiology
  practice worldwide. Replaces the 2005/2013 Fleischner guidelines.
reviewers: []

anchor_citation:
  citation_pmid: "28240562"
  citation_doi: "10.1148/radiol.2017161659"
  citation_text: >-
    MacMahon H, Naidich DP, Goo JM, Lee KS, Leung ANC, Mayo JR, et al.
    Guidelines for Management of Incidental Pulmonary Nodules Detected on
    CT Images: From the Fleischner Society 2017. Radiology
    2017;284(1):228-243.

state_space:
  - name: "Nodule_lt_6mm"
    description: "Solid nodule <6 mm mean diameter (low risk: no routine follow-up unless high-risk patient)"
    ordinal_rank: 0
  - name: "Nodule_6_8mm"
    description: "Solid nodule 6-8 mm mean diameter (intermediate: 6-12 month follow-up)"
    ordinal_rank: 1
  - name: "Nodule_gt_8mm"
    description: "Solid nodule >8 mm mean diameter (consider PET-CT, biopsy, or 3-month follow-up)"
    ordinal_rank: 2
  - name: "Nodule_subsolid_lt_6mm"
    description: "Subsolid nodule <6 mm (ground-glass or part-solid; no routine follow-up)"
    ordinal_rank: 3
  - name: "Nodule_subsolid_gte_6mm"
    description: "Subsolid nodule >=6 mm (ground-glass or part-solid; 6-12 month follow-up)"
    ordinal_rank: 4

admissible_transitions:

  # ===== Solid nodule growth (the expected malignancy pattern) =====

  - from_state: "Nodule_lt_6mm"
    to_state: "Nodule_6_8mm"
    min_delta_t_days: 90.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017 Table 1: solid nodule growth across size bands is the expected malignancy progression pattern. Minimum 3-month follow-up interval per Fleischner protocol."
    guideline_section: "MacMahon 2017 Table 1 (solid nodules) + §'Follow-up intervals'"
    override_allowed: false

  - from_state: "Nodule_6_8mm"
    to_state: "Nodule_gt_8mm"
    min_delta_t_days: 90.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017 Table 1: solid nodule growth >8mm triggers higher-suspicion workup."
    guideline_section: "MacMahon 2017 Table 1"
    override_allowed: false

  - from_state: "Nodule_lt_6mm"
    to_state: "Nodule_gt_8mm"
    min_delta_t_days: 180.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017: rapid two-band growth requires 6-month minimum interval to be plausible under typical malignancy doubling times (>=400 days for most adenocarcinomas, per Heuvelmans 2013 Eur Radiol 23:1836-1845)."
    guideline_section: "MacMahon 2017 §'Doubling time' + Table 1"
    override_allowed: true

  # ===== Subsolid -> solid transition (progression to invasive) =====

  - from_state: "Nodule_subsolid_lt_6mm"
    to_state: "Nodule_subsolid_gte_6mm"
    min_delta_t_days: 90.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017 Table 2: subsolid nodule growth across size bands."
    guideline_section: "MacMahon 2017 Table 2 (subsolid nodules)"
    override_allowed: false

  - from_state: "Nodule_subsolid_gte_6mm"
    to_state: "Nodule_gt_8mm"
    min_delta_t_days: 180.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017: subsolid->solid component development indicates progression toward invasive adenocarcinoma; surveillance interval typically 6-12 months."
    guideline_section: "MacMahon 2017 Table 2 + §'Subsolid nodules' discussion"
    override_allowed: true

  # ===== Reduction in size (suggests non-malignancy) - override required =====

  - from_state: "Nodule_6_8mm"
    to_state: "Nodule_lt_6mm"
    min_delta_t_days: 90.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017: shrinkage of solid pulmonary nodules suggests non-malignant etiology (organizing pneumonia, granuloma resolution). Override permitted with explicit citation of resolved infection or anti-inflammatory treatment in audit log."
    guideline_section: "MacMahon 2017 §'Nodule shrinkage and resolution'"
    override_allowed: true

  - from_state: "Nodule_gt_8mm"
    to_state: "Nodule_6_8mm"
    min_delta_t_days: 90.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017: shrinkage suggests non-malignancy."
    guideline_section: "MacMahon 2017 §'Nodule shrinkage and resolution'"
    override_allowed: true

  - from_state: "Nodule_subsolid_gte_6mm"
    to_state: "Nodule_subsolid_lt_6mm"
    min_delta_t_days: 90.0
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017: ground-glass nodule resolution often indicates infection or hemorrhage; consistent with non-malignant etiology."
    guideline_section: "MacMahon 2017 §'Subsolid nodule resolution'"
    override_allowed: true

inadmissible_transitions:

  - from_state: "Nodule_lt_6mm"
    to_state: "Nodule_gt_8mm"
    reason: >-
      Three-band growth in a single observation is incompatible with typical
      adenocarcinoma doubling times. This is the inadmissible-by-default
      version; for documented aggressive histology (small cell lung cancer
      doubling time ~30 days per Friberg 1997 Eur J Cancer 33:1031-1046),
      use the >=180-day window admissible_transition with override.
    citation:
      citation_pmid: null
      citation_doi: "10.1148/radiol.2017161659"
      citation_text: "MacMahon 2017 §'Doubling time'."
    guideline_section: "MacMahon 2017 §'Doubling time'"

transition_priors: []
override_allowed_default: false

notes: >-
  Fleischner 2017 distinguishes solid from subsolid (ground-glass or part-
  solid) nodules with separate management trees. Growth is the expected
  malignancy pattern with minimum 3-month surveillance interval. Shrinkage
  is admissible with override (suggests non-malignancy: granuloma, organizing
  pneumonia, post-infectious). Future v1.1 will encode mean diameter as
  continuous biomarker per input contract v1.1 (continuous_biomarkers),
  replacing categorical bins with monotone growth bounds.
