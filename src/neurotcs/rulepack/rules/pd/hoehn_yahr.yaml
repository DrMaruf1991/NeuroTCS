      per-transition table of admissibility windows. The 365-day floor
      for two-step H&Y jumps is a conservative clinical inference: a
      genuine two-stage natural-history progression in under 12 months is
      implausible given the published pace, and observing one in audit
      data should at minimum trigger a human review (override_allowed=true
      keeps this fail-soft for treatment-related or atypical-parkinsonism
      contexts). Per ERRATA E-2026-003.
    override_allowed: true

  - from_state: "HY_3"
    to_state: "HY_5"
    min_delta_t_days: 365.0
    citation:
      citation_pmid: "12433259"
      citation_doi: "10.1001/archneur.59.11.1724"
      citation_text: "Marras C, Rochon P, Lang AE. Predicting motor decline and disability in Parkinson disease: a systematic review. Arch Neurol 2002;59(11):1724-1728. PMID 12433259, DOI 10.1001/archneur.59.11.1724. Informs the pace of progression through to wheelchair/bedridden states; the encoded floor is a clinical inference (per ERRATA E-2026-003)."
    guideline_section: "Marras 2002 (Arch Neurol 59:1724-1728) — systematic-review discussion of motor-decline predictors"
    attribution_type: "clinical_inference"
    inference_rationale: >-
      Marras et al. 2002 is a systematic review of motor-decline predictors
      in early PD; it summarises natural-history progression as averaging
      roughly one Hoehn-Yahr stage per 2-3 years, but does NOT publish a
      per-transition table of admissibility windows. The 365-day floor
      for two-step H&Y jumps is a conservative clinical inference: a
      genuine two-stage natural-history progression in under 12 months is
      implausible given the published pace, and observing one in audit
