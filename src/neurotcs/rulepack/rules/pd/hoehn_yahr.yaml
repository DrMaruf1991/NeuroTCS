    override_allowed: true

  # ===== Three-step or larger jumps: require >= 730 days =====

  - from_state: "HY_1"
    to_state: "HY_2_5"
    min_delta_t_days: 730.0
    citation:
      citation_pmid: "12433259"
      citation_doi: "10.1001/archneur.59.11.1724"
      citation_text: "Marras C, Rochon P, Lang AE. Predicting motor decline and disability in Parkinson disease: a systematic review. Arch Neurol 2002;59(11):1724-1728. PMID 12433259, DOI 10.1001/archneur.59.11.1724. Supports the inference that three-stage H&Y progression typically requires multi-year intervals; the 730-day minimum-Δt floor is a clinical inference (per ERRATA E-2026-003)."
    guideline_section: "Marras 2002 (Arch Neurol 59:1724-1728) — systematic-review discussion of motor-decline predictors"
    attribution_type: "clinical_inference"
    inference_rationale: >-
      Marras et al. 2002 establishes the natural-history pace of motor
      decline in early PD as roughly one Hoehn-Yahr stage per 2-3 years.
      A three-stage natural-history progression in under 24 months is
      clinically implausible by that benchmark, so a 730-day minimum-Δt
      floor is a conservative clinical inference. The review itself
      does NOT enumerate per-transition admissibility windows. Per
      ERRATA E-2026-003.
    override_allowed: true

  - from_state: "HY_2"
    to_state: "HY_4"
    min_delta_t_days: 730.0
    citation:
      citation_pmid: "12433259"
      citation_doi: "10.1001/archneur.59.11.1724"
      citation_text: "Marras C, Rochon P, Lang AE. Predicting motor decline and disability in Parkinson disease: a systematic review. Arch Neurol 2002;59(11):1724-1728. PMID 12433259, DOI 10.1001/archneur.59.11.1724. Supports the inference that multi-stage H&Y progression typically requires multi-year intervals; the 730-day minimum-Δt floor is a clinical inference (per ERRATA E-2026-003)."
    guideline_section: "Marras 2002 (Arch Neurol 59:1724-1728) — systematic-review discussion of motor-decline predictors"
    attribution_type: "clinical_inference"
    inference_rationale: >-
      Marras et al. 2002 establishes the natural-history pace of motor
      decline in early PD as roughly one Hoehn-Yahr stage per 2-3 years.
      A three-stage natural-history progression in under 24 months is
      clinically implausible by that benchmark, so a 730-day minimum-Δt
      floor is a conservative clinical inference. The review itself
      does NOT enumerate per-transition admissibility windows. Per
      ERRATA E-2026-003.
    override_allowed: true

inadmissible_transitions:

  - from_state: "HY_2"
    to_state: "HY_1"
    reason: >-
      Natural-history H&Y is monotone non-decreasing. Apparent backward
      transitions reflect either treatment response (handled via override+
      citation, e.g. levodopa initiation, DBS) or model instability. The base
      rule pack treats backward transitions as inadmissible to make
      treatment-driven improvement explicit and auditable.
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008: H&Y is a measure of accumulating disability; reversion is not part of natural history."
    guideline_section: "Goetz 2008 Appendix C (introduction)"

  - from_state: "HY_3"
    to_state: "HY_2"
    reason: "Natural-history monotonicity (override permitted for documented treatment effect)."
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008 Appendix C."
    guideline_section: "Goetz 2008 Appendix C"

  - from_state: "HY_4"
    to_state: "HY_3"
    reason: "Natural-history monotonicity (override permitted for DBS or aggressive medical optimization)."
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008 Appendix C."
    guideline_section: "Goetz 2008 Appendix C"

transition_priors: []

override_allowed_default: false

notes: >-
  Modified Hoehn-Yahr (Goetz 2008 MDS-UPDRS Appendix C) is the international
  standard for PD severity. Natural history is monotone non-decreasing;
  treatment-driven improvement (levodopa initiation, deep brain stimulation,
  carbidopa/levodopa intestinal gel) is handled via override mechanism with
  explicit citation in the audit log.
  Validation cohort: PPMI (2,000+ subjects, ppmi-info.org). Awaiting DUA
  for real-data validation in Aim 5 multi-disease portability arm.
