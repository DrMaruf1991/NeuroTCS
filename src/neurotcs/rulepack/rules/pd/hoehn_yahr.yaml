# NeuroTCS Rule Pack: Parkinson's Disease - Hoehn-Yahr (1967) + MDS-UPDRS (Goetz 2008)
# Schema: 1.3.0 | Status: PRODUCTION
#
# Clinical source authority: Hoehn-Yahr staging is the international standard
# for PD severity classification since 1967. MDS-UPDRS (Goetz 2008) is the
# Movement Disorder Society-endorsed revision and clinimetric validation.
#
# Schema version 1.3.0 (minimum required): this pack uses 7 transitions with
# `attribution_type: clinical_inference` and corresponding `inference_rationale`
# fields, both introduced in schema v1.3.0 (ERRATA E-2026-003). Prior to
# NeuroTCS v1.7.9 this pack declared 1.1.0, which under-declared its actual
# schema requirement. The pack content is unchanged; only the version
# declaration is corrected to be schema-honest.

schema_version: "1.3.0"
rulepack_id: "pd/hoehn_yahr@1.0.0"
ruleset_version: "1.0.0"
effective_date: "2026-05-17"
status: "production"
disease_domain: "parkinsons"
framework_name: "Hoehn-Yahr Staging (modified, with 1.5 and 2.5 substages) + MDS-UPDRS"

transcribed_by: "Salokhiddinov M, MD PhD, ESOR-BRACCO-ESNR Neuroimaging Fellow, KIUT, Uzbekistan"
clinical_source_authority: >-
  Hoehn-Yahr Staging (Hoehn MM, Yahr MD. Neurology 1967;17(5):427-442) - the
  international standard for Parkinson's disease severity classification since
  1967. Modified Hoehn-Yahr (with 1.5 and 2.5 substages) is integrated into
  the MDS-UPDRS (Goetz CG et al., Movement Disorders 2008;23(15):2129-2170,
  PMID 19025984) endorsed by the Movement Disorder Society and used in
  essentially all contemporary PD clinical trials. Natural-history transition
  timing is informed by Marras C, Rochon P, Lang AE (Archives of Neurology
  2002;59(11):1724-1728, PMID 12433259, DOI 10.1001/archneur.59.11.1724),
  a systematic review of motor-decline predictors in PD; the per-transition
  minimum-Δt floors below are clinical inferences applied on top of this
  evidence base rather than verbatim quotations from a specific table (per
  ERRATA E-2026-003).
reviewers: []

anchor_citation:
  citation_pmid: null
  citation_doi: "10.1002/mds.22340"
  citation_text: >-
    Goetz CG, Tilley BC, Shaftman SR, Stebbins GT, Fahn S, Martinez-Martin P,
    et al. Movement Disorder Society-sponsored revision of the Unified
    Parkinson's Disease Rating Scale (MDS-UPDRS): Scale presentation and
    clinimetric testing results. Movement Disorders 2008;23(15):2129-2170.

state_space:
  - name: "HY_1"
    description: "Stage 1: Unilateral involvement only"
    ordinal_rank: 0
  - name: "HY_1_5"
    description: "Stage 1.5: Unilateral and axial involvement"
    ordinal_rank: 1
  - name: "HY_2"
    description: "Stage 2: Bilateral involvement without impairment of balance"
    ordinal_rank: 2
  - name: "HY_2_5"
    description: "Stage 2.5: Mild bilateral disease with recovery on pull test"
    ordinal_rank: 3
  - name: "HY_3"
    description: "Stage 3: Mild to moderate bilateral disease; postural instability; physically independent"
    ordinal_rank: 4
  - name: "HY_4"
    description: "Stage 4: Severe disability; still able to walk or stand unassisted"
    ordinal_rank: 5
  - name: "HY_5"
    description: "Stage 5: Wheelchair-bound or bedridden unless aided"
    ordinal_rank: 6

# Hoehn-Yahr is monotone non-decreasing in natural history. Treatment-driven
# improvement is admissible with explicit override + citation (e.g.,
# levodopa initiation, DBS).
admissible_transitions:

  # ===== Adjacent (one-step) forward progressions: any interval =====

  - from_state: "HY_1"
    to_state: "HY_1_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008 MDS-UPDRS: modified H&Y stages document progression from unilateral to unilateral+axial."
    guideline_section: "Goetz 2008 Appendix C (modified H&Y staging)"
    override_allowed: false

  - from_state: "HY_1_5"
    to_state: "HY_2"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008: progression from unilateral+axial to bilateral involvement."
    guideline_section: "Goetz 2008 Appendix C"
    override_allowed: false

  - from_state: "HY_2"
    to_state: "HY_2_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008: bilateral disease developing mild postural recovery on pull test."
    guideline_section: "Goetz 2008 Appendix C"
    override_allowed: false

  - from_state: "HY_2_5"
    to_state: "HY_3"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008: development of frank postural instability."
    guideline_section: "Goetz 2008 Appendix C"
    override_allowed: false

  - from_state: "HY_3"
    to_state: "HY_4"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008: progression to severe disability with maintained ambulation."
    guideline_section: "Goetz 2008 Appendix C"
    override_allowed: false

  - from_state: "HY_4"
    to_state: "HY_5"
    citation:
      citation_pmid: null
      citation_doi: "10.1002/mds.22340"
      citation_text: "Goetz 2008: loss of independent ambulation."
    guideline_section: "Goetz 2008 Appendix C"
    override_allowed: false

  # ===== Two-step jumps: require >= 365 days (natural-history pace) =====

  - from_state: "HY_1"
    to_state: "HY_2"
    min_delta_t_days: 365.0
    citation:
      citation_pmid: "12433259"
      citation_doi: "10.1001/archneur.59.11.1724"
      citation_text: "Marras C, Rochon P, Lang AE. Predicting motor decline and disability in Parkinson disease: a systematic review. Arch Neurol 2002;59(11):1724-1728. PMID 12433259, DOI 10.1001/archneur.59.11.1724. The review aggregates natural-history evidence that motor progression in PD averages roughly one Hoehn-Yahr stage per 2-3 years; the 365-day minimum-Δt floor for two-step jumps is a clinical inference (per ERRATA E-2026-003)."
    guideline_section: "Marras 2002 (Arch Neurol 59:1724-1728) — systematic-review discussion of motor-decline predictors"
    attribution_type: "clinical_inference"
    inference_rationale: >-
      Marras et al. 2002 is a systematic review of motor-decline predictors
      in early PD; it summarises natural-history progression as averaging
      roughly one Hoehn-Yahr stage per 2-3 years, but does NOT publish a
      per-transition table of admissibility windows. The 365-day floor
      for two-step H&Y jumps is a conservative clinical inference: a
      genuine two-stage natural-history progression in under 12 months is
      implausible given the published pace, and observing one in audit
      data should at minimum trigger a human review (override_allowed=true
      keeps this fail-soft for treatment-related or atypical-parkinsonism
      contexts). Per ERRATA E-2026-003.
    override_allowed: true

  - from_state: "HY_1_5"
    to_state: "HY_2_5"
    min_delta_t_days: 365.0
    citation:
      citation_pmid: "12433259"
      citation_doi: "10.1001/archneur.59.11.1724"
      citation_text: "Marras C, Rochon P, Lang AE. Predicting motor decline and disability in Parkinson disease: a systematic review. Arch Neurol 2002;59(11):1724-1728. PMID 12433259, DOI 10.1001/archneur.59.11.1724. Informs the natural-history H&Y progression pace; the encoded floor is a clinical inference (per ERRATA E-2026-003)."
    guideline_section: "Marras 2002 (Arch Neurol 59:1724-1728) — systematic-review discussion of motor-decline predictors"
    attribution_type: "clinical_inference"
    inference_rationale: >-
      Marras et al. 2002 is a systematic review of motor-decline predictors
      in early PD; it summarises natural-history progression as averaging
      roughly one Hoehn-Yahr stage per 2-3 years, but does NOT publish a
      per-transition table of admissibility windows. The 365-day floor
      for two-step H&Y jumps is a conservative clinical inference: a
      genuine two-stage natural-history progression in under 12 months is
      implausible given the published pace, and observing one in audit
      data should at minimum trigger a human review (override_allowed=true
      keeps this fail-soft for treatment-related or atypical-parkinsonism
      contexts). Per ERRATA E-2026-003.
    override_allowed: true

  - from_state: "HY_2"
    to_state: "HY_3"
    min_delta_t_days: 365.0
    citation:
      citation_pmid: "12433259"
      citation_doi: "10.1001/archneur.59.11.1724"
      citation_text: "Marras C, Rochon P, Lang AE. Predicting motor decline and disability in Parkinson disease: a systematic review. Arch Neurol 2002;59(11):1724-1728. PMID 12433259, DOI 10.1001/archneur.59.11.1724. Informs the natural-history H&Y progression pace; the encoded floor is a clinical inference (per ERRATA E-2026-003)."
    guideline_section: "Marras 2002 (Arch Neurol 59:1724-1728) — systematic-review discussion of motor-decline predictors"
    attribution_type: "clinical_inference"
    inference_rationale: >-
      Marras et al. 2002 is a systematic review of motor-decline predictors
      in early PD; it summarises natural-history progression as averaging
      roughly one Hoehn-Yahr stage per 2-3 years, but does NOT publish a
      per-transition table of admissibility windows. The 365-day floor
      for two-step H&Y jumps is a conservative clinical inference: a
      genuine two-stage natural-history progression in under 12 months is
      implausible given the published pace, and observing one in audit
      data should at minimum trigger a human review (override_allowed=true
      keeps this fail-soft for treatment-related or atypical-parkinsonism
      contexts). Per ERRATA E-2026-003.
    override_allowed: true

  - from_state: "HY_2_5"
    to_state: "HY_4"
    min_delta_t_days: 365.0
    citation:
      citation_pmid: "12433259"
      citation_doi: "10.1001/archneur.59.11.1724"
      citation_text: "Marras C, Rochon P, Lang AE. Predicting motor decline and disability in Parkinson disease: a systematic review. Arch Neurol 2002;59(11):1724-1728. PMID 12433259, DOI 10.1001/archneur.59.11.1724. Informs the natural-history H&Y progression pace; the encoded floor is a clinical inference (per ERRATA E-2026-003)."
    guideline_section: "Marras 2002 (Arch Neurol 59:1724-1728) — systematic-review discussion of motor-decline predictors"
    attribution_type: "clinical_inference"
    inference_rationale: >-
      Marras et al. 2002 is a systematic review of motor-decline predictors
      in early PD; it summarises natural-history progression as averaging
