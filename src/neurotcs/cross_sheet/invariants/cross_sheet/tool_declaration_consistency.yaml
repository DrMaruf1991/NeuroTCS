notes: |
  RESEARCH_PREVIEW->SKELETON RATIONALE: This pack ships at SKELETON
  status (rather than research_preview) because the audit execution
  logic does not yet exist. A research_preview pack is one whose bounds
  are derived rather than verbatim; a SKELETON pack is one whose
  structure is valid but whose framework wiring is incomplete. Both
  refuse production audit, but for different reasons.

  Promotion path:
    v1.11.0a1 (this release): skeleton, 1 invariant
    v1.11.0a2 (rc1 session #2): skeleton, 3 invariants (NeuroQuant + NeuroReader + icometrix);
                                 audit_cross_sheet() implemented
    v1.11.0a3 (rc1 session #3): production, 5 invariants (adds Quantib ND + catch-all warning)
    v1.11.0rc1 (rc2 session): golden-value-locked against synthetic + real cohorts
    v1.11.0 (final): release

  Each promotion step requires its own world-class evidence pack and
  Layer 1 byte-exact gate. No promotion before discipline is met.

invariants:

  - name: "neuroquant_5_0_implies_hippocampal_volume_in_normative_range"
    description: |
      If the submission manifest declares upstream_volumetry_tool ==
      'neuroquant_5.0', then total bilateral hippocampal volume values
      in the biomarkers sheet must fall within the NeuroQuant 5.0
      normative reference range for the patient's age and sex.
      NeuroQuant 5.0 reports volumes against age- and sex-specific
      percentile curves built from 16,400 cognitively normal MRI scans
      (ages 3-100), with the 5th-95th percentile defining the normal
      range. Values outside this range in a trial declaring NeuroQuant
      5.0 as the volumetry tool are flagged for review.
    sheets_required:
      - role: "manifest"
        required: true
      - role: "biomarkers"
        required: true
    join_keys:
      - "patient_id"
      - "visit_id"
    condition:
      type: "categorical_implies_range"
      source_sheet: "manifest"
      source_field: "upstream_volumetry_tool"
      source_value: "neuroquant_5.0"
      target_sheet: "biomarkers"
      target_field: "hippocampal_volume_total_cm3"
      target_range:
        lo: 2.8
        hi: 5.0
      target_unit: "cm3"
    flag_severity: "warning"
    citation_strength: "international_consensus"
    guideline_section: |
      Cortechs.ai NeuroQuant 5.0 Normative Database White Paper (2024);
      Cortechs.ai 'Identifying Alzheimer's disease with NeuroQuant'
      clinical documentation: 'Structure volumes falling outside of the
      5th-95th percentile are typically of diagnostic importance.'
      Bethlehem 2022 cross-validation (PMC11714940 BrainChart hippocampal
      AD validation, ADNI-3 amyloid-PET positive AD median centile 0.01-0.02).
    citation:
      citation_pmid: "35388223"
      citation_doi: "10.1038/s41586-022-04554-y"
      citation_text: |
        NeuroQuant 5.0 normative reference (Cortechs.ai, FDA 510(k)
        K243016 cleared Sept 2024): 16,400 cognitively normal MRI scans
        ages 3-100, GAMLSS LMS percentile model with age, sex, and ICV
        covariates. The 5th-95th percentile range for total bilateral
        hippocampal volume in adults is approximately 2.8-5.0 cm^3
        (consistent with Bethlehem 2022 subcortical GMV centile data
        and Mulder 2014 ADNI controls hippocampal mean 3.57 cm^3 at
        age 75). Tier 1 (warning): value outside this range in a
        NeuroQuant 5.0-declared submission suggests either site/scanner
        variation, tool misdeclaration, or atypical pathology -- flag
        for reviewer attention.

        The two-tier structure per LAYER_3_DESIGN.md section 12 Q2:
        Tier 2 (error, not encoded in this skeleton pack) widens the
        range to Bethlehem 2022 plausibility range +/-10%; values
        outside both Tier 1 AND Tier 2 are strong evidence of tool
        misdeclaration. Tier 2 will be encoded in v1.11.0a2 when the
        audit function ships.
      public_url: "https://www.cortechs.ai/why-bigger-normative-databases-mean-better-brain-imaging/"
      endorsing_bodies:
        - "FDA (NeuroQuant 5.0 510(k) K243016 clearance, Sept 2024)"
        - "Cortechs.ai (NeuroQuant 5.0 normative database, 16,400 scans, GAMLSS LMS)"
        - "Bethlehem 2022 Brain Chart Consortium (n=101,457, cross-validation)"
        - "ADNI (Alzheimer's Disease Neuroimaging Initiative)"
        - "Wittens et al. PMC11714940 BrainChart AD validation"
        - "Mulder et al. NeuroImage 2014 ADNI controls reference"
        - "v1.10.2 mri_volumetrics/structural_volumetry_consensus pack"
