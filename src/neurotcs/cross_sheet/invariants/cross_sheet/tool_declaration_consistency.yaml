clinical_source_authority: |
  This pack encodes cross-sheet invariants linking the declared
  upstream_volumetry_tool field (in submission manifest) with the
  observed volumetric values in the biomarkers sheet.

  STATUS = RESEARCH_PREVIEW in v1.11.0a2: three invariants encoded
  (NeuroQuant 5.0, NeuroReader, icometrix icobrain). The audit_cross_sheet()
  execution function now exists; it accepts research_preview packs in
  dry-run mode for development but refuses execution against production
  submissions. Production promotion (audit gate clears) requires status
  to be advanced to "production" in v1.11.0a3 when the remaining 2
  invariants (Quantib ND + catch-all warning) ship and the pack has
  been validated end-to-end against synthetic and real cohort data.

  Per the v1.11.0-design.2 fail-closed discipline: audit_cross_sheet()
  refuses to run a research_preview pack in production mode. The audit
  function exists and works, but the production gate requires status=production.

  Design trace:
  - LAYER_3_DESIGN.md section 9.1 (5-invariant scope for v1.11.0)
  - LAYER_3_DESIGN.md section 12 Q2 resolution (two-tier flag severity:
    warning if value outside declared tool range but within Bethlehem
    +/-10%; error if outside both)
  - Each tool has its own cutoff philosophy (NeuroQuant 5th percentile,
    NeuroReader 25th percentile, icometrix percentile-reporting without
    fixed cutoff) -- these are deliberately encoded as different ranges
    rather than a uniform threshold.

