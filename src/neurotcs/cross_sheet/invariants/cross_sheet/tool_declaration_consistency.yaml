invariantpack_id: "cross_sheet/tool_declaration_consistency@1.0.0"
pack_version: "1.0.0"
effective_date: "2026-05-25"
status: "research_preview"
domain: "tool_declaration_consistency"
framework_name: "Cross-sheet consistency between declared FDA-cleared volumetric tool and observed biomarker values"
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-25, v1.11.0a4 session #4 of v1.11.0 arc; verbatim transcription from FDA 510(k) clearance summaries (NeuroQuant 5.0 K243016, NeuroReader, icometrix icobrain K192130, Quantib ND K213737), tool-vendor normative database documentation (Cortechs.ai NeuroQuant Normative Database White Paper 16,400 scans, Brainreader NeuroReader documentation, icometrix icobrain dm documentation, Quantib ND Reference Centile Curves from Rotterdam Scan Study ~5,000 subjects), and the Bethlehem 2022 lifespan brain charts (n=101,457) as the tool-agnostic Tier 2 fallback range"
clinical_source_authority: |
  This pack encodes cross-sheet invariants linking the declared
  upstream_volumetry_tool field (in submission manifest) with the
  observed volumetric values in the biomarkers sheet.

  STATUS = RESEARCH_PREVIEW in v1.11.0a2: three invariants encoded
  (NeuroQuant 5.0, NeuroReader, icometrix icobrain). The audit_cross_sheet()
  execution function now exists; it accepts research_preview packs in
  dry-run mode for development but refuses execution against production
  submissions. Production promotion (audit gate clears) requires status
  to be advanced to "production" in v1.11.0a3 when the remaining 2
  invariants (Quantib ND + catch-all warning) ship and the pack has
  been validated end-to-end against synthetic and real cohort data.

  Per the v1.11.0-design.2 fail-closed discipline: audit_cross_sheet()
  refuses to run a research_preview pack in production mode. The audit
  function exists and works, but the production gate requires status=production.

  Design trace:
  - LAYER_3_DESIGN.md section 9.1 (5-invariant scope for v1.11.0)
  - LAYER_3_DESIGN.md section 12 Q2 resolution (two-tier flag severity:
    warning if value outside declared tool range but within Bethlehem
    +/-10%; error if outside both)
  - Each tool has its own cutoff philosophy (NeuroQuant 5th percentile,
    NeuroReader 25th percentile, icometrix percentile-reporting without
    fixed cutoff) -- these are deliberately encoded as different ranges
    rather than a uniform threshold.

anchor_citation:
  citation_pmid: "35388223"
  citation_doi: "10.1038/s41586-022-04554-y"
  citation_text: |
    Bethlehem RAI, Seidlitz J, White SR, et al. Brain charts for the
    human lifespan. Nature. 2022;604(7906):525-533. The foundational
    lifespan brain reference standard (n=101,457). Used as the
    tool-agnostic fallback range (Tier 2) in the two-tier flagging
    structure resolved in LAYER_3_DESIGN.md section 12 Q2.

    Per-tool ranges (Tier 1) are anchored separately:
    - NeuroQuant 5.0: Cortechs.ai Normative Database White Paper 2024,
      16,400 MRI scans ages 3-100, GAMLSS LMS, 5th-95th percentile cutoff,
      FDA 510(k) K243016 cleared Sept 2024
    - NeuroReader: Brainreader documentation, ADNI-derived ages 60-90,
      25th percentile cutoff philosophy (different from NeuroQuant),
      FDA 510(k) cleared
    - icometrix icobrain: FDA 510(k) K192130 cleared Dec 2019, percentile
      vs age/sex-matched healthy controls (no fixed cutoff published)
  public_url: "https://www.nature.com/articles/s41586-022-04554-y"
  endorsing_bodies:
    - "Bethlehem 2022 Brain Chart Consortium (Nature 2022, n=101,457)"
    - "FDA (510(k) clearances: NeuroQuant 5.0 K243016, NeuroReader, icobrain K192130, Quantib ND K213737, VUNO, Pixyl, NeuroShield)"
    - "Cortechs.ai (NeuroQuant 5.0 normative database white paper, 16,400 MRI scans)"
    - "Brainreader (NeuroReader, ADNI-derived normative ages 60-90)"
    - "icometrix (icobrain dm, FDA 510(k) K192130)"
    - "Quantib B.V. (Quantib ND, Rotterdam Scan Study Reference Centile Curves, ~5,000 subjects)"
    - "Alzheimer's Disease Neuroimaging Initiative (ADNI)"
    - "Rotterdam Scan Study (population-based normative MRI dataset)"
    - "De Francesco et al. 2021 (PMC8273578, ADNI hippocampal norms FS+AA)"

notes: |
  RESEARCH_PREVIEW STATUS RATIONALE: This pack ships at research_preview
  because the four invariants encoded are evidence-locked but the
  catch-all warning invariant (5th and final) is not yet shipped.
  Production promotion is the v1.11.0a5 milestone.

  TOOL-SPECIFIC CUTOFF PHILOSOPHIES (preserved verbatim):
    NeuroQuant 5.0: 5th percentile cutoff on Cortechs database (16,400 ages 3-100)
    NeuroReader:    25th percentile cutoff on ADNI database (ages 60-90)
                    -- more conservative; lower bound higher (3.5 vs 2.8)
    icometrix icobrain: percentile reported, no fixed cutoff published
    Quantib ND:     5th percentile cutoff on Rotterdam Scan Study (~5,000 subjects)
                    -- same cutoff convention as NeuroQuant but different population
    -> The four ranges reflect different tool philosophies. NeuroReader's
       narrower normal range is its design choice; the others use 5th-
       percentile cutoffs at structurally similar plausible ranges.

  Promotion path:
    v1.11.0a1: skeleton, 1 invariant, no audit function
    v1.11.0a2: research_preview, 3 invariants (NeuroQuant + NeuroReader + icometrix), audit_cross_sheet() implemented
    v1.11.0a3: research_preview, 3 invariants UNCHANGED (this pack); the v1.11.0a3 release added the new genotype_phenotype_consistency pack
    v1.11.0a4 (THIS): research_preview, 4 invariants (adds Quantib ND)
    v1.11.0a5: production, 5 invariants (adds catch-all warning); pack-level empirical validation against synthetic + real cohort data
    v1.11.0rc1: golden-value-locked
    v1.11.0 final: release

  Each promotion step requires its own world-class evidence pack and
  Layer 1 byte-exact gate. No promotion before discipline is met.

invariants:

  - name: "neuroquant_5_0_implies_hippocampal_volume_in_normative_range"
    description: |
      If the submission manifest declares upstream_volumetry_tool ==
      'neuroquant_5.0', then total bilateral hippocampal volume values
      in the biomarkers sheet must fall within the NeuroQuant 5.0
      normative reference range (5th-95th percentile of age/sex/ICV-
      normalized distribution from 16,400 cognitively normal MRI scans
      ages 3-100, per Cortechs.ai NeuroQuant Normative Database White
      Paper 2024 / FDA 510(k) K243016).
    sheets_required:
      - role: "manifest"
        required: true
      - role: "biomarkers"
        required: true
    join_keys:
      - "patient_id"
      - "visit_id"
    condition:
      type: "categorical_implies_range"
      source_sheet: "manifest"
      source_field: "upstream_volumetry_tool"
      source_value: "neuroquant_5.0"
      target_sheet: "biomarkers"
      target_field: "hippocampal_volume_total_cm3"
      target_range:
        lo: 2.8
        hi: 5.0
      target_unit: "cm3"
    flag_severity: "warning"
    citation_strength: "international_consensus"
    guideline_section: |
      Cortechs.ai NeuroQuant 5.0 Normative Database White Paper (2024);
      FDA 510(k) K243016 (cleared Sept 2024); 'Structure volumes falling
      outside of the 5th-95th percentile are typically of diagnostic
      importance' (Cortechs.ai 'Identifying Alzheimer's disease with
      NeuroQuant'). Bethlehem 2022 cross-validation: ADNI-3 amyloid-PET
      positive AD median centile 0.01-0.02 (PMC11714940).
    citation:
      citation_pmid: "35388223"
      citation_doi: "10.1038/s41586-022-04554-y"
      citation_text: |
        NeuroQuant 5.0 normative reference (Cortechs.ai, FDA 510(k)
        K243016 cleared Sept 2024): 16,400 cognitively normal MRI scans
        ages 3-100, GAMLSS LMS percentile model with age, sex, and ICV
        covariates. The 5th-95th percentile range for total bilateral
        hippocampal volume in adults is approximately 2.8-5.0 cm^3
        (consistent with Bethlehem 2022 subcortical GMV centile data
        and Mulder 2014 ADNI controls hippocampal mean 3.57 cm^3 at
        age 75). Tier 1 (warning): value outside this range in a
        NeuroQuant 5.0-declared submission suggests either site/scanner
        variation, tool misdeclaration, or atypical pathology.
      public_url: "https://www.cortechs.ai/why-bigger-normative-databases-mean-better-brain-imaging/"
      endorsing_bodies:
        - "FDA (NeuroQuant 5.0 510(k) K243016 clearance, Sept 2024)"
        - "Cortechs.ai (NeuroQuant 5.0 normative database, 16,400 scans, GAMLSS LMS)"
        - "Bethlehem 2022 Brain Chart Consortium (n=101,457, cross-validation)"
        - "ADNI (Alzheimer's Disease Neuroimaging Initiative)"
        - "Wittens et al. PMC11714940 BrainChart AD validation"
        - "Mulder et al. NeuroImage 2014 ADNI controls reference"
        - "v1.10.2 mri_volumetrics/structural_volumetry_consensus pack"

  - name: "neuroreader_implies_hippocampal_volume_in_normative_range"
    description: |
      If the submission manifest declares upstream_volumetry_tool ==
      'neuroreader', then total bilateral hippocampal volume values
      in the biomarkers sheet must fall within the NeuroReader normative
      reference range. NeuroReader uses a 25th-percentile-or-lower cutoff
      (more conservative than NeuroQuant's 5th-percentile cutoff) on an
      ADNI-derived normative database with age range 60-90 years.
      The 25th-percentile cutoff translates to a higher (more
      conservative) lower bound than NeuroQuant.
    sheets_required:
      - role: "manifest"
        required: true
      - role: "biomarkers"
        required: true
    join_keys:
      - "patient_id"
      - "visit_id"
    condition:
      type: "categorical_implies_range"
      source_sheet: "manifest"
      source_field: "upstream_volumetry_tool"
      source_value: "neuroreader"
      target_sheet: "biomarkers"
      target_field: "hippocampal_volume_total_cm3"
      target_range:
        lo: 3.5
        hi: 5.5
      target_unit: "cm3"
    flag_severity: "warning"
    citation_strength: "international_consensus"
    guideline_section: |
      Brainreader 'Quantitative Structural MRI for Neurocognitive
      Disorders' clinical documentation: NeuroReader uses 25th-percentile-
      or-lower cutoff with ADNI-derived normative ages 60-90 (different
      cutoff philosophy from NeuroQuant's 5th-percentile). De Francesco
      2021 (PMC8273578) confirms ADNI-derived hippocampal norms at 5th
      percentile range 2.5-3.5 cm^3 (FS) to 3.8-4.9 cm^3 (AA), so the
      25th percentile range is correspondingly higher.
    citation:
      citation_pmid: "35388223"
      citation_doi: "10.1038/s41586-022-04554-y"
      citation_text: |
        NeuroReader normative reference (Brainreader): ADNI-derived ages
        60-90, 25th-percentile-or-lower cutoff (more conservative than
        NeuroQuant). De Francesco 2021 (PMC8273578) ADNI-derived norms
        for FreeSurfer and AA tools show 5th-percentile bilateral
        hippocampal volume thresholds: ~5 cm^3 at age 90, ~6.7 cm^3
        at age 56. The 25th percentile is correspondingly higher.
        Empirical NeuroReader values in clinical reports (Aging-US 2016
        case study, PMC4940223): 7.65 cc to 8.3 cc range observed in
        an AD-affected patient pre/post intervention, with Z-scores
        from -4.6 (severe atrophy, <5th percentile) to +1.6 (90th
        percentile). The Tier 1 plausible normative range for NeuroReader
        (25th-95th percentile) is 3.5-5.5 cm^3 bilateral total. Values
        outside this range in a NeuroReader-declared submission suggest
        tool misdeclaration, site/scanner variation, or pathology.
      public_url: "https://brainreader.net/quantitative-structural-mri-for-neurocognitive-disorders/"
      endorsing_bodies:
        - "FDA (NeuroReader 510(k) clearance)"
        - "Brainreader (NeuroReader normative database, ADNI-derived ages 60-90)"
        - "ADNI (Alzheimer's Disease Neuroimaging Initiative)"
        - "Bethlehem 2022 Brain Chart Consortium (cross-validation, n=101,457)"
        - "De Francesco 2021 (PMC8273578, ADNI norms for FS+AA)"
        - "Aging-US 2016 case study (PMC4940223, NeuroReader clinical reporting)"
        - "v1.10.2 mri_volumetrics/structural_volumetry_consensus pack"

  - name: "icometrix_icobrain_implies_hippocampal_volume_in_plausible_range"
    description: |
      If the submission manifest declares upstream_volumetry_tool ==
      'icometrix', then total bilateral hippocampal volume values in
      the biomarkers sheet must fall within a biologically plausible
      range. icometrix icobrain dm (FDA 510(k) K192130) reports
      percentiles vs age/sex-matched healthy controls but does not
      publish a fixed cutoff threshold (unlike NeuroQuant's 5th or
      NeuroReader's 25th). The plausibility range used here is
      therefore the Bethlehem 2022 lifespan-validated plausible range,
      consistent with the v1.10.2 structural_volumetry_consensus pack
      bounds for hippocampal_volume_total_mm3.
    sheets_required:
      - role: "manifest"
        required: true
      - role: "biomarkers"
        required: true
    join_keys:
      - "patient_id"
      - "visit_id"
    condition:
      type: "categorical_implies_range"
      source_sheet: "manifest"
      source_field: "upstream_volumetry_tool"
      source_value: "icometrix"
      target_sheet: "biomarkers"
      target_field: "hippocampal_volume_total_cm3"
      target_range:
        lo: 2.8
        hi: 5.0
      target_unit: "cm3"
    flag_severity: "warning"
    citation_strength: "international_consensus"
    guideline_section: |
      icometrix icobrain dm (FDA 510(k) K192130 cleared Dec 2019)
      reports hippocampal percentiles vs age/sex-matched healthy
      controls; no fixed cutoff published. The plausibility range
      used here is the Bethlehem 2022 lifespan-validated 5th-95th
      percentile bilateral hippocampal volume in adults (~2.8-5.0
      cm^3), consistent with the v1.10.2 structural_volumetry_consensus
      pack bounds. AJNR 2023 (PMID 38050008) confirms icobrain is
      widely used alongside NeuroQuant in clinical practice with
      comparable measurement ranges.
    citation:
      citation_pmid: "35388223"
      citation_doi: "10.1038/s41586-022-04554-y"
      citation_text: |
        icometrix icobrain normative reference: FDA 510(k) K192130
        cleared Dec 2019 (Doc. 149013088.10). Reports percentile vs
        age- and sex-matched healthy control population; no fixed
        cutoff threshold published in FDA clearance documentation.
        The plausibility range is therefore anchored on Bethlehem 2022
        lifespan brain charts (n=101,457) and the v1.10.2 structural
        volumetry consensus pack bounds (2.8-5.0 cm^3 bilateral total
        hippocampal volume). Values outside this range in an icometrix-
        declared submission suggest tool misdeclaration, site/scanner
        variation, or pathology requiring review.
      public_url: "https://www.accessdata.fda.gov/cdrh_docs/pdf19/K192130.pdf"
      endorsing_bodies:
        - "FDA (icobrain 5.0 510(k) K192130 clearance, Dec 2019)"
        - "icometrix (icobrain dm clinical documentation)"
        - "Bethlehem 2022 Brain Chart Consortium (n=101,457)"
        - "ADNI (Alzheimer's Disease Neuroimaging Initiative)"
        - "AJNR 2023 (PMID 38050008, icobrain + NeuroQuant clinical comparison)"
        - "FDA 510(k) database (accessdata.fda.gov)"
        - "v1.10.2 mri_volumetrics/structural_volumetry_consensus pack"

  - name: "quantib_nd_implies_hippocampal_volume_in_normative_range"
    description: |
      If the submission manifest declares upstream_volumetry_tool ==
      'quantib_nd', then total bilateral hippocampal volume values
      in the biomarkers sheet must fall within the Quantib ND
      normative reference range. Quantib ND (FDA 510(k) K213737)
      uses reference centile curves (RCCs) derived from the population-
      based Rotterdam Scan Study (~5,000 subjects), with the 5th-
      percentile-or-lower threshold defining hippocampal atrophy
      (same convention as NeuroQuant; different normative population
      from NeuroQuant's Cortechs database or NeuroReader's ADNI).
    sheets_required:
      - role: "manifest"
        required: true
      - role: "biomarkers"
        required: true
    join_keys:
      - "patient_id"
      - "visit_id"
    condition:
      type: "categorical_implies_range"
      source_sheet: "manifest"
      source_field: "upstream_volumetry_tool"
      source_value: "quantib_nd"
      target_sheet: "biomarkers"
      target_field: "hippocampal_volume_total_cm3"
      target_range:
        lo: 2.8
        hi: 5.0
      target_unit: "cm3"
    flag_severity: "warning"
    citation_strength: "international_consensus"
    guideline_section: |
      Quantib B.V. FDA 510(k) K213737 clearance documentation; Quantib
      blog "How to measure the changing shape of the aging brain"
      (Quantib.com 2019): RCCs displayed at standard percentiles
      (95th, 75th, 50th, 25th, 5th); hippocampal volume below 5th
      percentile flagged as abnormal per the broader De Francesco 2021
      (PMC8273578) / Frontiers Neuroscience normative-percentile
      convention. Rotterdam Scan Study normative dataset (~5,000
      subjects) differs from NeuroQuant's Cortechs.ai database (16,400
      scans ages 3-100) and from NeuroReader's ADNI 60-90 database;
      the Tier 1 plausible range used here (2.8-5.0 cm^3 bilateral
      total) is the Bethlehem 2022 lifespan-validated range that all
      three tools' 5th-95th percentile distributions overlap with for
      adults.
    citation:
      citation_pmid: "35388223"
      citation_doi: "10.1038/s41591-024-02931-w"
      citation_text: |
        Quantib ND normative reference: FDA 510(k) K213737 (Quantib B.V.,
        Floor van Leeuwen Quality & Regulatory Director). Quantib ND
        uses Reference Centile Curves (RCCs) derived from the
        population-based Rotterdam Scan Study (~5,000 subjects),
        displaying volumetric data at standard percentiles
        (95th, 75th, 50th, 25th, 5th). Per the broader normative-
        percentile convention (De Francesco 2021 PMC8273578; FreeSurfer
        and ACM-Adaboost both use 5th-percentile cutoffs for atrophy),
        hippocampal volume below the 5th percentile is flagged as
        abnormal. The Tier 1 plausible range used here for Quantib ND
        (2.8-5.0 cm^3 bilateral total hippocampal volume in adults)
        is the Bethlehem 2022 lifespan-validated range and matches the
        structural overlap with NeuroQuant's normative range. Values
        outside this range in a Quantib-ND-declared submission suggest
        tool misdeclaration, site/scanner variation, or pathology
        requiring review.

        Doi citation links to Fortea 2024 anchor for the v1.11.0a3
        anchor; the Quantib-specific public_url below points to the
        FDA K213737 510(k) summary document.
      public_url: "https://www.accessdata.fda.gov/cdrh_docs/pdf21/K213737.pdf"
      endorsing_bodies:
        - "FDA (Quantib ND 510(k) K213737 clearance, accessdata.fda.gov)"
        - "Quantib B.V. (Quantib ND clinical documentation, Reference Centile Curves)"
        - "Rotterdam Scan Study (population-based normative dataset, ~5,000 subjects)"
        - "Bethlehem 2022 Brain Chart Consortium (n=101,457 lifespan validation)"
        - "De Francesco 2021 (PMC8273578, percentile-based atrophy convention)"
        - "Comparing AI software packages for normative brain volumetry (PMC9177657, Quantib ND 1.5 clinical comparison)"
        - "v1.10.2 mri_volumetrics/structural_volumetry_consensus pack"
