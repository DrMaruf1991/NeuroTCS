status: "skeleton"
domain: "tool_declaration_consistency"
framework_name: "Cross-sheet consistency between declared FDA-cleared volumetric tool and observed biomarker values"
transcribed_by: "Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-25, v1.11.0a1 session #1 of rc1 arc; verbatim transcription from FDA 510(k) clearance summaries and tool-vendor normative database documentation"
clinical_source_authority: |
  This pack encodes cross-sheet invariants linking the declared
  upstream_volumetry_tool field (in submission manifest, established by
  the v1.10.2 mri_volumetrics/structural_volumetry_consensus production
  pack) with the observed volumetric values in the biomarkers sheet.

  STATUS = SKELETON in v1.11.0a1: only the NeuroQuant 5.0 hippocampus
  invariant is encoded (1 of 5 planned per LAYER_3_DESIGN.md section 9.1).
  The pack will be promoted to production in rc1 session #3 when all 5
  invariants ship and the audit_cross_sheet() execution function exists.

  Per the v1.11.0-design.2 fail-closed discipline, audit_cross_sheet()
  refuses to run a skeleton pack. The pack loads, validates, and can be
  inspected, but cannot emit audit flags until promoted to production.

  Design trace:
  - LAYER_3_DESIGN.md section 9.1 (5-invariant scope for v1.11.0)
  - LAYER_3_DESIGN.md section 12 Q2 resolution (two-tier flag severity:
    warning if outside tool range but within Bethlehem +/-10%, error if
    outside both)
  - Note: the two-tier flagging is structural; in this skeleton release
    only the inner Tier 1 (warning) range is encoded. Tier 2 (error)
    is the wider Bethlehem +/-10% range from Layer 2; the audit function
    in session #2+ will compose both checks.

anchor_citation:
  citation_pmid: "35388223"
  citation_doi: "10.1038/s41586-022-04554-y"
  citation_text: |
    Bethlehem RAI, Seidlitz J, White SR, et al. Brain charts for the
    human lifespan. Nature. 2022;604(7906):525-533. The foundational
    lifespan brain reference standard (n=101,457). Used as the
