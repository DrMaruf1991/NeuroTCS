framework_name: Layer-3 longitudinal-monotonicity AUDIT invariants for the new biomarker classes added
  in v1.30-v1.33 (OCT retinal layers, SV2A synaptic density, ASL CBF, DTI fornix microstructure, p-tau217
  in CSF and plasma) and v0.2.0 (v1.36.0) extends to astrocyte reactivity (plasma/CSF GFAP) and axonal
  damage (plasma/CSF NfL). NeuroTCS does NOT measure or compute these biomarkers; it AUDITS whether tool-produced
  longitudinal series match the published directional consensus for each biomarker in untreated AD natural
  history. Mirrors the existing production ad_clinical_coherence pack's hippocampal_volume_must_not_increase
  and amyloid_centiloid_must_not_spontaneously_clear pattern.
transcribed_by: 'Salokhiddinov M, MD PhD (KIUT), 2026-05-29. v0.1.0 (v1.35.0) shipped 9 invariants on
  OCT, SV2A, ASL, DTI, p-tau217 classes. v0.2.0 (v1.36.0) extends with 4 GFAP/NfL invariants: plasma and
  CSF GFAP rise as astrocyte reactivity progresses (Benedet 2021 JAMA Neurol DOI 10.1001/jamaneurol.2021.3671);
  plasma and CSF NfL rise with axonal damage in neurodegeneration (Mattsson 2017 JAMA Neurol DOI 10.1001/jamaneurol.2016.6117).
  All 4 are treatment-gated since anti-amyloid therapy attenuates these markers in TRAILBLAZER-ALZ 2 /
  Clarity AD biomarker substudies (GFAP reduction documented; NfL effects more modest but present).'
clinical_source_authority: |-
  This pack encodes Layer-3 LONGITUDINAL-SHAPE invariants for the new biomarker classes. Critically: NeuroTCS does not measure biomarkers, segment images, or compute derived values -- it only AUDITS the shape of trajectories that an upstream pipeline (FreeSurfer, OCT segmentation, PET kinetic modeling, ASL CBF quantification, DTI tractography, Simoa/Lumipulse immunoassay) produced.

  Each invariant asks: 'does this per-patient series follow the published directional consensus for this biomarker?' The audit FLAGS deviations for human review; it does not diagnose, treat, or interpret -- consistent with NeuroTCS's four enforced load-bearing properties (deterministic audit_id, citation-locked flags, fail-closed, scope-honest coverage manifest).

  RESEARCH PREVIEW: matches the research_preview status of most underlying range packs (OCT, SV2A, ASL, DTI) and the still-emerging tolerance literature; promotion to production deferred until cohort-stratified scan-rescan/test-retest data calibrates the tolerance values empirically per the v1.11.0a3 discipline. flag_severity=warning (not error): biomarker direction is biologically clear, but cohort-specific noise calibration is pending.
anchor_citation:
  citation_pmid: '38934362'
  citation_doi: 10.1002/alz.13859
  citation_text: 'Jack CR Jr et al. Revised criteria for diagnosis and staging of Alzheimer''s disease:
    Alzheimer''s Association Workgroup. Alz & Dem 2024;20(8):5143-5169 (PMID 38934362). The AA-2024 framework
    establishes that AD biomarker classes follow stereotyped longitudinal directions in untreated natural
    history (A->T2->N->C ordering plus neurodegeneration progression). The 8 invariants in this pack encode
    the published directional consensus for each of the v1.30-v1.33 new biomarker classes.'
  public_url: https://alz-journals.onlinelibrary.wiley.com/doi/10.1002/alz.13859
  endorsing_bodies:
  - Alzheimer's Association 2024 Workgroup (Jack 2024)
  - Mutlu 2018 (OCT, Rotterdam Study)
  - Chen 2018 + Mecca 2020 (SV2A UCB-J)
  - Alsop 2015 (ASL ISMRM/ASLid consensus)
  - Acosta-Cabronero 2012 (DTI biomarkers in AD)
invariants:
- name: rnfl_peripapillary_thickness_must_not_increase_over_follow_up
  description: AUDITS whether a tool-produced longitudinal series of rnfl_peripapillary_thickness_um matches
    the published directional consensus for this biomarker in untreated AD. NeuroTCS does NOT measure
    rnfl_peripapillary_thickness_um; it only audits the shape of the trajectory an upstream pipeline produced.
    Peripapillary RNFL undergoes progressive thinning in the AD continuum (Mutlu 2018 Rotterdam Study);
    retinal nerve fiber layer degeneration is biologically irreversible (no regeneration therapy exists
    in 2026). A submitted RNFL series that INCREASES by more than 3 um (Cirrus HD-OCT scan-rescan reproducibility
    per Cirrus normative database; conservative tolerance) is implausible -- likely a segmentation error,
    swapped visit_id, or scanner switch.
  sheets_required:
  - role: biomarkers
    required: true
  join_keys:
  - patient_id
  condition:
    type: trajectory_monotonicity
    series_sheet: biomarkers
    patient_key: patient_id
    order_field: visit_id
    value_field: rnfl_peripapillary_thickness_um
    direction: non_increasing
    tolerance: 3.0
    min_visits: 2
  flag_severity: warning
  citation_strength: derived
  guideline_section: 'Mutlu 2018 (JAMA Neurol PMID 29946702): inner retinal layers undergo progressive
    thinning prospectively associated with incident dementia. Retinal layer thinning does not reverse.
    Tolerance 3 um per Cirrus HD-OCT scan-rescan reproducibility.'
  citation:
    citation_text: 'Mutlu U et al. Association of Retinal Neurodegeneration on Optical Coherence Tomography
      With Dementia: A Population-Based Study. JAMA Neurol 2018;75(10):1256-1263 (PMID 29946702). Inner
      retinal layer thinning is progressive in AD continuum; no biological mechanism for reversal exists
      in 2026. Tolerance 3 um is the typical Cirrus HD-OCT scan-rescan reproducibility (~3-4%% CoV on
      ~85 um RNFL).'
    public_url: https://pubmed.ncbi.nlm.nih.gov/29946702/
    endorsing_bodies:
    - Rotterdam Study
    - Mutlu 2018 JAMA Neurol
    - Cirrus HD-OCT normative database
    citation_pmid: '29946702'
    citation_doi: 10.1001/jamaneurol.2018.1563
