- name: csf_ptau217_must_not_spontaneously_decrease_untreated
  description: AUDITS whether a tool-produced longitudinal series of csf_ptau217_pgml matches the published
    directional consensus for this biomarker in untreated AD. NeuroTCS does NOT measure csf_ptau217_pgml;
    it only audits the shape of the trajectory an upstream pipeline produced. CSF p-tau217 increases progressively
    along the AD continuum (Jack 2024 AA-2024 Core 1 T1 marker). In the absence of recorded anti-amyloid
    therapy, a CSF p-tau217 series that DECREASES by more than 50 pg/mL is implausible. The treatment_gate_field
    exempts legitimate on-treatment reductions (TRAILBLAZER-ALZ 2, Clarity AD biomarker substudies documented
    p-tau217 reductions under lecanemab/donanemab). Tolerance 50 pg/mL is conservative on a typical elevated
    AD-range value of ~250-1000 pg/mL (~5-20%% noise).
