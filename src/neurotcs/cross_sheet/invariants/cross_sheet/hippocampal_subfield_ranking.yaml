notes: 'Ranking is deterministic: value_fields sorted by descending value, ties broken by field name ascending,
  so flag_id is reproducible. Rows missing any value_field are skipped (missingness is an input-contract
  concern). Must not be promoted to production until validated against empirical false-positive rates
  on real and synthetic cohorts, consistent with the genotype_phenotype_consistency promotion discipline.'
