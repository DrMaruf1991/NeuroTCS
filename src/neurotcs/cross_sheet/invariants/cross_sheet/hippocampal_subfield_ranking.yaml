status: research_preview
domain: hippocampal_subfield_rank_consistency
framework_name: 'Cross-sheet hippocampal-subfield rank-order consistency (research_preview) - ENIGMA subregion
  ranking-violation QC rules (Saemann 2022) applied to externally-measured FreeSurfer subfield volumes.
  Ships research_preview: single-consortium QC heuristic, not international_consensus; audit_cross_sheet
  refuses it outside dry_run.'
transcribed_by: Salokhiddinov M, MD PhD (KIUT, Uzbekistan), 2026-05-29. Verbatim rule transcription from
  Saemann PG, Iglesias JE et al. Human Brain Mapping 2022;43(1):207-233 (DOI 10.1002/hbm.25326), ENIGMA
  hippocampal-subfields QC protocol, Section 2.3 ranking-violation rules derived from N=626 subjects.
clinical_source_authority: |-
  This pack encodes the ENIGMA hippocampal-subfield ranking-violation QC rules as cross-sheet invariants over the biomarkers sheet. The subregion volume rank order is highly robust across scanners and samples (Saemann 2022, Figure 2a), so a violation flags likely segmentation error in the upstream measurement tool.

  Ranking set: the 11 tissue subfields per hemisphere (CA1, CA3, CA4, subiculum, presubiculum, parasubiculum, molecular layer HP, GC-ML-DG, HATA, fimbria, hippocampal tail). The hippocampal fissure is excluded from the ranking because it is a CSF cleft, not hippocampal tissue.

  Rules (Saemann 2022, N=626):
   - CA1 must be rank #1 (largest). DISABLED by default, matching ENIGMA (oversensitive in large samples).
   - Hippocampal tail must not rank below #3 (rank <= 3).
   - Subiculum must rank #4.

  STATUS = research_preview: this is a single-consortium QC heuristic, not an international_consensus rule with >=5 endorsing bodies. audit_cross_sheet() refuses a research_preview pack unless dry_run=True. NeuroTCS never measures or segments subfields; it audits the rank order of values another tool produced.

  Companion: mri_volumetrics/hippocampal_subfields_research_preview (Layer 2 per-subfield plausibility envelopes). This Layer 3 pack adds the cross-subfield ordering check that per-field bounds cannot express.
