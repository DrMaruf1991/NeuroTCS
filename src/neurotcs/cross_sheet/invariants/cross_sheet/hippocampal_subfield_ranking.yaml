    studies and other collaborative efforts. Human Brain Mapping 2022;43(1):207-233 (DOI 10.1002/hbm.25326).
    The ENIGMA hippocampal-subfields QC protocol.'
  public_url: https://doi.org/10.1002/hbm.25326
  endorsing_bodies:
  - ENIGMA Hippocampal Subfields Working Group
  - Saemann 2022 (Human Brain Mapping)
  - FreeSurfer hippocampal-subfield module (Iglesias 2015)
invariants:
- name: left_hippocampal_subfield_rank_order_enigma
  description: 'Left hippocampal subfield volumes must follow the ENIGMA-validated subregion rank order
    (Saemann 2022, N=626): the hippocampal tail must not rank below #3 by volume, and the subiculum must
    rank #4. A violation indicates likely segmentation error in the upstream tool. The ''CA1 is largest''
    rule (rank #1) is included but disabled by default, mirroring ENIGMA (oversensitive in large samples).
    NeuroTCS does not measure subfields; it audits the rank order of values another tool produced.'
  sheets_required:
  - role: biomarkers
    required: true
  join_keys:
  - patient_id
  - visit_id
  condition:
    type: subfield_rank_constraint
    sheet: biomarkers
    value_fields:
    - ca1_volume_left_mm3
    - ca3_volume_left_mm3
    - ca4_volume_left_mm3
    - subiculum_volume_left_mm3
    - presubiculum_volume_left_mm3
    - parasubiculum_volume_left_mm3
    - molecular_layer_hp_volume_left_mm3
    - gc_ml_dg_volume_left_mm3
    - hata_volume_left_mm3
    - fimbria_volume_left_mm3
    - hippocampal_tail_volume_left_mm3
    rules:
    - field: ca1_volume_left_mm3
      operator: eq
      rank: 1
      enabled: false
    - field: hippocampal_tail_volume_left_mm3
      operator: le
      rank: 3
      enabled: true
    - field: subiculum_volume_left_mm3
      operator: eq
      rank: 4
      enabled: true
  flag_severity: warning
  citation_strength: derived
  guideline_section: 'Saemann PG, Iglesias JE et al. Human Brain Mapping 2022;43(1):207-233, Section 2.3
    ranking-violation QC rules (N=626): CA1 rank #1 (optional), hippocampal tail not below rank #3, subiculum
    rank #4.'
