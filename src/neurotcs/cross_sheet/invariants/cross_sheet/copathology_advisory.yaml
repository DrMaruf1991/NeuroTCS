invariants:
- name: t2n_mismatch_copathology_advisory
  description: "T2N mismatch (Jack 2024 Sec 8): a subject who is amyloid-positive (A+) but tau-negative (T2-) while neurodegeneration is present (N+) departs from the canonical A+ -> T2+ -> N+ sequence; the neurodegeneration likely reflects non-AD copathology (LATE / vascular / alpha-synuclein). Informational advisory only -- the subject still has AD by the Core 1 criterion (Sec 3). NeuroTCS audits the recorded status values; it does not measure the biomarkers."
  sheets_required:
  - role: biomarkers
    required: true
  join_keys:
  - patient_id
  - visit_id
  condition:
    type: rowwise_conjunction_advisory
    sheet: biomarkers
    predicates:
    - field: amyloid_status
      operator: eq
      value: positive
    - field: tau_status
      operator: eq
      value: negative
    - field: neurodegeneration_status
      operator: eq
      value: present
    advisory_message: "T2N mismatch (Jack 2024 Sec 8): amyloid-positive with tau-negative but neurodegeneration present. The subject has AD (Core 1 positive, Sec 3) but the neurodegeneration is not explained by AD tauopathy and likely reflects non-AD copathology (LATE / vascular / alpha-synuclein). Advisory only; no recorded value is contradicted."
  flag_severity: info
  citation_strength: international_consensus
  guideline_section: "Jack 2024 Section 8 (Figure 2, Copathology and T2N mismatch) + Section 4.3 (A+ to T2+ to N+ stereotypical sequence). Alzheimers Dement 2024;20(8):5143-5169."
  citation:
    citation_doi: 10.1002/alz.13859
    citation_pmid: "38934362"
    citation_text: "Jack CR Jr, et al. Revised criteria for diagnosis and staging of Alzheimer's disease: Alzheimer's Association Workgroup. Alzheimers Dement 2024;20(8):5143-5169. Section 4.3 (verbatim): 'N biomarkers do not always follow a stereotypical A+ to T2+ to N+ sequence. People with abnormal Core 1 biomarker(s), who, by our definition, have AD, may develop significant neurodegeneration owing primarily to copathologies.' Section 8 / Figure 2 illustrates the T2N mismatch (abnormal amyloid PET, unremarkable tau PET insufficient to explain neurodegeneration), attributed to comorbid AD and LATE."
    public_url: https://doi.org/10.1002/alz.13859
    endorsing_bodies:
    - Alzheimer's Association Workgroup (Jack 2024)
    - National Institute on Aging (NIA-AA lineage)
    - Jack 2024 Revised Criteria (PMID 38934362)
