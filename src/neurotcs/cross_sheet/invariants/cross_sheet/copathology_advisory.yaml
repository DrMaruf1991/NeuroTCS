status: "research_preview"
domain: "copathology_advisory"
framework_name: "Cross-sheet copathology ADVISORY pack (Jack 2024 Sec 8): the T2N-mismatch pattern. A subject who is amyloid-positive (A+, qualifies for AD per Jack 2024 Sec 3) but tau-negative (T2-) while showing neurodegeneration (N+) does NOT follow the stereotypical A+ -> T2+ -> N+ sequence; the excess neurodegeneration suggests non-AD copathology (LATE / vascular / alpha-synuclein). This is an INFORMATIONAL advisory, never an error: the subject still has AD by the Core 1 criterion. It is a cross-modal/cross-field row-local conjunction, which is why it lives in a cross-sheet invariant pack rather than the atn_2018 staging-transition pack (where it was deferred)."

transcribed_by: "Salokhiddinov M, MD PhD, ESOR-BRACCO-ESNR Neuroimaging Fellow, Kimyo International University in Tashkent (KIUT), Uzbekistan. v1.53.0 session: builds the T2N-mismatch advisory deferred from atn_2018.yaml (which noted 'Advisory active flagging deferred to a future cross-sheet invariant batch'). The mismatch concept is taken from Jack 2024 PMID 38934362 (open access CC BY-NC-ND 4.0), Section 8 (Figure 2, Copathology and T2N mismatch) and Section 4.3: 'N biomarkers do not always follow a stereotypical A+ to T2+ to N+ sequence. People with abnormal Core 1 biomarker(s), who, by our definition, have AD, may develop significant neurodegeneration owing primarily to copathologies.' Severity is 'info' because the subject remains on the AD continuum (A+ is sufficient for AD per Sec 3); the advisory only notes likely non-AD copathology. Status is research_preview because this is a single-guideline advisory heuristic, not an international_consensus error rule -- audit_cross_sheet() runs it only under dry_run=True."

clinical_source_authority: |
  This pack encodes ONE Layer-3 cross-sheet ADVISORY (severity info) derived
  from Jack 2024 (Revised criteria for diagnosis and staging of Alzheimer's
  disease, Alzheimers Dement 2024;20(8):5143-5169, DOI 10.1002/alz.13859,
  PMID 38934362).

  T2N mismatch (Jack 2024 Section 8, Figure 2; Section 4.3 sequence). The
  canonical AD biomarker sequence is A+ -> T2+ -> N+ (amyloid precedes tau,
  which leads to neurodegeneration). When a subject is amyloid-positive (A+,
  and therefore has AD by the Core 1 criterion of Section 3) but tau-PET
  negative (T2-) while neurodegeneration is present (N+), the neurodegeneration
  is NOT explained by AD tauopathy. Jack 2024 attributes this excess
  neurodegeneration primarily to copathologies (e.g. LATE / limbic-predominant
  age-related TDP-43 encephalopathy, vascular disease, alpha-synuclein). This is
  the A+T2-N+ state the atn_2018 staging pack recognizes but does not flag (it
  is biologically admissible -- A+ qualifies for AD -- so it is not a transition
  error); the COPATHOLOGY signal is a cross-modal row-local property, encoded
  here as an advisory.

  Why info (advisory), not error: per Section 3 a single abnormal Core 1
  biomarker is sufficient to diagnose AD, so an A+ subject genuinely has AD --
  the mismatch does not contradict that. The advisory adds prognostic context
  (likely non-AD copathology), it does not invalidate any recorded value.

  Why research_preview: this is a single-guideline advisory heuristic, not an
  international-consensus error rule with multiple independent endorsing bodies.
  audit_cross_sheet() refuses a research_preview pack unless dry_run=True, so it
  never fires in a default production audit; an operator opts in explicitly.

  NeuroTCS does not measure amyloid, tau, or neurodegeneration. It audits the
  status VALUES another pipeline recorded for a (subject, visit) and notes the
  mismatch pattern. Declarative; no code execution.

  Vocabulary: the invariant reads three categorical status fields -- amyloid
  status, tau status, neurodegeneration status -- using the canonical
  positive/negative/present vocabulary. A row is evaluated only when all three
  are present; rows missing any field are skipped (missingness is the
  input-contract layer's concern, not this advisory's).

