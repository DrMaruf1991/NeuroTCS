notes: 'RESEARCH PREVIEW. info severity - advisory only. v0.2.0 (v1.34.0) extends to PSEN2 and APP with
  gene-specific age windows and baseline rates. Companion to the v1.30.0 monogenic_ad_consensus production
  range pack and to the existing genotype_phenotype_consistency (APOE4) pack. Gene-specific design: PSEN1
  baseline 0.99 / age 60 (near-100%% penetrance); PSEN2 baseline 0.90 / age 80 (variable penetrance, wide
  onset range per Cai 2015); APP baseline 0.99 / age 70 (near-100%% penetrance, mean onset ~8 yr later
  than PSEN1 per DIAN). Empirical false-positive rate calibration deferred until cohort data available.'
