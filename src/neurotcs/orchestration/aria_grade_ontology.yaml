schema_version: "1.0.0"
ontology_id: "imaging_severity/aria_grade@1.0.0"
ontology_version: "1.0.0"
effective_date: "2026-06-01"
status: "research_preview"
domain: "aria_grade"

description: >
  Citation-anchored recognition ontology for Amyloid-Related Imaging
  Abnormalities (ARIA) severity labels. Maps the free-text labels datasets use
  for ARIA findings ("ARIA-E moderate", "moderate edema", "ARIA-H severe",
  "severe superficial siderosis", "no ARIA", ...) to a canonical (type, grade)
  pair on the established four-level scheme {none, mild, moderate, severe} for
  three ARIA finding types: ARIA-E (edema/effusion), ARIA-H microhemorrhage,
  and ARIA-H superficial siderosis.

  This is the RECOGNITION (vocabulary) layer. It is the companion of the
  numeric range pack ad/aria_safety, which audits the underlying numeric values
  (FLAIR size in cm, microhemorrhage count, siderosis focal-area count) against
  the verbatim FDA-label / ASNR grade boundaries. Together they form one ARIA
  capability: this layer recognizes a label and resolves it to a canonical
  (type, grade); the range pack validates a measured value against the
  published cutoffs. This layer does NOT itself assign cutoffs or diagnose --
  it only normalizes how a grade is written.

  Safety properties (same discipline as the disease-control and clinical-label
  ontologies):
  * recognition only -- never invents a grade, never assigns a numeric cutoff;
  * unrecognized labels pass through unchanged (never guess);
  * an ambiguous ontology (a synonym mapping to two different (type, grade)
    pairs) fails closed at load;
  * macrohemorrhage is recognized as its OWN separate finding, NOT folded into
    a mild/moderate/severe ARIA-H tier (a macrohemorrhage, intracerebral
    hemorrhage >1 cm, is a separate disqualifying category, per the FDA labels
    and AURs).

transcribed_by: >
  Salokhiddinov M, MD PhD, ESOR-BRACCO-ESNR Neuroimaging Fellow, Kimyo
  International University in Tashkent (KIUT), Uzbekistan. ARIA recognition
  layer, verify-first. The four-level severity scheme and its type structure
  are anchored to the April 2026 Alzheimer's Association ARIA workgroup update
  (van Etten et al., Alzheimer's Dement 2026;22:e71361), which confirms that
  each ARIA-E, ARIA-H microhemorrhage, and ARIA-H siderosis finding is graded
  mild/moderate/severe per the lecanemab and donanemab FDA labels, and to the
  ASNR consensus (Cogswell 2022). The numeric grade boundaries themselves live
  in the companion range pack ad/aria_safety, sourced verbatim from the FDA
  labels; this layer does not restate them.

canonical_source_authority: |
  ARIA terminology and the mild/moderate/severe grading structure recognized
  here are anchored to:
  - van Etten ES, Mahinrad S, et al. Amyloid-related imaging abnormalities
    (ARIA) in anti-amyloid therapies for Alzheimer's disease: An update from
    the Alzheimer's Association ARIA workgroup. Alzheimer's Dement
    2026;22:e71361 (DOI 10.1002/alz.71361; PMID 42015334). The newest
    (April 2026) consensus. It defines ARIA-E (edema/effusion) and ARIA-H
    (hemorrhage: microhemorrhage and/or superficial siderosis, rarely
    macrohemorrhage), and states that each ARIA-E, ARIA-H microhemorrhage, and
    ARIA-H siderosis is graded mild/moderate/severe per the lecanemab and
    donanemab FDA labels -- i.e., it confirms (does not change) the numeric
    grading scheme. It discourages the term "spontaneous ARIA": ARIA-like
    findings in untreated individuals should be described by the specific
    radiologic finding, not labelled ARIA.
  - Sperling RA, et al. Amyloid-related imaging abnormalities in
    amyloid-modifying therapeutic trials. Alzheimers Dement 2011;7(4):367-385
    (DOI 10.1016/j.jalz.2011.05.2351; PMID 21784348). The foundational paper
    that introduced the ARIA / ARIA-E / ARIA-H terminology (qualitative
    definitions only; it did not publish the numeric cutoffs).
  - Cogswell PM, et al. ASNR detection and reporting recommendations. AJNR Am
    J Neuroradiol 2022;43(9):E19-E35 (DOI 10.3174/ajnr.A7586; PMID 35953274).
    The ASNR consensus reproducing the four-level grading scheme.

  Numeric grade boundaries are intentionally NOT encoded here -- they are in
  the companion range pack ad/aria_safety (verbatim FDA LEQEMBI/KISUNLA labels:
  ARIA-E <5 / 5-10 / >10 cm; microhemorrhage <=4 / 5-9 / >=10; siderosis
  1 / 2 / >2). This layer maps labels to canonical grades; the range pack
  validates measured values.

