# canonical finding types (the "type" half of the (type, grade) pair):
#   aria_e                -> ARIA-E (edema/effusion)
#   aria_h_microhemorrhage-> ARIA-H microhemorrhage
#   aria_h_siderosis      -> ARIA-H superficial siderosis
#   macrohemorrhage       -> separate disqualifying finding (NOT a graded tier)
# canonical grades: none, mild, moderate, severe
# Each group below lists the raw label synonyms that resolve to a (type, grade).

grade_synonyms:
  # generic grade words (used in combination with a recognized type word)
  none: ["none", "no", "negative", "absent", "grade 0", "g0"]
  mild: ["mild", "grade 1", "g1", "mild grade"]
  moderate: ["moderate", "grade 2", "g2", "moderate grade"]
  severe: ["severe", "grade 3", "g3", "severe grade"]

type_synonyms:
  aria_e:
    - "aria-e"
    - "aria e"
    - "ariae"
    - "edema"
    - "oedema"
    - "vasogenic edema"
    - "vasogenic oedema"
    - "effusion"
    - "sulcal effusion"
  aria_h_microhemorrhage:
    - "aria-h microhemorrhage"
    - "aria-h microhaemorrhage"
    - "aria h microhemorrhage"
    - "microhemorrhage"
    - "microhaemorrhage"
    - "microbleed"
    - "cerebral microbleed"
    - "cmb"
  aria_h_siderosis:
    - "aria-h siderosis"
    - "aria h siderosis"
    - "superficial siderosis"
    - "cortical superficial siderosis"
    - "siderosis"
    - "css"
  macrohemorrhage:
    - "macrohemorrhage"
    - "macrohaemorrhage"
    - "intracerebral hemorrhage"
    - "intracerebral haemorrhage"
    - "ich"
    - "lobar hemorrhage"
    - "lobar haemorrhage"

# Fully-spelled canonical labels recognized directly as (type, grade) pairs,
# for datasets that store a single combined string. These are exact,
# unambiguous combinations; partial/free-text strings are resolved by the
# type+grade token logic in the recognizer.
canonical_labels:
  - label: "no aria"
    type: "none"
    grade: "none"
  - label: "aria-e mild"
    type: "aria_e"
    grade: "mild"
  - label: "aria-e moderate"
    type: "aria_e"
    grade: "moderate"
  - label: "aria-e severe"
    type: "aria_e"
    grade: "severe"
  - label: "aria-h microhemorrhage mild"
    type: "aria_h_microhemorrhage"
    grade: "mild"
  - label: "aria-h microhemorrhage moderate"
    type: "aria_h_microhemorrhage"
    grade: "moderate"
  - label: "aria-h microhemorrhage severe"
    type: "aria_h_microhemorrhage"
    grade: "severe"
  - label: "aria-h siderosis mild"
    type: "aria_h_siderosis"
    grade: "mild"
  - label: "aria-h siderosis moderate"
    type: "aria_h_siderosis"
    grade: "moderate"
  - label: "aria-h siderosis severe"
    type: "aria_h_siderosis"
    grade: "severe"
