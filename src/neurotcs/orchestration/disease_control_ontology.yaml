ontology_version: "1.0.0"
effective_date: "2026-06-01"
status: "research_preview"
domain: "disease_control"

description: >
  Citation-anchored recognition ontology for NON-Alzheimer's dementias and
  dementia mimics (disease-control / differential-diagnosis groups). Each group
  maps the raw labels study datasets use ("vascular dementia", "DLB", "Lewy
  body dementia", "bvFTD", ...) to a canonical disease-control category anchored
  to its primary consensus diagnostic-criteria publication. Its purpose is
  SCOPE-HONEST PARTITIONING: a subject whose clinical label is a recognized
  non-AD dementia is flagged as out-of-AD-scope so it is not silently forced
  through the Alzheimer's clinical-stage vocabulary. It NEVER relabels a subject
  to an AD stage, and it never diagnoses -- it only recognizes which published
  non-AD category a label refers to. Unrecognized labels pass through unchanged.

transcribed_by: >
  Salokhiddinov M, MD PhD, ESOR-BRACCO-ESNR Neuroimaging Fellow, Kimyo
  International University in Tashkent (KIUT), Uzbekistan. USIL increment 3: a
  scoped, verify-first disease-control recognition layer. Every category is
  anchored to its primary consensus criteria publication, with DOI/PMID verified
  before encoding (PMIDs confirmed against PubMed/journal pages or a verification
  pass; the single pre-MEDLINE source, Kiloh 1961, is encoded DOI-only because no
  PMID could be verified -- no identifier is fabricated).

canonical_source_authority: |
  Disease-control categories and their primary consensus diagnostic criteria:
  - Vascular cognitive disorders / vascular dementia (VaD/VCI): VasCog-2-WSO
    Criteria Consortium (Sachdev et al.), JAMA Neurol 2025;82(11):1103-1112 (DOI
    10.1001/jamaneurol.2025.3242), which revises and supersedes the 2014 VASCOG
    statement (Sachdev et al., Alzheimer Dis Assoc Disord 2014, DOI
    10.1097/WAD.0000000000000034, retained as legacy). Earlier research criteria:
    NINDS-AIREN (Roman 1993) and the AHA/ASA statement that formalized "VCI"
    (Gorelick 2011).
  - Dementia with Lewy bodies (DLB): McKeith et al., Fourth DLB Consortium
    consensus report, Neurology 2017 (DOI 10.1212/WNL.0000000000004058).
  - Parkinson's disease dementia (PDD): Emre et al., MDS Task Force, Mov Disord
    2007 (DOI 10.1002/mds.21507).
  - Behavioral-variant frontotemporal dementia (bvFTD): Rascovsky et al., Brain
    2011 (DOI 10.1093/brain/awr179).
  - Primary progressive aphasia (PPA): Gorno-Tempini et al., Neurology 2011 (DOI
    10.1212/WNL.0b013e31821103e6).
  - Idiopathic normal pressure hydrocephalus (iNPH): Relkin et al., INPH
    Guidelines Part II, Neurosurgery 2005 (DOI 10.1227/01.neu.0000168185.29659.c5).
  - Traumatic encephalopathy syndrome (TES; clinical syndrome associated with
    TBI/CTE): Katz et al., NINDS consensus criteria, Neurology 2021 (DOI
    10.1212/WNL.0000000000011850).
  - Autoimmune encephalitis (AE): Graus et al., Lancet Neurol 2016 (DOI
    10.1016/S1474-4422(15)00401-9).
  - Mixed dementia: Schneider et al., Neurology 2007 (DOI
    10.1212/01.wnl.0000271090.28148.24) as epidemiologic anchor.
  - Corticobasal degeneration / syndrome (CBD/CBS): Armstrong et al., Neurology
    2013 (DOI 10.1212/WNL.0b013e31827f0fd1).
  - Progressive supranuclear palsy (PSP): Hoglinger et al., MDS-PSP criteria,
    Mov Disord 2017 (DOI 10.1002/mds.26987).
  - Depression-related cognitive impairment ("pseudodementia"): Kiloh, Acta
    Psychiatr Scand 1961 (DOI 10.1111/j.1600-0447.1961.tb07367.x). DOI-only: no
    PMID verified (the article predates routine MEDLINE indexing). The term
    "pseudodementia" is increasingly deprecated in favor of "cognitive
    impairment of depression"; both are recognized here.

  Scope limits encoded by omission:
  - This ontology RECOGNIZES non-AD categories; it does not stage them, grade
    them, or assert a diagnosis. It exists so AD-staging coverage stays honest.
  - It does not map AD clinical-stage labels (CN/MCI/AD) -- that is the separate
    subject_label/ad_clinical_stage ontology -- nor A/T/N biomarker notation.

