[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotcs"
version = "1.6.0"
description = "Citation-locked, fail-closed longitudinal medical AI audit framework (NeuroTCS / temporalmetric)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Marufjon Salokhiddinov, MD PhD", email = "drmaruf1991@gmail.com" },
]
keywords = [
    "medical-ai", "longitudinal", "audit", "clinical-trial", "regulatory",
    "neuroimaging", "alzheimer", "parkinson", "multiple-sclerosis",
    "oncology", "recist", "irecist", "stroke", "fleischner", "fda", "fhir",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "jsonschema>=4.0",
    "pyreadr>=0.4.7",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
]
fhir = [
    "fhir.resources>=7.0",
]

[project.scripts]
neurotcs-audit = "neurotcs.audit_core.cli:main"

[project.urls]
Homepage = "https://github.com/DrMaruf1991/NeuroTCS"
Repository = "https://github.com/DrMaruf1991/NeuroTCS"
Issues = "https://github.com/DrMaruf1991/NeuroTCS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neurotcs.rulepack" = ["rules/**/*.yaml"]
"neurotcs.input_contract.v1_0" = ["schemas/*.json", "SPECIFICATION.md"]
"neurotcs.input_contract.v1_1" = ["schemas/*.json", "SPECIFICATION.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "B905", "B007", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
