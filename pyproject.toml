[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotcs"
version = "1.75.0"
description = "Citation-locked, fail-closed longitudinal medical AI audit framework (NeuroTCS / temporalmetric)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Marufjon Salokhiddinov, MD PhD", email = "drmaruf1991@gmail.com" },
]
keywords = [
    "medical-ai", "longitudinal", "audit", "clinical-trial", "regulatory",
    "neuroimaging", "alzheimer", "alzheimers-disease", "dementia",
    "amyloid", "tau", "cdr", "mci", "fda", "fhir",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "jsonschema>=4.0",
    "numpy>=1.24",
    "scipy>=1.11",
    # Statistical-format readers promoted to core (v1.73.0) so real clinical
    # cohort files work out of the box with a plain `pip install neurotcs`:
    #   pyreadr    -> R data (.rds/.rdata/.rda), e.g. the ADNIMERGE2 package
    #   pyreadstat -> SPSS (.sav/.zsav) with value labels applied
    # Both ship binary wheels for the common platforms. SAS (.sas7bdat) and
    # Stata (.dta) already use pandas' built-in readers. PDF stays an opt-in
    # extra by design (table extraction is gated behind an explicit safety
    # flag, not just a package).
    "pyreadr>=0.4.7",
    "pyreadstat>=1.2",
]

[project.optional-dependencies]
# 'spss' and 'radni' are retained as BACKWARD-COMPATIBLE ALIASES: as of v1.73.0
# their packages (pyreadstat, pyreadr) ship in core, so `pip install neurotcs`
# already reads SPSS and R data. Existing instructions like
# `pip install neurotcs[radni]` keep working (they just re-pin a core dep).
spss = [
    "pyreadstat>=1.2",
]
radni = [
    "pyreadr>=0.4.7",
]
pdf = [
    # PDF table extraction is an explicit opt-in (gated behind an allow-pdf
    # safety flag, not just this package): a clinical auditor must not silently
    # infer table structure from a PDF. Kept optional by design.
    "pdfplumber>=0.10",
]
formats = [
    "pyreadstat>=1.2",
    "pdfplumber>=0.10",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.8",
]
fhir = [
    "fhir.resources>=7.0",
]

[project.scripts]
neurotcs = "neurotcs.cli:main"
neurotcs-audit = "neurotcs.audit_core.cli:main"

[project.urls]
Homepage = "https://github.com/DrMaruf1991/NeuroTCS"
Repository = "https://github.com/DrMaruf1991/NeuroTCS"
Issues = "https://github.com/DrMaruf1991/NeuroTCS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neurotcs.rulepack" = ["rules/**/*.yaml"]
"neurotcs.clinical_ranges" = ["ranges/**/*.yaml"]
"neurotcs.cross_sheet" = ["invariants/**/*.yaml"]
"neurotcs.orchestration" = ["*.yaml"]
"neurotcs.input_contract.v1_0" = ["schemas/*.json", "SPECIFICATION.md"]
"neurotcs.input_contract.v1_1" = ["schemas/*.json", "SPECIFICATION.md"]
"neurotcs.input_contract.v1_2" = ["schemas/*.json", "SPECIFICATION.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "B905", "B007", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
# Type-checking is ADVISORY (not yet a blocking CI gate). As of v1.75.0 mypy
# runs clean of the high-severity classes that indicate runtime bugs (None
# dereferences, wrong return-arity, missing annotations -- all fixed). A small
# baseline of ~15 lower-risk findings remains (flag-type union refinements and
# float()-on-Optional guards in cross_sheet/cli/conversion paths); these are
# tracked for a focused typing pass and do not affect runtime behavior (the full
# test suite and the v3 invariant are the behavioral guarantee). Run locally
# with: python -m mypy src/neurotcs --ignore-missing-imports
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
