[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotcs"
version = "1.1.0"
description = "Citation-locked, fail-closed longitudinal medical AI audit framework (NeuroTCS / temporalmetric)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Marufjon Salokhiddinov, MD PhD", email = "drmaruf1991@gmail.com" },
]
maintainers = [
    { name = "Marufjon Salokhiddinov, MD PhD", email = "drmaruf1991@gmail.com" },
]
keywords = [
    "medical-ai",
    "longitudinal",
    "audit",
    "clinical-trial",
    "regulatory",
    "neuroimaging",
    "alzheimer",
    "parkinson",
    "multiple-sclerosis",
    "oncology",
    "recist",
    "irecist",
    "stroke",
    "fleischner",
    "fda",
    "fhir",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.7",
]
adni = [
    "pyreadr>=0.4.7",
    "pyarrow>=14.0",
]
audit = [
    "numpy>=1.24",
    "scipy>=1.11",  # for matrix exponential in audit_core
]
fhir = [
    "fhir.resources>=7.0",
]

[project.urls]
Homepage = "https://github.com/DrMaruf1991/NeuroTCS"
Repository = "https://github.com/DrMaruf1991/NeuroTCS"
Documentation = "https://github.com/DrMaruf1991/NeuroTCS/blob/main/README.md"
Issues = "https://github.com/DrMaruf1991/NeuroTCS/issues"
Specification = "https://github.com/DrMaruf1991/NeuroTCS/blob/main/docs/spec/temporalmetric_v1.6_FINAL.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neurotcs.rulepack" = ["rules/**/*.yaml"]
"neurotcs.input_contract.v1_0" = ["schemas/*.json", "SPECIFICATION.md"]
"neurotcs.input_contract.v1_1" = ["schemas/*.json", "SPECIFICATION.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".github", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (Pydantic Field uses these)
]

[tool.ruff.lint.per-file-ignores]
# Test files use common testing idioms that lint doesn't love:
"tests/**/*.py" = [
    "B011",  # `assert False` in tests — fine, tests don't run under -O
    "B905",  # `zip()` without strict — fine in tests
    "B007",  # unused loop var — fine in tests iterating for side effects
    "E402",  # module-level import not at top — fine after sys.path shims
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --color=yes"
