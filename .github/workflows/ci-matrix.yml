name: CI matrix (cross-platform × Python)

# Runs the framework-only test suite across {ubuntu, windows} × {Python 3.10, 3.11, 3.12, 3.13}.
# Cohort tests are excluded (they require DUA-controlled data not available in CI).
# This complements ci.yml which runs the full suite on ubuntu-latest + Python 3.12.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  framework-tests-matrix:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev tools
        run: |
          pip install -e .
          pip install pytest ruff

      - name: Lint with ruff (blocking)
        run: ruff check src/ tests/ scripts/

      - name: Framework-only pytest (cohort tests excluded — expect 397 passed)
        run: |
          python -m pytest tests/ -q --tb=short ^
            --ignore=tests/audit_core/test_real_adni_audit.py ^
            --ignore=tests/audit_core/test_real_oasis3_audit.py ^
            --ignore=tests/audit_core/test_real_nacc_audit.py ^
            --ignore=tests/audit_core/test_real_miriad_audit.py ^
            --ignore=tests/audit_core/test_real_miriad_fairness_audit.py ^
            --ignore=tests/audit_core/test_four_cohort_triangulation.py
        if: runner.os == 'Windows'
        shell: cmd

      - name: Framework-only pytest (cohort tests excluded — expect 397 passed)
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/audit_core/test_real_adni_audit.py \
            --ignore=tests/audit_core/test_real_oasis3_audit.py \
            --ignore=tests/audit_core/test_real_nacc_audit.py \
            --ignore=tests/audit_core/test_real_miriad_audit.py \
            --ignore=tests/audit_core/test_real_miriad_fairness_audit.py \
            --ignore=tests/audit_core/test_four_cohort_triangulation.py
        if: runner.os == 'Linux'

      - name: Smoke-test examples (syntax only)
        run: |
          python -c "import ast; ast.parse(open('examples/adni_audit_demo.py').read())"
          python -c "import ast; ast.parse(open('examples/oasis3_audit_demo.py').read())"

      - name: Verify planned-module import hook fires correctly
        run: |
          python -c "
          import sys
          import neurotcs
          assert neurotcs.__version__.startswith('1.8.'), f'Bad version: {neurotcs.__version__}'
          ok = 0
          for mod in ['neurotcs.validation_harness', 'neurotcs.output_schema']:
              try:
                  __import__(mod)
                  print(f'FAIL: {mod} should have raised ImportError')
                  sys.exit(1)
              except ImportError as e:
                  if 'roadmap' in str(e) and 'v1.9' in str(e):
                      ok += 1
                  else:
                      print(f'FAIL: {mod} raised wrong error: {e}')
                      sys.exit(1)
          print(f'Import hook OK: {ok}/2 planned modules raise helpful ImportError')
          "

      - name: Verify reference_adapters reorganization (v1.8.1)
        run: |
          python -c "
          # New path works
          from neurotcs.reference_adapters.adni_categorical_submission import hash_patient_id as new_h
          # Old path works via shim (with DeprecationWarning)
          import warnings
          with warnings.catch_warnings(record=True) as w:
              warnings.simplefilter('always')
              from neurotcs.input_contract.v1_1.adapters.adapter_adni import hash_patient_id as old_h
              assert any(issubclass(x.category, DeprecationWarning) for x in w), 'shim did not emit DeprecationWarning'
          assert new_h(1) == old_h(1), 'shim breaks identity'
          print('reference_adapters reorganization OK')
          "
