name: reproducibility

# Proves NeuroTCS reproduces its behavior across operating systems and Python
# versions -- the "two-machine / containerized / macOS reproducibility" item.
# Each cell installs the LOCKED dependency closure, installs the package without
# pulling new deps, runs the full test suite, and asserts the package reports
# the expected version. The audit_id invariants are exercised by the suite
# itself (tests/validation, tests/threshold_derivation, the rulepack tests).
#
# This complements (does not replace) the primary ci.yml lint+test gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Install the LOCKED closure first. On the canonical interpreter (3.12)
      # this is the exact reproducibility set; on 3.10/3.11 pip may back-solve a
      # compatible build of a pinned dep, which still proves cross-version
      # behavioral reproducibility (the suite + invariants must hold).
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Install NeuroTCS (no new deps)
        run: python -m pip install --no-deps -e .

      - name: Assert reported version
        shell: python
        run: |
          import neurotcs, pathlib, re
          v = neurotcs.__version__
          txt = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.MULTILINE)
          assert m and m.group(1) == v, f"version drift: import={v} pyproject={m and m.group(1)}"
          print("version OK:", v)

      - name: Run full test suite
        run: python -m pytest -q

  # The canonical-interpreter cell additionally publishes the audit_id evidence
  # so reviewers can see the invariant values without reading test logs.
  invariant-evidence:
    name: audit_id invariant (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run invariant + reproducibility tests
        run: |
          python -m pytest -q \
            tests/validation \
            tests/threshold_derivation \
            tests/docs/test_reproducibility_structure.py
