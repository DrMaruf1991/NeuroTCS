name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install neurotcs (editable) + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type-check with mypy
        run: mypy src/neurotcs || true  # don't fail build on mypy yet

      - name: Run rule pack tests
        run: python tests/rulepack/test_rulepack.py

      - name: Run input contract v1.0 tests
        run: python tests/input_contract/test_v1_0.py

      - name: Run input contract v1.1 tests
        run: python tests/input_contract/test_v1_1.py

      - name: Verify all rule packs load
        run: |
          python -c "
          from neurotcs import list_rulepacks
          packs = list_rulepacks()
          invalid = [p for p in packs if p.get('status') == 'INVALID']
          assert not invalid, f'Invalid: {invalid}'
          assert len(packs) == 8, f'Expected 8 packs, got {len(packs)}'
          production = [p for p in packs if p['status'] == 'production']
          assert len(production) == 8, f'Expected 8 production, got {len(production)}'
          print(f'  All {len(packs)} rule packs load as production')
          "

      - name: Verify transcription audits present
        run: |
          python -c "
          from pathlib import Path
          required = [
              'ad_niaaa_2018.md', 'ad_aa_2024.md',
              'pd_hoehn_yahr.md', 'ms_mcdonald_2024.md',
              'oncology_recist_1_1.md', 'oncology_irecist.md',
              'stroke_mrs_followup.md', 'lung_nodule_fleischner_2017.md',
          ]
          for f in required:
              p = Path('docs/transcription_audit') / f
              assert p.exists(), f'Missing: {p}'
          print(f'  All {len(required)} transcription audits present')
          "

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
